server:
  port: 4888
  mode: debug  # debug / release
  web_dist_dir: ""  # 可选：前端构建产物目录，设置后由后端托管 SPA 静态资源
  public_url: ""  # 可选：外部可访问基址（如 https://fs.example.com）；启用自动化（INT-90）前必须配置，也可用环境变量 FAST_SHIP_SERVER_PUBLIC_URL

database:
  path: ./data/fast_ship.db
  log_sql: false  # 是否打印 SQL 日志

jwt:
  secret: "change-me-in-production"
  expire_hours: 24
  refresh_expire_hours: 168  # 7 days

upload:
  max_file_size: 524288000  # 500MB
  storage_path: ./data/uploads

encryption:
  key: "change-me-32-bytes-in-production"  # 32 字节 AES 密钥

issues:
  auto_sync_enabled: true
  auto_sync_on_startup: true
  auto_sync_interval_minutes: 15

# 订阅套餐额度（INT-109）：定时抓取各 AI 编码服务额度，只读展示。
# enabled / run_on_startup 的缺省为 true：老配置文件没有 quota 段时升级后仍会
# 定时抓取，不需要手动补配置；显式写 false 才关闭。
# base_urls 仅部署/测试覆盖供应商 origin 用，如 {"factory": "http://127.0.0.1:5099"}。
quota:
  enabled: true
  interval_minutes: 10
  run_on_startup: true
  max_concurrency: 3
  request_timeout_seconds: 20
  manual_refresh_cooldown_seconds: 30
  base_urls: {}

# Fast Ship 自身日志（INT-94）：独立 SQLite 日志库，异步批量写入，只读查询见 /api/self-logs
logging:
  self_log_path: ./data/self_logs.db  # 独立日志库文件，不与业务库混用
  retention_days: 7  # 保留天数
  max_entries: 1000000  # 最大条数上限
  cleanup_interval_minutes: 60  # 清理周期
  min_level: info  # 入库最低级别（debug/info/warn/error）；stdout 输出不受影响

github_app:
  # 部署级 GitHub App（INT-129）的 config 兜底：管理员在「设置 → 集成」保存后
  # 以数据库配置为准，本节只在没有任何数据库配置时生效。
  app_id: ""  # GitHub App ID；留空且无数据库配置时 PR 评审不可用
  private_key_path: ""  # App 私钥 PEM 文件路径；网页保存后密文落库，不进环境变量正文
  webhook_secret: ""  # webhook 验签密钥；数据库行存在时以行内密钥为准（为空即拒收）
  api_base_url: ""  # GitHub API base；留空取官方 https://api.github.com（本地端到端可指向 mock GitHub）
  fake: false  # 仅 server.mode=debug 允许 true：注入假 GitHub 实现（本地自测，不读部署配置）

# 机器人（INT-102）：上下文压缩阈值、记忆限额与夜间整理时程。
# 全部为部署级配置；三个辅助模型留空即继承各机器人自己的主模型。
bots:
  context:
    window_tokens: 32768    # 默认上下文窗口；接口 usage 缺失时按 UTF-8 字节/3.5 粗估
    model_windows: {}       # 按实际模型名覆盖窗口值，如 {"my-model": 65536}
    compression_ratio: 0.75 # 估算达到窗口该比例时进入压缩周期
    target_ratio: 0.45      # 压缩后目标体量占触发阈值的比例
    protect_user_turns: 3   # 保护最近的用户轮数（最小 3）
    fold_large_ratio: 0.01  # 工具结果投影超过窗口该比例算「大结果」可折叠
    fold_min_clear_ratio: 0.02  # 累计净清除量达到窗口该比例才批量发布折叠
    summary_model: ""       # 摘要模型；留空继承机器人主模型
    archive_model: ""       # 压缩前静默存档模型；留空继承机器人主模型
  memory:
    user_max_chars: 1500    # USER.md 注入字符上限
    memory_max_chars: 8000  # MEMORY.md 注入字符上限
    nightly_model: ""       # 夜间整理模型；留空继承机器人主模型
    timezone: UTC           # IANA 时区：夜间「当地日期」与 daily 文件命名
    nightly_time: "03:00"   # 当地时区每日触发时刻（HH:MM）
  runtime:
    prompt_cache_retain_minutes: 10  # 前缀缓存保留窗口：主线入口激活仅在无主线请求或最近请求超过该窗口时执行，窗口内推迟到压缩边界；显式配 0 禁用推迟（入口始终激活）
