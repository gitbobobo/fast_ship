server:
  port: 4888
  mode: debug  # debug / release
  web_dist_dir: ""  # 可选：前端构建产物目录，设置后由后端托管 SPA 静态资源
  public_url: ""  # 可选：外部可访问基址（如 https://fs.example.com）；启用自动化（INT-90）前必须配置，也可用环境变量 FAST_SHIP_SERVER_PUBLIC_URL

database:
  path: ./data/fast_ship.db
  log_sql: false  # 是否打印 SQL 日志

jwt:
  secret: "change-me-in-production"
  expire_hours: 24
  refresh_expire_hours: 168  # 7 days

upload:
  max_file_size: 524288000  # 500MB
  storage_path: ./data/uploads

encryption:
  key: "change-me-32-bytes-in-production"  # 32 字节 AES 密钥

issues:
  auto_sync_enabled: true
  auto_sync_on_startup: true
  auto_sync_interval_minutes: 15

github_app:
  app_id: ""  # GitHub App ID；留空则 PR 评审（INT-93）端点按未配置处理
  private_key_path: ""  # App 私钥 PEM 文件路径；私钥不进库、不进环境变量正文
  webhook_secret: ""  # webhook 验签密钥；留空时 POST /api/github/webhooks 一律 503
  fake: false  # 仅 server.mode=debug 允许 true：注入假 GitHub 实现（本地自测）
