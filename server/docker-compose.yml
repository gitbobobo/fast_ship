services:
  app:
    build: .
    ports:
      - "4888:4888"
    environment:
      # 必须注入随机值：缺省或公开占位值会被启动校验拒绝（INT-221）。
      # ENCRYPTION_KEY 支持 16/24/32 字节，推荐 32 字节（如 openssl rand -hex 16 的输出）。
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - app-data:/app/data

volumes:
  app-data:
