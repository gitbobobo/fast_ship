      responses:
        '200':
          description: 集成投影
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ForgeIntegration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员（40305）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 集成不存在（40435）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [deployment]
      operationId: updateForgeIntegration
      summary: 部分更新集成（仅管理员）
      description: |
        仅管理员。部分更新：省略的字段保持不变。base_url / api_base_url 变更时
        重新做 SSRF 校验（含 DNS）；allow_private_network 关闭会按公网口径
        复核现有基址。token 省略/null = 保留、空串 = 40001（必需凭证不可清空）；
        webhook_secret / ca_cert_pem 省略或 null = 保留、空串 = 清空；
        api_base_url 空串 = 重置为
        `{base_url}/api/v1`。内置 github-default 不可通过本端点修改（40001）。
        base_url 归一主机变更等同迁移全部项目绑定：仍有项目引用时拒绝
        （40935，消息列引用项目名），须先解除项目绑定或走「新建集成 +
        项目逐个改绑」的显式迁移路径。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ForgeIntegrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateForgeIntegrationRequest'
      responses:
        '200':
          description: 更新后的集成投影
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ForgeIntegration'
        '400':
          description: 参数非法（40001）：内置集成不可修改、基址校验失败、CA PEM 不可解析等
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员（40305）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 集成不存在（40435）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [deployment]
      operationId: deleteForgeIntegration
      summary: 删除集成（仅管理员）
      description: |
        仅管理员。内置 github-default 不可删除（40001）；仍被项目
        （code_integration_id / public_integration_id 任一）引用时拒绝（40935），
        消息列出引用项目名。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ForgeIntegrationId'
      responses:
        '200':
          description: 删除成功（data 为 null）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          description: 内置集成不可删除（40001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员（40305）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 集成不存在（40435）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 仍被项目引用（40935，消息含项目名）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/deployment/integrations/{id}/test:
    post:
      tags: [deployment]
      operationId: testForgeIntegration
      summary: 连接检测（仅管理员）
      description: |
        仅管理员。用配置的 token 调 Forgejo `GET {api_base_url}/version` 与
        `GET {api_base_url}/user`，返回实例版本与机器人账号名。检测结论随响应
        返回、不落库；token 被拒绝时 status=invalid，网络/5xx 时 status=failed，
        都不是 500。内置 github-default 走本端点报错（40001），引导用已有的
        `POST /api/deployment/github-app/test`。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ForgeIntegrationId'
      responses:
        '200':
          description: 检测结论（status 含失败口径，非 500）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ForgeIntegrationTest'
        '400':
          description: 内置集成不支持本端点（40001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员（40305）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 集成不存在（40435）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

