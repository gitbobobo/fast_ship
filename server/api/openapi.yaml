    LogLevel:
      type: string
      enum: [debug, info, warn, error, fatal]
      x-go-type: model.LogLevel
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    VersionStatus:
      type: string
