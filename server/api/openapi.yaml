openapi: "3.0.3"
info:
  title: "Fast Ship API"
  version: "0.1.42"
  license:
    name: MIT
  description: |
    Fast Ship 项目管理工具的 HTTP API。覆盖 `server/internal/router/router.go` 注册的全部 /api 路由；
    SPA 静态资源与 NoRoute 回退（`web.go`）不在本文档范围。

    约定：
    - 所有 JSON 响应统一信封 `{code, message, data}`：`code=0` 成功；非 0 为业务错误码，`data` 为 null。
    - 认证方式为 `Authorization: Bearer <token>`；token 为 JWT（登录/注册签发）或 `fsk_` 开头的 API Key，服务端按前缀区分。
    - 部分二进制资源端点（头像、Issue 图片、安装包下载、GitHub 媒体代理）额外接受 `?token=<token>` query 凭证。
    - 除特别注明外，字段级权限写在各字段 description 中：「仅 JWT」表示 API Key 携带该字段会返回 403（40301）；「仅 API Key」表示 JWT 调用返回 403（40303）。
servers:
  - url: /
    description: 与后端服务同源
tags:
  - name: auth
    description: 注册、登录、Token 与当前用户
  - name: users
    description: 用户资源（头像等）
  - name: ai
    description: AI 设置、标题/清单生成与全局提示词
  - name: api-keys
    description: API Key 管理（仅 JWT）
  - name: projects
    description: 项目 CRUD 与 GitHub 分支
  - name: versions
    description: 版本 CRUD、前置校验与发货
  - name: issues
    description: Issue CRUD、过滤、同步、清单、发货钩子与图片附件
  - name: collab
    description: Issue 人机协作区（consensus / summary）
  - name: recommendations
    description: Agent 推荐任务队列
  - name: artifacts
    description: 版本安装包上传、下载与删除
  - name: logs
    description: 日志分片上传与查询
  - name: documents
    description: 项目文档
  - name: dashboard
    description: 看板概览
  - name: media
    description: GitHub 媒体代理
  - name: screenshots
    description: 项目截图库（按界面聚合，版本全量保留）

paths:
  /api/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: 注册新用户
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功，返回 token 与用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 登录（用户名或邮箱）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，返回 token 与用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 用户名/邮箱或密码错误（40103）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: 刷新 access token（轮换 refresh token）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 返回新的 token 与新的 refresh token（旧 refresh token 被轮换）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh Token 无效或已过期（40105）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 登出（将当前 JWT 加入黑名单，可选同时吊销 refresh token）
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: 可选，fsr_ 开头的 refresh token，传入则一并吊销
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 获取当前用户信息
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [auth]
      operationId: updateMe
      summary: 更新当前用户资料（用户名/邮箱）
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 更新后的用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/password:
    put:
      tags: [auth]
      operationId: updatePassword
      summary: 修改密码
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 旧密码错误（40103）或凭证无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/avatar:
    post:
      tags: [auth]
      operationId: uploadAvatar
      summary: 上传头像（multipart/form-data，字段名 file；≤5MB，jpg/png/gif/webp，会嗅探内容必须为图片）
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 图片文件，≤5MB，扩展名限 jpg/jpeg/png/gif/webp 且内容须为图片
      responses:
        '200':
          description: 更新后的用户信息（avatar_url 指向 /api/avatars/:uid/:filename）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/avatars/{uid}/{filename}:
    get:
      tags: [users]
      operationId: getAvatar
      summary: 获取用户头像图片
      description: "返回头像二进制内容（image/*），带 `Cache-Control: private, max-age=3600`。支持 Authorization 头或 `?token=` query 凭证。"
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          description: 用户 ID（不得包含 `..` 或 `/`）
        - name: filename
          in: path
          required: true
          schema:
            type: string
          description: 头像文件名（不得包含 `..` 或 `/`）
        - $ref: '#/components/parameters/QueryToken'
      responses:
        '200':
          description: 头像图片二进制内容
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/github/media-proxy:
    get:
      tags: [media]
      operationId: githubMediaProxy
      summary: GitHub 媒体代理（图片/视频）
      description: |
        代理拉取并缓存 GitHub 附件/图片等媒体 URL，支持 `Range` 头与缓存命中直出。
        错误响应为 `text/plain`（非 JSON 信封）：400 invalid url、415 unsupported media type、
        其他上游错误按状态码透传或 502。同一路径另注册 HEAD 变体，语义同 GET 但不返回 body。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: 要代理的媒体 URL（会做 HTML unescape 与多至两次 URL decode）
        - $ref: '#/components/parameters/QueryToken'
      responses:
        '200':
          description: 上游媒体内容（透传 Content-Type 与缓存控制头）
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Range 请求的部分内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: 无效的媒体 URL（text/plain）
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 缓存文件不存在（text/plain）
          content:
            text/plain:
              schema:
                type: string
        '413':
          description: 上游资源超过缓存大小上限时改为透传（text/plain）
          content:
            text/plain:
              schema:
                type: string
        '415':
          description: 不支持的媒体类型（text/plain）
          content:
            text/plain:
              schema:
                type: string
        '502':
          description: 拉取上游媒体失败（text/plain）
          content:
            text/plain:
              schema:
                type: string
    head:
      tags: [media]
      operationId: githubMediaProxyHead
      summary: GitHub 媒体代理（HEAD，仅头信息）
      description: 与 GET 语义相同但不返回 body，用于探测 Content-Length/Type。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: 要代理的媒体 URL
        - $ref: '#/components/parameters/QueryToken'
      responses:
        '200':
          description: 仅响应头
        '400':
          description: 无效的媒体 URL（text/plain）
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: 拉取上游媒体失败（text/plain）
          content:
            text/plain:
              schema:
                type: string

  /api/issues/assets/{aid}/content:
    get:
      tags: [issues]
      operationId: getIssueAssetContent
      summary: 获取 Issue 图片附件内容
      description: "返回附件二进制内容（实际 mime type，带 `Cache-Control: private, max-age=300`）。草稿附件与已挂载附件均可。同一路径另注册 HEAD 变体，语义同 GET 但不返回 body。"
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: aid
          in: path
          required: true
          schema:
            type: string
          description: 附件 ID（IssueAsset 或 IssueDraftAsset 的 UUID）
        - $ref: '#/components/parameters/QueryToken'
      responses:
        '200':
          description: 附件二进制内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    head:
      tags: [issues]
      operationId: getIssueAssetContentHead
      summary: 获取 Issue 图片附件头信息（HEAD）
      description: 与 GET 语义相同但不返回 body。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: aid
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/QueryToken'
      responses:
        '200':
          description: 仅响应头
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/ai/settings:
    get:
      tags: [ai]
      operationId: getAISettings
      summary: 获取 AI 设置
      security:
        - jwtAuth: []
      responses:
        '200':
          description: AI 设置（api_key 永不回显，configured 表示是否已配置）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AISettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [ai]
      operationId: updateAISettings
      summary: 更新 AI 设置
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAISettingsRequest'
      responses:
        '200':
          description: 更新后的 AI 设置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AISettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/ai/generate-title:
    post:
      tags: [ai]
      operationId: generateIssueTitle
      summary: 根据正文生成 3 个候选标题
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  description: 正文内容；trim 后须 ≥10 个字符（rune），服务端截断至 10000 rune
      responses:
        '200':
          description: 候选标题列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GenerateTitleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 未配置 AI 设置（40407）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: AI 服务调用失败（50201）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/issue-prompts:
    get:
      tags: [ai]
      operationId: getIssuePrompts
      summary: 获取全局问题提示词配置
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 提示词列表；未配置时 prompts 为 null（前端兜底默认提示词）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IssuePrompts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [ai]
      operationId: updateIssuePrompts
      summary: 更新全局问题提示词配置（整体覆盖）
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompts]
              properties:
                prompts:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/IssuePromptItem'
      responses:
        '200':
          description: 更新后的提示词列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IssuePrompts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/api-keys:
    get:
      tags: [api-keys]
      operationId: listApiKeys
      summary: 列出当前用户的 API Key
      security:
        - jwtAuth: []
      responses:
        '200':
          description: API Key 列表（key 字段不回显）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [api-keys]
      operationId: createApiKey
      summary: 创建 API Key
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '200':
          description: 创建成功；完整 API Key（fsk_ 前缀）仅在本次响应的 key 字段中出现一次
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/api-keys/{id}:
    delete:
      tags: [api-keys]
      operationId: deleteApiKey
      summary: 删除 API Key
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/dashboard/overview:
    get:
      tags: [dashboard]
      operationId: dashboardOverview
      summary: 看板概览（各项目 open issue 数 + 近 30 天每日解决数）
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: 概览数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DashboardOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: 分页列出当前用户的项目
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize20'
      responses:
        '200':
          description: 项目分页列表
          content:
            application/json:
              schema:
                allOf:
