    get:
      tags: [github-tokens]
      operationId: listGithubTokens
      summary: 列出当前用户的 GitHub Token
      description: 不回显明文；附带每条的引用项目与检测摘要。列表不触发任何 GitHub 请求。
      security:
        - jwtAuth: []
      responses:
        '200':
          description: Token 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GitHubToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [github-tokens]
      operationId: createGithubToken
      summary: 添加 GitHub Token
      description: |
        同一用户下明文完全相同（SHA-256 指纹一致）的 Token 复用已有记录：返回已有记录，
        不修改其标题。新建成功后服务端立即做一次只读检测（GET /user）；检测失败
        （网络 / GitHub 5xx）或凭证无效（401）仍然保存，响应中 detection_status
        为 failed / invalid，HTTP 状态仍是 200。
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGitHubTokenRequest'
      responses:
        '200':
          description: 保存成功（明文重复时返回已有记录）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
