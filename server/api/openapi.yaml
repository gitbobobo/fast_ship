  /api/environments/{id}/attachments:
    post:
      tags: [environments]
      operationId: uploadT3Attachment
      summary: 上传图片附件到 T3 环境（流转发，不落 Fast Ship 盘）
      description: |
        浏览器 → Fast Ship → T3：先经 WS RPC `attachments.createUploadUrl`
        取得同 origin 签名上传 URL，再把请求体原始字节流式 POST 到该 URL，
        返回可直接放进 messages/threads 请求 `attachments` 数组的
        ChatImageAttachment 元数据。字节不落 Fast Ship 盘、不 base64、
        不接受 multipart。仅支持 PNG/JPEG/GIF/WebP，单图上限 10MiB
        （超限 40001）。请求头 `Content-Type` 即图片 MIME，
        `X-File-Name` 提供文件名（缺省 `image.<ext>`）。
      parameters:
        - $ref: '#/components/parameters/T3EnvironmentId'
        - name: X-File-Name
          in: header
          required: false
          schema:
            type: string
            maxLength: 255
          description: 文件显示名（进入 T3 后的附件 name）
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 上传成功，返回附件元数据
