                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BotCallResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bots/{id}/calls/{callId}/decision:
    post:
      tags: [bots]
      operationId: decideBotCall
      summary: 确认卡片决定（approve/reject/always_allow）
      description: |
        只对保存好的调用参数决策，不能同时修改参数。approve：CAS 为 queued 并
        唤醒后台 worker；reject：置 rejected 并落唯一终态结果；always_allow：
        同一事务建立与本次调用相同 action/范围/字段约束的授权并批准当前调用。
        重复相同决定幂等返回；相互冲突或状态已变化返回 40926。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
        - name: callId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotCallDecisionRequest'
      responses:
        '200':
          description: 决定已生效（返回最新调用状态）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BotToolCall'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 调用状态已变化或决定冲突（40926）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bots/{id}/calls/{callId}/cancel:
    post:
      tags: [bots]
      operationId: cancelBotCall
      summary: 取消后台调用
      description: |
        待确认/queued 直接 CAS 终结（未执行，effect_may_have_occurred=false）；
        running 记录取消并取消其 context，worker 落唯一终态且标记
        effect_may_have_occurred=true（不声称回滚）。已终结调用幂等返回现状。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
        - name: callId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 取消结果（返回最新调用状态）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BotToolCall'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

