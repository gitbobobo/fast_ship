  /api/bots/{id}/calls/{callId}/result:
    get:
      tags: [bots]
      operationId: getBotCallResult
      summary: 读取调用的完整瘦身结果（UI 查看）
      description: 模型侧的分页续读走 fs_result.read 工具；本端点返回完整结果原文。
      security:
