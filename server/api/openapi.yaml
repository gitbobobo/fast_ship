  /api/projects/{id}/logs:
    post:
      tags: [logs]
      operationId: uploadLogs
      summary: 上传日志分片（仅 API Key；JWT 返回 40303）
      description: |
        同一项目同 `run_id` 合并为一次运行；`(run_id, chunk_id)` 幂等，重复 chunk 返回 200 且 `duplicate: true`、`accepted_count: 0`，不插入。
        `source`/`description` 仅创建该运行时写入（先到先得）。body 总大小 ≤4MB（超出裸 413）；一次运行累计 ≤50000 条，超出整包拒绝（40909）。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadLogsRequest'
      responses:
        '200':
          description: 上传结果（含 accepted_count 与 duplicate）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadLogsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: JWT 调用仅限 API Key 的端点（40303）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 该运行日志条数已达上限（40909）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          $ref: '#/components/responses/RequestEntityTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [logs]
      operationId: listLogEntries
      summary: 分页查询日志条目
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: run_id
          in: query
          required: false
          schema:
            type: string
          description: 按运行 ID 过滤
        - name: level
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LogLevel'
          description: 按日志级别过滤
        - name: entry_source
          in: query
          required: false
          schema:
            type: string
          description: 按条目 source 过滤
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: 按 message 内容过滤
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 起始时间（RFC3339），按条目 timestamp 过滤
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 结束时间（RFC3339）
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [timestamp_desc, timestamp_asc]
            default: timestamp_desc
          description: 排序；非法值返回 40001
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize50'
      responses:
        '200':
          description: 日志条目分页列表
