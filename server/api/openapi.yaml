                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuotaProbe'
        '400':
          description: 参数无效（40001）；供应商未知（40030）；凭据字段缺失或为空（40031）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/quota/device-authorizations:
    post:
      tags: [quota]
      operationId: startQuotaDeviceAuthorization
      summary: 发起浏览器设备授权
      description: |
        供支持设备授权的供应商（provider.device_authorization = true，目前只有 opendesign），
        在服务端向上游发起设备授权并建立内存会话，返回 pending 视图；前端拿 user_code 与
        activation_url 引导用户在浏览器批准，再按 poll_interval_seconds 轮询 GET。
        不带 account_id 时批准后自动新建额度账号；带上 account_id 则为该已有账号整组换
        凭据（账号不存在或属于他人返回 40430）。
        会话只存内存，进程重启即丢，之后 GET 返回 40431。deviceSecret 永不出现在任何响应里。
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartQuotaDeviceAuthorizationRequest'
      responses:
        '200':
          description: 已发起（pending）；同时表示上游会话建立成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuotaDeviceAuthorization'
        '400':
          description: 参数无效（40001，含空白标签）；供应商未知（40030）；该供应商不支持设备授权（40032）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 要换凭据的目标账号不存在或属于其他用户（40430）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: 额度供应商授权服务不可用或响应缺关键字段（50204）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/quota/device-authorizations/{id}:
    get:
      tags: [quota]
      operationId: getQuotaDeviceAuthorization
      summary: 查询设备授权会话状态
      description: |
        按会话 ID 查询授权进度；距上次轮询超过 poll_interval_seconds 且仍 pending 时，
        服务端代为向上游轮询一次。approved 表示已自动创建额度账号（account_id 为新账号 ID）；
        expired/denied/invalid 为终态，error 给用户可读原因，前端提示重新发起。
        会话是本人资源，他人的会话与不存在的会话一样返回 40431。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/QuotaDeviceAuthorizationId'
      responses:
        '200':
          description: 会话当前状态（网络抖动或上游 5xx 时保持 pending，前端按节奏再轮询即可）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuotaDeviceAuthorization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 会话不存在、已过期或属于其他用户（40431）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [quota]
      operationId: cancelQuotaDeviceAuthorization
      summary: 取消设备授权会话
      description: 删除内存会话（前端关闭对话框 / 用户取消时调用）；不存在的会话返回 40431。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/QuotaDeviceAuthorizationId'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 会话不存在、已过期或属于其他用户（40431）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

