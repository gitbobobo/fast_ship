        locale:
          type: string
          nullable: true
          description: 语言（BCP 47 规范化大小写）；null 表示未标注
        theme:
          type: string
          nullable: true
          enum: [light, dark]
          description: 亮度主题；null 表示未标注
        mime_type:
          type: string
          description: 上传时内容嗅探得到的类型（image/png、image/jpeg、image/webp、image/gif 之一）
        file_size:
          type: integer
          format: int64
          description: 文件字节数
        width:
          type: integer
          description: 原图宽像素；0 表示未知
        height:
          type: integer
          description: 原图高像素；0 表示未知
        uploaded_by:
          type: string
          description: '用户名或 "API Key: <name>"'
        uploaded_at:
          type: string
          format: date-time
          description: 当前文件的上传时间；覆盖上传即更新，列表按它倒序
        created_at:
          type: string
          format: date-time
        content_url:
          type: string
          description: /api/screenshot-screens/{sid}/content?v=<uploaded_at 纳秒值>；v 随文件变化（覆盖上传即换 URL，浏览器缓存按完整 URL 记键），前端自行追加 &token=
    ScreenshotUploadResult:
      type: object
      required: [screen]
      properties:
        screen:
          $ref: '#/components/schemas/ScreenshotScreen'
    UpdateScreenshotScreenRequest:
      type: object
      description: 四字段均可选，出现才更新（三个维度允许空串清除为未标注）；都不传返回 40001；维度组合撞唯一约束返回 409（40921）
      properties:
        title:
          type: string
          maxLength: 200
          description: 界面标题（≤200 字符）；空串回退显示 screen_key
        platform:
          type: string
          maxLength: 100
          description: 平台（开放词表，trim+小写，≤100 字符）；空串清除为未标注
        locale:
          type: string
          description: 语言（BCP 47，服务端规范化大小写，非法值 40001）；空串清除为未标注
        theme:
          type: string
          enum: [light, dark, ""]
          description: 亮度主题（严格 light|dark，其他值 40001）；空串清除为未标注

    # ---- screenshot annotations ----
    ScreenshotAnnotationStatus:
      type: string
      enum: [open, resolved]
      description: open=未解决，resolved=已解决

    ScreenshotAnnotationRect:
      type: object
      description: 像素矩形（原图坐标系）
      required: [x, y, width, height]
      properties:
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
        height:
          type: integer

    ScreenshotAnnotation:
      type: object
      description: 挂在某张截图上的「矩形框 + 文字」标注；坐标以图片宽高比例（0~1）存储
      required: [id, project_id, screen_id, issue_id, issue_reference, issue_title, screen_key, screen_title, screen_platform, screen_locale, screen_theme, image_url, image_width, image_height, outdated, x, y, width, height, pixel_rect, body, status, crop_url, created_by, created_at, updated_at, resolved_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        screen_id:
          type: string
          description: 所属截图 ID
        issue_id:
          type: string
          nullable: true
          description: 关联的本项目 Issue ID；未关联为 null。删除 Issue 只解除关联不删标注
        issue_reference:
          type: string
          nullable: true
          description: 关联 Issue 的短编号（INT-n / GH-n）；未关联为 null
        issue_title:
          type: string
          nullable: true
          description: 关联 Issue 的标题；未关联为 null
        screen_key:
          type: string
        screen_title:
          type: string
          description: 截图显示名；空串时客户端回退展示 screen_key
        screen_platform:
          type: string
          nullable: true
          description: 所属截图的平台；null 表示未标注
        screen_locale:
          type: string
          nullable: true
          description: 所属截图的语言；null 表示未标注
        screen_theme:
          type: string
          nullable: true
          description: 所属截图的亮度主题；null 表示未标注
        image_url:
          type: string
          description: 所在截图的原图地址（content_url，带 ?v= 修订参数）；追加 &token= 供 <img>
        image_width:
          type: integer
          description: 原图宽像素；0 表示未知
        image_height:
          type: integer
          description: 原图高像素；0 表示未知
        outdated:
          type: boolean
          description: 截图被覆盖更新后仍未「确认保留」；resolved 标注恒为 false
        x:
          type: number
          description: 框选矩形左上角横坐标 / 图宽（0~1）
        y:
          type: number
          description: 框选矩形左上角纵坐标 / 图高（0~1）
        width:
          type: number
          description: 框选矩形宽 / 图宽（0~1）
        height:
          type: number
          description: 框选矩形高 / 图高（0~1）
        pixel_rect:
          allOf:
            - $ref: '#/components/schemas/ScreenshotAnnotationRect'
          nullable: true
          description: 由比例坐标 × 原图尺寸换算的像素矩形；原图尺寸未知时为 null
        body:
          type: string
          description: 标注文字
        status:
          $ref: '#/components/schemas/ScreenshotAnnotationStatus'
        crop_url:
          type: string
          description: /api/screenshot-annotations/{aid}/crop?v=<所属截图 uploaded_at 纳秒值>；统一输出 PNG，v 随覆盖上传变化（浏览器缓存按完整 URL 记键），前端自行追加 &token=
        created_by:
          type: string
          description: '用户名或 "API Key: <name>"'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次标为已解决的时间；open 状态为 null

    ScreenshotAnnotationBatchRequest:
      type: object
      description: 对 filter 圈定的标注集执行批量动作；filter 缺省字段即不限制
      required: [action]
      properties:
        action:
          type: string
          enum: [confirm, resolve]
          description: confirm=确认保留（清除 outdated）；resolve=标记已解决；两者都只作用于 open 标注
        filter:
          type: object
          properties:
            platform:
              type: array
              items:
                type: string
              description: 平台多值；含 `__none__` 表示「未标注」（NULL）
            locale:
              type: array
              items:
                type: string
              description: 语言多值；含 `__none__` 表示「未标注」（NULL）
            theme:
              type: array
              items:
                type: string
                enum: [light, dark, "__none__"]
              description: 亮度多值；`__none__` 表示「未标注」（NULL）
            status:
              $ref: '#/components/schemas/ScreenshotAnnotationStatus'
            outdated:
              type: boolean
              nullable: true
              description: 按过期标记过滤；缺省不限制
            screen_id:
              type: string
              description: 只作用于该截图上的标注
    ScreenshotAnnotationBatchResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
          description: 实际更新的标注数

    CreateScreenshotAnnotationRequest:
      type: object
      required: [x, y, width, height, body]
      description: x/y/width/height 必填；字段缺省或传 null 一律 40001（nullable 仅为让服务端能区分缺省与显式 0）
      properties:
        x:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        y:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        width:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
        height:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          description: x+width ≤ 1 且 y+height ≤ 1，否则 40001
        body:
          type: string
          minLength: 1
          maxLength: 1000
          description: 标注文字（1~1000 字符）
        issue_id:
          type: string
          description: 可选；关联本项目内 Issue，缺省或空串 = 不关联

    UpdateScreenshotAnnotationRequest:
      type: object
      description: |
        指针语义：字段出现才更新，都不传返回 40001。
        JWT 可更新全部字段；API Key 只允许传 `{"status":"resolved"}`，其余字段或 status=open 返回 40301。
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
          description: 标注文字（1~1000 字符）
        status:
          $ref: '#/components/schemas/ScreenshotAnnotationStatus'
          description: open=重开（仅 JWT），resolved=标为已解决
        issue_id:
          type: string
          description: 空串=解除关联；非空须为本项目内 Issue（否则 40001）；不传或传 null = 保持不变

    T3EnvironmentAccess:
      type: string
      enum: [read-only, operate]
      description: |
        会话能力：仅当精确持有 `orchestration:operate` scope 时为 `operate`，
        否则 `read-only`。唯一判定依据是精确 token 的 scope 列；
        `read-only` 环境调用任何写入口返回 40300（重新配对后可操作）

    T3EnvironmentStatus:
      type: string
      enum: [ok, unreachable, repair, degraded]
      description: |
        探测状态：ok=Bearer 会话有效；unreachable=网络不可达/超时/5xx；
        repair=可达但凭证失效（Bearer 过期或被吊销），需重新配对；
        degraded=可达且凭证有效，但部分数据读取失败（如归档线程快照），
        其余数据仍返回

    T3Environment:
      type: object
      description: 已配对的 T3 环境连接；不泄漏任何凭证字段
      required: [id, name, address, status, scopes, access, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
          description: 从配对链接解析出的 T3 服务端基址（规范化 origin，如 https://host）
        status:
          $ref: '#/components/schemas/T3EnvironmentStatus'
        scopes:
          type: array
          items:
            type: string
          description: 该环境会话实际授予的 T3 scope 列表（配对时服务端授予，原样落库）
        access:
          $ref: '#/components/schemas/T3EnvironmentAccess'
        error:
          type: string
          description: 最近一次探测失败的说明；成功时省略
        updated_at:
          type: string
          format: date-time

    CreateT3EnvironmentRequest:
      type: object
      required: [name, pairing_url]
      properties:
        name:
          type: string
          minLength: 1
          description: 环境显示名；同一用户下唯一（重复返回 40912）
        pairing_url:
          type: string
          minLength: 1
          description: |
            配对链接：`t3 pair` 直接链接（`https://host/#token=code`，hash 优先，
            兼容 `?token=`）或 hosted 包装链接（`https://relay/?host=<backend>&token=code`）。
            协议支持 http/https/ws/wss；缺省协议时 IP 字面量补 http、其余补 https。

    UpdateT3EnvironmentRequest:
      type: object
      description: 指针语义：字段出现才更新，都不传返回 40001
      properties:
        name:
          type: string
          minLength: 1
        pairing_url:
          type: string
          description: 出现时重新配对（覆盖地址与 Bearer），用于修复 repair 状态

    T3DiscoveredProject:
      type: object
      description: 环境中发现的 T3 项目（绑定候选）
      required: [id, title]
      properties:
        id:
          type: string
          description: T3 projectId
        title:
          type: string
        workspace_root:
          type: string
          description: 项目主检出根目录；上游缺省时省略（此类项目不可绑定）

    T3EnvironmentProjects:
      type: object
      description: 单个环境的 T3 项目发现结果；该环境失败时 status/error 承载原因、projects 为空
      required: [environment_id, name, status, access, projects]
      properties:
        environment_id:
          type: string
        name:
          type: string
          description: 环境显示名
        status:
          $ref: '#/components/schemas/T3EnvironmentStatus'
        access:
          $ref: '#/components/schemas/T3EnvironmentAccess'
        error:
          type: string
          description: 该环境发现失败的说明；成功时省略
        projects:
          type: array
          items:
            $ref: '#/components/schemas/T3DiscoveredProject'

    ProjectT3Binding:
      type: object
      description: |
        Fast Ship 项目在某 T3 环境绑定的 T3 项目（INT-89）。t3_project_title /
        workspace_root 是绑定成功那一刻的快照：环境不可达时仍可展示；
        快照与最新发现不一致即失效绑定，需重新绑定
      required: [environment_id, environment_name, environment_status, t3_project_id, t3_project_title, workspace_root, created_at, updated_at]
      properties:
        environment_id:
          type: string
        environment_name:
          type: string
          description: 环境显示名（当前记录值）
        environment_status:
          $ref: '#/components/schemas/T3EnvironmentStatus'
        t3_project_id:
          type: string
          description: 该环境中的 T3 项目 ID
        t3_project_title:
          type: string
          description: 绑定时快照
        workspace_root:
          type: string
          description: 绑定时快照；启动线程据此解析 cwd
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpsertT3BindingRequest:
      type: object
      required: [t3_project_id]
      properties:
        t3_project_id:
          type: string
          minLength: 1
          description: 该环境中的 T3 项目 ID（来自 GET /api/environments/t3-projects 的 projects[].id）

    T3ThreadSummary:
      type: object
      required: [id, environment_id, environment_name, project_id, project_name, title, status, settled, branch, provider, model, updated_at, pull_request_count, run_status, pull_requests]
      properties:
        id:
          type: string
          description: T3 threadId
        environment_id:
          type: string
        environment_name:
          type: string
        project_id:
          type: string
        project_name:
          type: string
          description: 来自 WS shell 快照项目表，列表和详情均使用该来源
        title:
          type: string
        status:
          type: string
          enum: [running, waiting, idle, archived]
          description: |
            由 T3 归一化（对齐 T3 Sidebar 的判定顺序）：
            archivedAt 非空 → archived；其次 pendingRuntimeRequest 非空（等用户审批/输入）→ waiting；
            再看 activityRunStatus（后台 run 未停时 shell.status 可能已是 completed/idle）：
            preparing/starting/running → running、waiting → waiting；
            最后 shell.status 兜底（preparing/queued/starting/running → running、
            waiting → waiting、其余 → idle）
        branch:
          type: string
          description: 工作分支；T3 侧为 null 时为空串
        provider:
          type: string
          description: T3 providerInstanceId
        model:
          type: string
        updated_at:
          type: string
          description: T3 原样返回的 ISO-8601 时间
        settled:
          type: boolean
          description: 上游 settledOverride=="settled" 原样透传：用户在 T3 把线程收进了历史区。归档判定看 status=archived，与 settled 互不蕴含
        run_started_at:
          type: string
          description: 最近 run 的 startedAt（上游 latestRunStartedAt）原样透传，供「运行中 N 分钟」计时；无线程运行记录时缺省
        pull_request_count:
          type: integer
          description: 关联 PR 数：shell.pullRequests 字段存在时（含空数组与全墓碑）恒为 pull_requests 过滤后的可见条数（已排除墓碑条目），两侧同源；仅字段缺失（旧服务端）时按 linkedPullRequest/branchPullRequest 计
        run_status:
          type: string
          description: |
            T3 原始线程状态（shell.status）原样透传，不做归一化。与归一化后的
            status 互补：completed/failed/cancelled/interrupted 等终态在 status
            里都会折叠成 idle，这里保留上游原文，供区分「正常结束」「失败」「被取消」。
            注意 status 不是 idle 时线程还没结束（后台 run/后台工作仍在），此时
            run_status 只是最近一次根 run 的状态；只有 status=idle 时它才代表最终结局
        pull_requests:
          type: array
          description: 线程关联的 PR 可见明细（来自 shell.pullRequests，已排除 source=stack-dismissed 的墓碑条目——用户取消关联的栈成员，上游仅为同步去重保留）；无可见 PR 时为空数组。旧服务端只有 linkedPullRequest/branchPullRequest 而无明细，此时也是空数组（不合成缺 state 的条目），条目数看 pull_request_count
          items:
            $ref: '#/components/schemas/T3ThreadPullRequest'
        parent_thread_id:
          type: string
          description: 仅详情且该线程为子代理线程时给出（lineage.relationshipToParent=subagent 的 parentThreadId）；列表与父线程缺省

    T3ThreadPullRequest:
      type: object
      description: |
        线程关联 PR 的精简明细（T3 ThreadPullRequestLink；不含 source=
        stack-dismissed 的墓碑条目）。snapshot 尚未同步（null）时除
        repo/number/url/watching 外全部省略
      required: [repo, number, url, watching]
      properties:
        repo:
          type: string
          description: 仓库标识（host + repository，如 github.com/owner/repo）
        number:
          type: integer
          description: PR 号
        url:
          type: string
          description: PR 页面链接
        watching:
          type: boolean
          description: 该 PR 是否挂着 T3 监听（有监听时服务端会在检查结束、他人评论或分支冲突时唤醒线程代理）
        state:
          type: string
          description: PR 状态（open/closed/merged）；snapshot 未同步时省略
        merged_at:
          type: string
          description: 合并时间（ISO-8601）；未合并或 snapshot 未同步时省略
        is_draft:
          type: boolean
          description: 是否草稿 PR；snapshot 未同步时省略
        checks_state:
          type: string
          description: 检查状态（passing/failing/pending）；无检查数据或 snapshot 未同步时省略
        mergeability:
          type: string
          description: 可合并性（mergeable/conflicting/unknown）；snapshot 未同步时省略

    T3ThreadItem:
      type: object
      description: |
        归一化线程条目。映射规则：user_message（含 attachments 图片元数据）/
        assistant_message/reasoning 原样带快照文本；proposed_plan →
        assistant_message；command_execution（text=命令，summary=命令首行，
        输出经 items/{itemId} 补读）；dynamic_tool/file_search/web_search/todo_list →
        dynamic_tool；file_change（真实元数据：文件名/增删行数/子操作，summary=文件名 ±行数，
        上游 detail 无 diff，不调用 diff 读路径）；subagent（child_thread_id 带出，
        结果经 items/{itemId} 补读）；error（text=失败信息，summary=失败类别）。
        交互类条目：approval_request（审批，request_id 关联运行时请求）/
        user_input_request（提问）/ secret_request（密钥，绝不携带密钥值）。
        结构性事件（checkpoint、handoff、notification、system_notice 等）丢弃；
        未知类型前向兼容地跳过。正文不额外截断。
        继承行（fork 前缀，visibility=inherited）只展示历史：inherited=true，
        不能在本线程原地应答；source_thread_id 指向来源线程。
      required: [id, type, text, summary]
      properties:
        id:
          type: string
          description: Fast Ship 条目 ID（sourceThreadId + "::" + T3 原始条目 id；继承行与本地行的原始 id 可能重复，靠来源线程区分）
        inherited:
          type: boolean
          description: 是否为 fork 继承前缀行（visibility=inherited）；继承的审批/提问/密钥只展示，不能在本线程作答
        source_thread_id:
          type: string
          description: 该条目所在来源线程；继承行指向来源，本地行等于当前线程
        type:
          type: string
          enum: [user_message, assistant_message, reasoning, command_execution, dynamic_tool, file_change, subagent, error, approval_request, user_input_request, secret_request]
        text:
          type: string
          description: 正文，不额外截断（命令=命令文本；文件=元数据；审批=缺省时为空；展开后的完整正文经 items/{itemId} 获取）
        summary:
          type: string
          description: 单行概要（折叠态显示，rune 安全截断）；命令/子代理=首行、文件=文件名 ±行数、工具=工具名、审批/提问=提示或问题首行
        status:
          type: string
          description: T3 侧条目状态（idle/pending/running/waiting/completed/failed/cancelled/interrupted）；可能省略
        updated_at:
          type: string
          description: 上游条目自带的 updatedAt（RFC3339）原样透传，作为条目版本；上游省略时本字段缺省
        child_thread_id:
          type: string
          description: 仅 subagent；子线程 ID
        detail_available:
          type: boolean
          description: |
            条目在快照之外还有正文，可经 items/{itemId} 补读：
            快照里 command_execution/dynamic_tool/subagent 为 true（wire 投影裁掉
            输出/结果，file_change 上游 detail 也无 diff 故为 false）；补读响应恒为
            false。缺省即 false。
        attachments:
          type: array
          description: 仅 user_message；随消息发送的图片附件元数据
          items:
            $ref: '#/components/schemas/T3ChatAttachment'
        request_id:
          type: string
          description: 仅 approval_request/user_input_request；T3 运行时请求 ID（respond/dismiss 端点使用）
        request_kind:
          type: string
          description: 仅 approval_request；请求类型（command/file-read/file-change/mcp-elicitation/permission）
        prompt:
          type: string
          description: 仅 approval_request；审批提示（上游缺省时为空）
        app_name:
          type: string
          description: 仅 approval_request；发起审批的应用（mcp-elicitation 等）；上游缺省时缺省
        options:
          type: array
          description: 仅 approval_request；审批可选项（上游自带，按序展示）
          items:
            $ref: '#/components/schemas/T3ApprovalOption'
        decision:
          type: string
          description: 仅 approval_request；已做出的决定（accept/acceptForSession/acceptAlways/decline/cancel），来自运行时请求记录
        questions:
          type: array
          description: 仅 user_input_request；问题列表
          items:
            $ref: '#/components/schemas/T3UserInputQuestion'
        answers:
          type: object
          additionalProperties: true
          description: 仅 user_input_request；已提交的答案（questionId → 答案值，原样透传）
        response_mode:
          type: string
          description: 仅 user_input_request；应答通道（message=经消息应答）
        response_capability:
          type: string
          description: 仅 approval_request/user_input_request；该请求当前的应答通道（live/message/not_resumable，运行时请求记录）
        request_status:
          type: string
          description: 仅 approval_request/user_input_request；运行时请求状态（pending/resolved/expired/cancelled；pending 才可应答）
        label:
          type: string
          description: 仅 secret_request；请求的密钥名称
        reason:
          type: string
          description: 仅 secret_request；为什么需要该密钥
        placeholder:
          type: string
          description: 仅 secret_request；输入框占位文本；上游缺省时缺省
        secret_status:
          type: string
          description: 仅 secret_request；密钥请求状态（pending/saved/declined/cancelled；绝不携带密钥值本身）

    T3ApprovalOption:
      type: object
      description: 审批可选项（T3 请求自带，缺省请求才是 Approve/Decline/Always allow this session/Cancel）
      required: [decision, label]
      properties:
        decision:
          type: string
          description: T3 ProviderApprovalDecision（accept/acceptForSession/acceptAlways/decline/cancel）
        label:
          type: string
        warning:
          type: string
          description: 提供方给出的警示（如提示注入警告）；上游缺省时缺省

    T3UserInputQuestion:
      type: object
      description: 用户输入请求中的单个问题（T3 请求自带）
      required: [id, header, question, options]
      properties:
        id:
          type: string
        header:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            type: object
            required: [label, description]
            properties:
              label:
                type: string
              description:
                type: string
              value:
                type: string
                description: 上游缺省时缺省（提交 answers 时以 label 为值）
        multi_select:
          type: boolean
          description: 上游缺省时缺省（视为单选）
        allow_custom_answer:
          type: boolean
          description: 上游缺省时缺省
        initial_answer:
          type: string
          description: 可编辑的初始文本；上游缺省时缺省
        required:
          type: boolean
          description: 上游缺省时缺省

    T3ChatAttachment:
      type: object
      description: 随消息发送的图片附件元数据（T3 ChatImageAttachment 归一化；上传经 environments/{id}/attachments）
      required: [type, id, name, mime_type, size_bytes]
      properties:
        type:
          type: string
          enum: [image]
        id:
          type: string
          description: T3 附件 ID（createUploadUrl 产出的 attachmentId）
        name:
          type: string
          maxLength: 255
        mime_type:
          type: string
          description: 仅支持 image/png、image/jpeg、image/gif、image/webp
        size_bytes:
          type: integer
          description: 字节数；单图上限 10MiB

    T3ThreadQueueItem:
      type: object
      description: 排队中的一条消息（开始前没有 turn item；run_id 用于 steer/edit/cancel/reorder）
      required: [run_id, message_id, text]
      properties:
        run_id:
          type: string
        message_id:
          type: string
        text:
          type: string
          description: 消息正文；上游投影缺消息时为「Queued message」
        attachments:
          type: array
          description: 随消息的图片附件元数据；上游缺省时为空数组
          items:
            $ref: '#/components/schemas/T3ChatAttachment'

    T3ThreadQueue:
      type: object
      description: |
        线程排队消息工作流，口径对齐 T3 `deriveThreadQueueWorkflowState`：
        items 为用户消息产生的排队 run（自动完成/通知 run 不在内），按
        queuePosition（缺省 ordinal）升序。
      required: [held, can_reorder, can_steer, items]
      properties:
        held:
          type: boolean
          description: 队列被挂起（Stop 或重启恢复后等待用户手动恢复）
        can_reorder:
          type: boolean
          description: provider 会话能力支持排队消息（排序/编辑/取消可用）
        can_steer:
          type: boolean
          description: provider 会话能力支持把排队消息上浮为活动运行的转向输入
        items:
          type: array
          items:
            $ref: '#/components/schemas/T3ThreadQueueItem'

    T3ThreadActivity:
      type: object
      description: 线程当前活动摘要（活动 run 来自投影 runs，与 queue 同一来源）
      required: [stopping, has_pending_requests, pending_background_task_count]
      properties:
        active_run_id:
          type: string
          description: 活动 run（preparing/starting/running/waiting 的最近一个）；静止时缺省
        active_run_status:
          type: string
          description: 活动 run 状态；静止时缺省
        stopping:
          type: boolean
          description: |
            停止请求已下发且尚未落定：活动 run 的最近一条 run_interrupt_request
            条目晚于同 run 的最近一条 run_interrupt_result
        has_pending_requests:
          type: boolean
          description: 有等待用户处理的运行时请求（审批/提问/代答 secret）
        pending_background_task_count:
          type: integer
          description: 根 run 结束后仍在跑的后台工作条数（command 类不占完成位；上游缺省时为 0）

    T3ThreadDetail:
      type: object
      required: [thread, items, queue, activity, access]
      properties:
        thread:
          $ref: '#/components/schemas/T3ThreadSummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/T3ThreadItem'
        queue:
          $ref: '#/components/schemas/T3ThreadQueue'
        activity:
          $ref: '#/components/schemas/T3ThreadActivity'
        access:
          $ref: '#/components/schemas/T3EnvironmentAccess'

    T3ModelOption:
      type: object
      description: T3 模型选项（canonical `{id,value}`；value 为 string 或 boolean）
      required: [id, value]
      properties:
        id:
          type: string
        value:
          type: string
          description: |
            字符串或布尔（T3 ProviderOptionSelectionValue）。JSON 原样透传，
            布尔选项发 JSON boolean 而非字符串。
          x-go-type: interface{}

    T3ModelSelection:
      type: object
      description: T3 模型选择（instanceId 来自 composer-options 的 providers；缺省用项目默认）
      required: [instance_id, model]
      properties:
        instance_id:
          type: string
          description: T3 providerInstanceId
        model:
          type: string
        options:
          type: array
          description: |
            provider 实例声明的模型选项，canonical 数组 `[{id,value}]`
            （与 T3 ModelSelection.options 一致）；缺省省略
          items:
            $ref: '#/components/schemas/T3ModelOption'

    T3ThreadWorkspace:
      type: object
      description: |
        新线程工作区（对齐 T3 OrchestrationV2ThreadLaunchWorkspaceStrategy）。
        缺省为项目主检出（root 不带 branch）。`worktree` 的 `base_ref` 缺省为
        主检出当前分支；`start_from_origin` 缺省取 T3 设置
        `newWorktreesStartFromOrigin`。`existing_worktree` 的 worktree_path 必填。
      required: [type]
      properties:
        type:
          type: string
          enum: [root, worktree, existing_worktree]
        branch:
          type: string
          description: 新检出的分支名；缺省由 T3 决定（root 的 Current checkout 不传 branch）
        base_ref:
          type: string
          description: 仅 worktree；新建 worktree 的基线引用；缺省为主检出当前分支
        start_from_origin:
          type: boolean
          description: 仅 worktree；缺省取 T3 设置 newWorktreesStartFromOrigin
        worktree_path:
          type: string
          description: 仅 existing_worktree；T3 侧已注册的工作树路径（来自 workspace-options 或线程详情）

    CreateT3ThreadRequest:
      type: object
      required: [project_id, message]
      properties:
        command_id:
          type: string
          description: 稳定命令 ID；缺省由服务端生成。同一操作重试必须带同一 ID
        thread_id:
          type: string
          description: 稳定线程 ID；缺省由服务端生成。同一操作重试必须带同一 ID（T3 据此幂等）
        project_id:
          type: string
          description: T3 projectId（来自 composer-options 的 projects[].id）
        message:
          type: object
          description: |
            首条消息（必填；title 缺省时据此生成种子标题）。
            text 可为空，但 text 与 attachments 不能同时空。
          required: [text]
          properties:
            message_id:
              type: string
              description: 稳定消息 ID；缺省由服务端生成
            text:
              type: string
              description: 正文；仅图片消息时为空串
            attachments:
              type: array
              description: 图片附件元数据（来自附件上传端点）；缺省按 []
              items:
                $ref: '#/components/schemas/T3ChatAttachment'
        title:
          type: string
          description: 线程标题；缺省时从首条消息生成种子标题并让 T3 生成正式标题
        model_selection:
          $ref: '#/components/schemas/T3ModelSelection'
        runtime_mode:
          type: string
          enum: [approval-required, auto-accept-edits, auto, full-access]
          default: full-access
        workspace:
          $ref: '#/components/schemas/T3ThreadWorkspace'

    T3ThreadLaunchResult:
      type: object
      description: launchThread 结果归一化（thread 详情经 GET threads/{threadId} 读取）
      required: [thread_id, resumed]
      properties:
        thread_id:
          type: string
        resumed:
          type: boolean
          description: 复用了同 ID 的既有线程（幂等重试）时为 true

    SendT3ThreadMessageRequest:
      type: object
      required: [text]
      properties:
        command_id:
          type: string
          description: 稳定命令 ID；缺省由服务端生成。同一操作重试必须带同一 ID
        message_id:
          type: string
          description: 稳定消息 ID；缺省由服务端生成
        text:
          type: string
          description: 正文；仅图片消息时为空串。text 与 attachments 不能同时空
        attachments:
          type: array
          description: 图片附件元数据；缺省按 [] 发送（上游要求字段为数组）
          items:
            $ref: '#/components/schemas/T3ChatAttachment'

    T3DispatchResult:
      type: object
      description: dispatchCommand 受理结果（sequence 为 T3 投影事件序号）
      required: [sequence]
      properties:
        sequence:
          type: integer

    T3ThreadStopResult:
      type: object
      description: 停止结果；无可停止运行时按 T3 口径视为无操作（stopped=false）
      required: [stopped]
      properties:
        stopped:
          type: boolean
        run_id:
          type: string
          description: 被中断的 run；无可停止运行时缺省

    SteerT3QueuedRunRequest:
      type: object
      description: target_run_id 由服务端解析为当前活动 run，请求体保留字段以显式表达意图
      properties: {}

    EditT3QueuedRunRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
        attachments:
          type: array
          description: |
            三态：字段缺省=保留原附件（不得反序列化成空数组）；[]=清空；
            非空数组=整组替换
          items:
            $ref: '#/components/schemas/T3ChatAttachment'

    ReorderT3QueuedRunRequest:
      type: object
      description: before_run_id 为 null 或缺省表示移到队尾
      properties:
        before_run_id:
          type: string
          nullable: true
          description: 目标位置后一条排队消息的 run_id

    RespondT3ThreadRequest:
      type: object
      description: 应答联合：approval 携带 decision；user_input 携带 answers
      required: [type]
      properties:
        type:
          type: string
          enum: [approval, user_input]
        decision:
          type: string
          description: 仅 type=approval；T3 ProviderApprovalDecision（accept/acceptForSession/acceptAlways/decline/cancel），应为请求 options 中的 decision
        answers:
          type: object
          additionalProperties: true
          description: 仅 type=user_input；questionId → 答案值（原样透传给 T3）
        attachments_by_question_id:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/T3ChatAttachment'
          description: 仅 type=user_input；按问题追加图片附件；缺省不发

    AnswerT3SecretRequest:
      type: object
      description: 密钥应答联合；save 携带密钥值（仅此一次经过，不落库不回显）
      required: [type]
      properties:
        type:
          type: string
          description: save（携带 secret）或 decline
        secret:
          type: string
          minLength: 1
          description: 仅 type=save；密钥值

    T3ComposerOptions:
      type: object
      description: 线程启动器选项（projects 归一化；config/settings 为上游原样透传）
      required: [projects, config, settings]
      properties:
        projects:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id:
                type: string
              title:
                type: string
              workspace_root:
                type: string
                description: 项目主检出根目录（workspace-options 据此解析 cwd）；上游缺省时缺省
              default_model_selection:
                $ref: '#/components/schemas/T3ModelSelection'
        config:
          type: object
          additionalProperties: true
          description: T3 `server.getConfig` 响应原样透传（camelCase，含 providers 等启动器所需的全部配置）
        settings:
          type: object
          additionalProperties: true
          description: T3 `server.getSettings` 响应原样透传（camelCase，含 newWorktreesStartFromOrigin 等设置）

    T3WorkspaceRef:
      type: object
      description: vcs 引用（分支/标签等，按 T3 vcs.listRefs 原始形状归一化出名称与类别）
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          description: local / remote（T3 refKind）
        is_default:
          type: boolean
          description: 上游标注的默认分支；上游缺省时缺省
        worktree_path:
          type: string
          description: 该引用对应的既有工作树路径（若有）；上游缺省时缺省

    T3WorkspaceOptions:
      type: object
      description: 线程工作区选项（cwd 来自上游项目 workspaceRoot，不接受前端任意路径）
      required: [project_id, cwd, refs]
      properties:
        project_id:
          type: string
        cwd:
          type: string
          description: 项目主检出根目录
        is_repo:
          type: boolean
          description: vcs.refreshStatus 报告该目录是否为 git 仓库
        ref_name:
          type: string
          description: 主检出当前分支；新建 worktree 线程的 base_ref 缺省取此值
        has_working_tree_changes:
          type: boolean
          description: 工作区有未提交变更
        has_primary_remote:
          type: boolean
        refs:
          type: array
          items:
            $ref: '#/components/schemas/T3WorkspaceRef'
        next_cursor:
          type: integer
          nullable: true
          description: vcs.listRefs 分页游标；null 表示没有更多
        total_count:
          type: integer
          description: 过滤后的引用总数

    Notification:
      type: object
      required: [id, kind, title, body, created_at, updated_at, last_seen_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [review_dispatch_failed, review_run_timeout, review_cleanup_failed, review_redelivery_failed]
        title:
          type: string
        body:
          type: string
        environment_id:
          type: string
          nullable: true
        thread_id:
          type: string
          nullable: true
        run_id:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        last_seen_at:
          type: string
        read_at:
          type: string
          nullable: true

    SelfLogEntry:
      type: object
      description: Fast Ship 自身日志条目（入库前已脱敏：token/密钥/密码/Authorization 一律不落明文）
      required: [id, time, level, message]
      properties:
        id:
          type: integer
          format: int64
          description: 存储行 ID；与时间联合构成游标定位
        time:
          type: string
          format: date-time
        level:
          type: string
          enum: [DEBUG, INFO, WARN, ERROR]
        module:
          type: string
          description: 产生日志的模块（http / review / t3 / github / auth / api_key 等）
        message:
          type: string
        request_id:
          type: string
        user_id:
          type: string
        project_id:
          type: string
        issue_id:
          type: string
        run_id:
          type: string
        thread_id:
          type: string
        extra:
          type: object
          additionalProperties: true
          description: 其余结构化字段（JSON 对象）；未选入 fields 时省略

    SelfLogPage:
      type: object
      description: 自身日志分页（键集游标；next_cursor 为 null 表示没有更多）
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SelfLogEntry'
        next_cursor:
          type: string
          nullable: true
          description: 下一页游标；没有更多时为 null
        has_more:
          type: boolean

    SelfLogAggregateResult:
      type: object
      description: 自身日志聚合结果
      required: [rows, truncated]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SelfLogAggregateRow'
        truncated:
          type: boolean
          description: 超过单次聚合上限（2000 行）被截断；按时间桶时保留的是最近的桶

    SelfLogAggregateRow:
      type: object
      description: 一行聚合计数；未选择的维度字段省略
      required: [count]
      properties:
        count:
          type: integer
        module:
          type: string
        level:
          type: string
        time_bucket:
          type: string
          format: date-time
          description: 时间桶起点（对齐分钟/小时），RFC3339

    SelfLogTraceResult:
      type: object
      description: 请求/运行链路日志（时间正序）
      required: [items, truncated]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SelfLogEntry'
        truncated:
          type: boolean
          description: 超过单次链路上限（1000 条）被截断；保留的是最新 1000 条


    ReviewCombination:
      type: object
      required: [environment_id, instance_id, model]
      description: 一个审查组合：环境 + harness（instance_id）+ 模型 + 选项（思考强度等）
      properties:
        environment_id:
          type: string
        instance_id:
          type: string
          description: T3 provider 实例 id（harness 维度）
        model:
          type: string
        options:
          type: array
          description: 模型选项（如思考强度），canonical `[{id,value}]` 形式，原样交给 T3
          items:
            $ref: '#/components/schemas/ReviewModelOption'
        environment_name:
          type: string
          description: 仅响应；环境当前名称
        t3_project_id:
          type: string
          description: 仅响应；绑定的 T3 项目 id（保存时快照）

    ReviewModelOption:
      type: object
      required: [id, value]
      description: 模型选项（与 T3 modelSelection.options 同形，值可为字符串或布尔）
      properties:
        id:
          type: string
        value:
          description: 选项值（字符串或布尔）

    ReviewPrerequisite:
      type: object
      required: [code, label, missing]
      properties:
        code:
          type: string
          enum:
            - github_app
            - github_app_installation
            - public_url
            - github_token
            - environment_binding
        label:
          type: string
        missing:
          type: boolean
        detail:
          type: string

    ReviewSettings:
      type: object
      required:
        - project_id
        - repo_full_name
        - enabled
        - trigger_opened
        - trigger_synchronize
        - trigger_ready_for_review
        - trigger_reopened
        - code_combinations
        - visual_combinations
        - prerequisites
      properties:
        project_id:
          type: string
        repo_full_name:
          type: string
          description: 该审查实际使用的代码仓库（owner/repo，原样大小写；未单独配置代码仓库时即公开仓库）
        enabled:
          type: boolean
        trigger_opened:
          type: boolean
        trigger_synchronize:
          type: boolean
        trigger_ready_for_review:
          type: boolean
        trigger_reopened:
          type: boolean
        code_combinations:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ReviewCombination'
        visual_combinations:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/ReviewCombination'
        prerequisites:
          type: array
          items:
            $ref: '#/components/schemas/ReviewPrerequisite'
        taken_by:
          type: string
          nullable: true
          description: 同仓库已开启审查的其他项目占用者登录名（只读）
        can_manage:
          type: boolean

    ReviewSettingsInput:
      type: object
      required:
        - enabled
        - trigger_opened
        - trigger_synchronize
        - trigger_ready_for_review
        - trigger_reopened
        - code_combinations
        - visual_combinations
      properties:
        enabled:
          type: boolean
        trigger_opened:
          type: boolean
        trigger_synchronize:
          type: boolean
        trigger_ready_for_review:
          type: boolean
        trigger_reopened:
          type: boolean
        code_combinations:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ReviewCombination'
        visual_combinations:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/ReviewCombination'

    ReviewProjectSummary:
      type: object
      required:
        - project_id
        - project_name
        - github_owner
        - github_repo
        - enabled
        - code_combination_count
        - visual_combination_count
        - can_manage
      properties:
        project_id:
          type: string
        project_name:
          type: string
        github_owner:
          type: string
          description: 实际审查的代码仓库 owner（未单独配置代码仓库时即公开仓库）
        github_repo:
          type: string
          description: 实际审查的代码仓库 repo 名（未单独配置代码仓库时即公开仓库）
        enabled:
          type: boolean
        code_combination_count:
          type: integer
        visual_combination_count:
          type: integer
        code_status:
          type: string
          nullable: true
          description: 最近一次代码审查结论（success/failure/error/pending）
        visual_status:
          type: string
          nullable: true
        last_review_at:
          type: string
          nullable: true
        taken_by:
          type: string
          nullable: true
        can_manage:
          type: boolean

    ReviewRunSummary:
      type: object
      required:
        - id
        - kind
        - environment_id
        - instance_id
        - model
        - status
        - thread_id
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [code, visual]
        environment_id:
          type: string
        environment_name:
          type: string
        instance_id:
          type: string
        model:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/ReviewModelOption'
        status:
          type: string
          enum: [queued, dispatched, running, completed, failed, timed_out, cancelled]
        thread_id:
          type: string
        summary:
          type: string
        error_code:
          type: string
        error_message:
          type: string
        findings_count:
          type: integer
          description: P0/P1/P2（代码）或 blocker/worth fixing（视觉）的条目数
        findings:
          type: array
          description: 完整发现列表（result_json 可解析时才有）；代码含 Note，视觉为 severity→level
          items:
            $ref: '#/components/schemas/ReviewFinding'
        unmeasurable:
          type: array
          description: 视觉审查「无法判断」的截图项（仅视觉运行）
          items:
            $ref: '#/components/schemas/ReviewUnmeasurable'
        ui_changed:
          type: boolean
        worktree_state:
          type: string
          nullable: true
        started_at:
          type: string
          nullable: true
        finished_at:
          type: string
          nullable: true

    ReviewRoundRecord:
      type: object
      required: [round_number, head_sha, trigger_action, created_at, code_runs, visual_runs]
      properties:
        round_number:
          type: integer
        head_sha:
          type: string
        trigger_action:
          type: string
          description: 触发方式（该轮第一条代码 run 的 trigger_action；没有代码 run 时为 unknown）
          enum: [opened, synchronize, ready_for_review, reopened, manual, visual, unknown]
        created_at:
          type: string
        code_runs:
          type: array
          items:
            $ref: '#/components/schemas/ReviewRunSummary'
        visual_runs:
          type: array
          items:
            $ref: '#/components/schemas/ReviewRunSummary'

    ReviewPullRequestRecord:
      type: object
      required:
        - repo_full_name
        - pr_number
        - pr_title
        - pr_url
        - head_sha
        - updated_at
        - rounds
        - can_rerun
      properties:
        repo_full_name:
          type: string
        pr_number:
          type: integer
        pr_title:
          type: string
        pr_url:
          type: string
        head_sha:
          type: string
        can_rerun:
          type: boolean
          description: 该记录是否属于项目当前仓库；跨仓库的历史记录只能查看，不能重跑。
        code_status:
          type: string
          nullable: true
        visual_status:
          type: string
          nullable: true
        updated_at:
          type: string
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/ReviewRoundRecord'

    ReviewFinding:
      type: object
      description: 发现的统一展示投影（代码与视觉合并；来自 result_json）
      required: [level, body]
      properties:
        level:
          type: string
          description: 代码为 P0/P1/P2/Note；视觉为 blocker/worth_fixing/minor
        body:
          type: string
        file:
          type: string
          description: 代码发现涉及的文件（文件:行号 展示）
        line:
          type: integer
          minimum: 1
          description: 当前 HEAD 右侧代码行号
        dimension:
          type: string
          description: 视觉发现的设计维度
        fix:
          type: string
          description: 视觉发现的修复建议
        screenshot:
          type: string
          description: 视觉发现涉及的截图标签

    ReviewPullRequestActivityPage:
      type: object
      required: [items, counts, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewPullRequestActivity'
        counts:
          $ref: '#/components/schemas/ReviewPullRequestActivityCounts'
        total:
          type: integer
          description: 过滤范围内全部 PR 数（分页前的总数）

    ReviewPullRequestActivityCounts:
      type: object
      description: 过滤范围内全部 PR 的分组计数（与分页无关）
      required: [in_progress, needs_action, recently_passed]
      properties:
        in_progress:
          type: integer
        needs_action:
          type: integer
        recently_passed:
          type: integer

    ReviewPullRequestActivity:
      type: object
      description: 单个 PR 的动态行（分组与进度由服务端算好，前端只负责展示）
      required:
        - project_id
        - project_name
        - repo_full_name
        - pr_number
        - pr_title
        - pr_url
        - group
        - round_number
        - head_sha
        - updated_at
        - started_at
        - stages
        - findings
        - issues
        - can_rerun
      properties:
        project_id:
          type: string
        project_name:
          type: string
        repo_full_name:
          type: string
        pr_number:
          type: integer
        pr_title:
          type: string
        pr_url:
          type: string
        group:
          type: string
          enum: [in_progress, needs_action, recently_passed]
        stage:
          type: string
          nullable: true
          enum: [debouncing, queued, reviewing]
          description: 仅 group=in_progress 时有值
        debounce_fire_at:
          type: string
          nullable: true
          description: 防抖到点时刻（仅 stage=debouncing 时有值）
        round_number:
          type: integer
        head_sha:
          type: string
        updated_at:
          type: string
        started_at:
          type: string
          description: 本轮开始时刻（防抖中为防抖行更新时刻）
        stages:
          type: array
          description: 两段进度（代码/视觉）；防抖中为空数组
          items:
            $ref: '#/components/schemas/ReviewStageProgress'
        findings:
          $ref: '#/components/schemas/ReviewFindingCounts'
        issues:
          type: array
          description: 需要人处理的问题（失败的运行、无法解析的结论、账本兜底）
          items:
            $ref: '#/components/schemas/ReviewActivityIssue'
        can_rerun:
          type: boolean

    ReviewStageProgress:
      type: object
      required: [kind, total, completed, status]
      properties:
        kind:
          type: string
          enum: [code, visual]
        total:
          type: integer
          description: 该段组合总数（无运行时为设置行配置数）
        completed:
          type: integer
          description: 已完成的组合数
        status:
          type: string
          enum: [pending, queued, running, completed, failed, skipped]
          description: skipped=该段未启动（无 UI 改动/截图未变化/代码发现问题）

    ReviewFindingCounts:
      type: object
      description: 发现计数（缺省 0；代码 P0/P1/P2，视觉 blocker/worth_fixing）
      required: [P0, P1, P2, blocker, worth_fixing]
      properties:
        P0:
          type: integer
        P1:
          type: integer
        P2:
          type: integer
        blocker:
          type: integer
        worth_fixing:
          type: integer

    ReviewActivityIssue:
      type: object
      required: [kind, reason, message]
      properties:
        kind:
          type: string
          enum: [code, visual]
        combination:
          type: string
          nullable: true
          description: "<model> · <instance_id>；账本兜底的 issue 无组合"
        reason:
          type: string
          description: 短原因（派发失败/超时/审查失败/审查未通过/审查未完成/结论无法解析）
        message:
          type: string
          description: 面向用户的说明

    ReviewAgentPullRequest:
      type: object
      required: [repo_full_name, pr_number, head_sha, title, html_url, base_ref, head_ref, body]
      properties:
        repo_full_name:
          type: string
        pr_number:
          type: integer
        head_sha:
          type: string
        title:
          type: string
        body:
          type: string
        html_url:
          type: string
        base_ref:
          type: string
        head_ref:
          type: string

    ReviewAgentDiff:
      type: object
      required: [content, truncated]
      properties:
        content:
          type: string
        truncated:
          type: boolean

    ReviewAgentScreenshot:
      type: object
      required: [id, label, url]
      properties:
        id:
          type: string
        label:
          type: string
        url:
          type: string
          description: 指向本端点的图片路径（相对 server.public_url）；下载失败时为空串
        error:
          type: string
          nullable: true
          description: 下载/不可用原因；非空时 url 为空，审查员应记入 unmeasurable

    ReviewCodeFinding:
      type: object
      required: [level, file, body]
      properties:
        level:
          type: string
          enum: [P0, P1, P2, Note]
        file:
          type: string
        line:
          type: integer
          minimum: 1
          nullable: true
          description: 当前 HEAD 右侧代码行号；可为空
        body:
          type: string

    ReviewPriorDecision:
      type: object
      required: [status, body]
      properties:
        level:
          type: string
          description: 原发现的分级（P0/P1/P2/Note 或 blocker/worth_fixing/minor）
        file:
          type: string
          nullable: true
        line:
          type: integer
          nullable: true
        body:
          type: string
          description: 原发现的正文摘要
        status:
          type: string
          enum: [fixed, rejected, open]
        reason:
          type: string
          description: rejected 时必须写明理由

    ReviewVisualFinding:
      type: object
      required: [severity, screenshot, dimension, body, fix]
      properties:
        severity:
          type: string
          enum: [blocker, worth_fixing, minor]
        screenshot:
          type: string
          description: 截图标签（来自 screenshots 端点的 label）
        dimension:
          type: string
          enum: [hierarchy, spacing, typography, color, interaction, copy, accessibility]
        body:
          type: string
        fix:
          type: string

    ReviewUnmeasurable:
      type: object
      required: [screenshot, reason]
      properties:
        screenshot:
          type: string
        reason:
          type: string

    ReviewCodeResult:
      type: object
      required: [summary, findings, prior, ui_changed, ui_changed_since_last_visual]
      properties:
        summary:
          type: string
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ReviewCodeFinding'
        prior:
          type: array
          items:
            $ref: '#/components/schemas/ReviewPriorDecision'
        ui_changed:
          type: boolean
        ui_changed_since_last_visual:
          type: boolean

    ReviewVisualResult:
      type: object
      required: [summary, findings, prior, unmeasurable]
      properties:
        summary:
          type: string
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ReviewVisualFinding'
        prior:
          type: array
          items:
            $ref: '#/components/schemas/ReviewPriorDecision'
        unmeasurable:
          type: array
          items:
            $ref: '#/components/schemas/ReviewUnmeasurable'

    Bot:
      type: object
      required: [id, name, persona_prompt, prompt_revision, platform_prompt_version, toolset_version, provider_id, provider_name, catalog_id, base_url, model, api_key_last4, next_event_seq, context_window, max_output_tokens, context_source, last_message, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        persona_prompt:
          type: string
          description: 人设原文；平台规则在服务端拼接，不在此回显
        prompt_revision:
          type: integer
          format: int64
          description: 人设/平台规则版本；用户明确编辑人设时递增
        platform_prompt_version:
          type: integer
          format: int64
        toolset_version:
          type: integer
          format: int64
        provider_id:
          type: string
          description: 所属 AI 提供商（INT-133）；地址与密钥都在提供商上
        provider_name:
          type: string
          description: 提供商名称（展示用，派生自 provider）
        catalog_id:
          type: string
          description: 提供商的目录 id（models.dev id 或 custom，派生自 provider）
        base_url:
          type: string
          description: OpenAI 兼容 API 基址；INT-133 起为 provider 的派生值（提供商轮换后下一次读取生效）
        model:
          type: string
        api_key_last4:
          type: string
          description: API Key 末四位（provider 的派生值）；明文任何端点都不回显
        context_window:
          type: integer
          format: int64
          description: >-
            模型上下文窗口（未扣输出空间）。解析顺序 manual > detected >
            catalog > fallback；fallback 为部署默认窗口
        max_output_tokens:
          type: integer
          format: int64
          description: 模型输出上限；detected（探测缓存）与 catalog（内置目录）来源可给出，未知为 0
        context_source:
          type: string
          description: >-
            窗口来源：manual（部署覆盖）/ detected（GET /models 探测缓存）/
            catalog（内置 models.dev 目录，INT-133）/ fallback（默认窗口）；
            展示层不得把回退值说成已检测
        context_detail:
          type: string
          description: 解析口径说明（探测方式或回退原因）；可省略
        next_event_seq:
          type: integer
          format: int64
          description: 事件账本水位（下一条的 seq）；详情订阅以此-1 为 afterSeq，
            与详情快照衔接，不从 0 重放历史
        last_message:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/BotLastMessage'
          description: >-
            主线最近一条正文 trim 后非空的 user/assistant 消息预览（按 seq 最大取）；
            正文纯空白或 content 坏 JSON 的消息跳过继续往前找，定时任务会话不参与。
            没有符合条件消息时为 null。仅 GET /api/bots 列表端点返回真实值；
            详情与聊天快照等其它端点恒为 null
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BotLastMessage:
      type: object
      required: [kind, text]
      description: 机器人主线最近一条可见消息的预览（INT-125），机器人列表端点专用
      properties:
        kind:
          type: string
          description: 消息角色 user / assistant
        text:
          type: string
          description: 完整正文；服务端不截断，截断展示由前端负责

    BotChatSnapshot:
      type: object
      required: [bot, messages, calls, runs, next_event_seq]
      properties:
        bot:
          $ref: '#/components/schemas/Bot'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/BotMessage'
        calls:
          type: array
          items:
            $ref: '#/components/schemas/BotToolCall'
        runs:
          type: array
          items:
            $ref: '#/components/schemas/BotRun'
        next_event_seq:
          type: integer
          format: int64
          description: 与快照同一读取点的事件账本水位（下一条的 seq）
        metrics:
          $ref: '#/components/schemas/BotMetrics'
          description: 运行指标（INT-115）：窗口能力 + 最近一次主线模型请求口径；
            没有主线请求时 request 缺省、窗口能力仍然可见；字段缺省（omitempty）
        maintenance_progress:
          $ref: '#/components/schemas/BotMaintenanceProgress'
          description: 当前活动主线 run 最近一条维护进度（压缩阶段/失败原因）；
            无活动主线 run 或尚无进度事件时字段缺省——已结束 run 的进度不再返回

    BotMaintenanceProgress:
      type: object
      required: [phase, message]
      description: 活动主线 run 的最近一条维护进度；与 SSE 的
        kind=maintenance_progress delta 事件同源，供刷新后运行栏水合
      properties:
        run_id:
          type: string
          description: 进度所属主线 run；服务端无 run 场景省略
        phase:
          type: string
          description: 压缩阶段（archive / summary / failed 等）
        message:
          type: string
          description: 人类可读的进度或失败说明

    BotMetrics:
      type: object
      required: [context_window, max_output_tokens, context_source]
      properties:
        context_window:
          type: integer
          format: int64
          description: >-
            模型上下文窗口（未扣输出空间）。解析顺序 manual > detected >
            catalog > fallback；fallback 为部署默认窗口
        max_output_tokens:
          type: integer
          format: int64
          description: 模型输出上限；detected（探测缓存）与 catalog（内置目录）来源可给出，未知为 0
        context_source:
          type: string
          description: >-
            窗口来源：manual（部署覆盖）/ detected（GET /models 探测缓存）/
            catalog（内置 models.dev 目录，INT-133）/ fallback（默认窗口）
        context_detail:
          type: string
          description: 解析口径说明；可省略
        request:
          description: 最近一次主线模型请求（进行中或已结束）；没有主线请求时省略
          $ref: '#/components/schemas/BotRequestMetrics'

    BotRequestMetrics:
      type: object
      required: [request_id, run_id, ordinal, status, usage_complete, input_tokens_estimate, input_estimator, started_at, generation_ms]
      description: 单次主线模型请求口径；历史累计仍在 run 上，指标区不用累计值
      properties:
        request_id:
          type: string
        run_id:
          type: string
        ordinal:
          type: integer
          format: int64
        status:
          type: string
          description: running / succeeded / failed
        prompt_tokens:
          type: integer
          format: int64
          nullable: true
        completion_tokens:
          type: integer
          format: int64
          nullable: true
        cached_tokens:
          type: integer
          format: int64
          nullable: true
        usage_complete:
          type: boolean
          description: false 表示上游未报 usage（缺失与零严格区分）；false 时计数视为不可用
        cost_estimate:
          type: number
          format: double
          nullable: true
          description: 按 run 冻结目录单价估算的本次请求成本（USD）；目录无价/缺 usage 时为 null（缺失 ≠ 0，INT-139）
        cost_source:
          type: string
          nullable: true
          description: 计价来源（catalog）；cost_estimate 为 null 时同 null
        input_tokens_estimate:
          type: integer
          format: int64
          description: 发送前的上下文 token 估算值（口径见 input_estimator；上下文占比用估算值）
        input_estimator:
          type: string
          description: 估算方式（usage_delta/3.5 或 utf8_bytes/3.5）
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        generation_ms:
          type: integer
          format: int64
          description: 首个流式正文片段到请求结束的耗时；0 表示不可用（纯工具
            调用、失败请求或时长非正）。Token 输出速度 = completion_tokens /
            (generation_ms/1000)，仅在两者都有且 >0 时给出

    CreateBotRequest:
      type: object
      required: [name, provider_id, model]
      properties:
        name:
          type: string
          minLength: 1
        persona_prompt:
          type: string
        provider_id:
          type: string
          description: 必填且属于当前用户（40433）；地址与密钥都在提供商上
        model:
          type: string
          description: 模型名，不带 provider 前缀

    UpdateBotRequest:
      type: object
      description: 指针字段表达「未提供保留」；INT-133 起不再接受 base_url / api_key，密钥轮换经 AI 提供商端点
      properties:
        name:
          type: string
        persona_prompt:
          type: string
        provider_id:
          type: string
          description: 更换所属提供商；必须属于当前用户（40433）
        model:
          type: string

    TestBotConnectionRequest:
      type: object
      required: [provider_id]
      description: 地址与密钥一律取 provider（INT-133）；model 显式提供时优先，否则沿用 bot_id 的已保存模型（两者都没有时 40001）
      properties:
        provider_id:
          type: string
        bot_id:
          type: string
          description: 可选；给出时 model 缺省沿用该机器人的已保存模型
        model:
          type: string

    BotConnectionCheck:
      type: object
      required: [ok, checks, context_window, max_output_tokens, context_source]
      properties:
        ok:
          type: boolean
          description: 流式检查通过即 true
        checks:
          type: array
          items:
            type: object
            required: [name, passed]
            properties:
              name:
                type: string
                description: streaming / tool_call
              passed:
                type: boolean
              detail:
                type: string
                description: 失败原因（截断；不含密钥）
        context_window:
          type: integer
          format: int64
          description: >-
            模型上下文窗口：GET /models 同步探测成功时为探测值并写入缓存；
            失败回退到当前解析值（manual / catalog / 默认窗口）
        max_output_tokens:
          type: integer
          format: int64
          description: 模型输出上限；仅探测到时非 0
        context_source:
          type: string
          description: 窗口来源 manual / detected / catalog / fallback（探测失败时如实标注）
        context_detail:
          type: string
          description: 解析口径说明；可省略

    AIProvider:
      type: object
      required: [id, catalog_id, name, base_url, api_key_last4, bot_count, created_at, updated_at]
      description: AI 提供商（INT-133）：按用户隔离的地址 + 密钥配置，key 只回末四位
      properties:
        id:
          type: string
        catalog_id:
          type: string
          description: models.dev 提供商 id，或 custom
        name:
          type: string
        base_url:
          type: string
          description: 规范化存储（TrimSpace + 去尾部 /）；目录提供商由目录决定，custom 由用户提供
        api_key_last4:
          type: string
          description: API Key 末四位；明文任何端点都不回显
        bot_count:
          type: integer
          description: 当前引用该提供商的机器人数量
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CatalogProviderModel:
      type: object
      required: [id, name, context_window, max_output_tokens, reasoning]
      description: 内置目录里的一个模型；窗口/输出缺失为 0（未知）
      properties:
        id:
          type: string
        name:
          type: string
        context_window:
          type: integer
          format: int64
        max_output_tokens:
          type: integer
          format: int64
        reasoning:
          type: boolean

    CatalogProvider:
      type: object
      required: [id, name, api, models]
      description: 内置 models.dev 目录里的一个提供商（OpenAI 兼容 + 有 api 地址 + 模型支持 tool_call）
      properties:
        id:
          type: string
        name:
          type: string
        api:
          type: string
          description: 官方 OpenAI 兼容端点
        models:
          type: array
          items:
            $ref: '#/components/schemas/CatalogProviderModel'

    CreateAIProviderRequest:
      type: object
      required: [catalog_id, api_key]
      properties:
        catalog_id:
          type: string
          description: models.dev 提供商 id，或 custom
        name:
          type: string
          description: 缺省用目录名（custom 用「自定义」）
        base_url:
          type: string
          description: 仅 custom 接受；必须是 http/https，存储前规范化。目录提供商的地址由目录决定，此字段忽略
        api_key:
          type: string
          description: 加密落库；空串/空白拒绝（40001）

    UpdateAIProviderRequest:
      type: object
      description: 指针字段表达「未提供保留」；catalog_id 不可改；目录提供商的 base_url 由目录决定（请求忽略）
      properties:
        name:
          type: string
        base_url:
          type: string
          description: 仅 custom 生效
        api_key:
          type: string
          description: 空串拒绝（40001）；缺省保留原 key

    TestAIProviderRequest:
      type: object
      required: [api_key]
      properties:
        catalog_id:
          type: string
          description: 缺省按 custom 处理
        base_url:
          type: string
          description: custom / 缺省 catalog_id 时必填
        api_key:
          type: string
        model:
          type: string
          description: 缺省用目录里第一个模型；custom 必须提供
        provider_id:
          type: string
          description: 已存提供商 id（可选）：测试通过时服务端清除该提供商的定时任务熔断

    AIProviderTestResult:
      type: object
      required: [ok, checks]
      properties:
        ok:
          type: boolean
          description: streaming 与 tool_call 都通过才 true
        checks:
          type: array
          items:
            type: object
            required: [name, passed]
            properties:
              name:
                type: string
                description: streaming / tool_call
              passed:
                type: boolean
              detail:
                type: string
                description: 失败原因（截断；不含密钥）
        models:
          type: array
          description: /models 列表尽力拉取的模型 id；拉取失败省略（不影响 ok）
          items:
            type: string

    BotMessage:
      type: object
      required: [id, bot_id, seq, kind, content, created_at]
      description: 不可改写的主线账本；批准/拒绝/错误/恢复都是追加新消息
      properties:
        id:
          type: string
        bot_id:
          type: string
        seq:
          type: integer
          format: int64
        run_id:
          type: string
        request_id:
          type: string
        call_id:
          type: string
        kind:
          type: string
          description: user / assistant / tool_reply / background_result / approval_decision / lifecycle
        content:
          type: object
          description: 按 kind 变化的正文；assistant 含 text 与 tool_calls 数组；tool_reply 含协议回复字符串
        created_at:
          type: string
          format: date-time

    SendBotMessageRequest:
      type: object
      required: [text, client_message_id]
      properties:
        text:
          type: string
          minLength: 1
        client_message_id:
          type: string
          minLength: 1
          description: 幂等键；同键同正文幂等返回，同键不同正文 40925

    SendBotMessageResult:
      type: object
      required: [message, run, queued]
      properties:
        message:
          $ref: '#/components/schemas/BotMessage'
        run:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/BotRun'
          description: 当前活动 run（可能尚未包含本消息）；没有时为 null，本次发送会触发新 run
        queued:
          type: boolean
          description: 恒为 true；执行交给 runtime

    BotRun:
      type: object
      required: [id, bot_id, trigger_source, trigger_key, status, config_snapshot, input_through_seq, stop_requested, usage_complete, created_at, display_cost_estimate]
      properties:
        id:
          type: string
        bot_id:
          type: string
        trigger_source:
          type: string
          description: user_message / tool_result / recovery / schedule / manual / schedule_event（定时任务运行事件写入主线后的立即唤醒，INT-138）
        trigger_key:
          type: string
        status:
          type: string
          description: queued / running / completed / failed / stopped
        config_snapshot:
          type: string
          description: 本次模型/地址/提示词版本快照 JSON；不含明文 key
        input_through_seq:
          type: integer
          format: int64
        stop_requested:
          type: boolean
        prompt_tokens:
          type: integer
          format: int64
          nullable: true
        completion_tokens:
          type: integer
          format: int64
          nullable: true
        total_tokens:
          type: integer
          format: int64
          nullable: true
        cached_tokens:
          type: integer
          format: int64
          nullable: true
        usage_complete:
          type: boolean
          description: false 表示上游未报 usage（缺失与零严格区分）
        cost_estimate:
          type: number
          format: double
          nullable: true
          description: 本 run 已计价请求的成本累计（USD，含送过 usage 的失败请求）；目录无价/全缺 usage 时为 null（缺失 ≠ 0，INT-139）
        cost_source:
          type: string
          nullable: true
          description: 计价来源（catalog）；cost_estimate 为 null 时同 null
        display_cost_estimate:
          type: number
          format: double
          nullable: true
          description: 显示口径成本（INT-162）：本 run 已计价成本 + 关联维护运行已计价成本；两者都为 null 时为 null。cost_estimate 列本身口径不变
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true

    BotScheduleTask:
      type: object
      required: [id, bot_id, name, cron_expression, timezone, instruction, model, needs_report, enabled, next_run_at, state, state_updated_at, cost_last_7d, created_at, updated_at, last_run]
      properties:
        id:
          type: string
        bot_id:
          type: string
        name:
          type: string
        cron_expression:
          type: string
          description: 标准五字段 cron（分 时 日 月 周）
        timezone:
          type: string
          description: IANA 时区名称；空串 = UTC
        instruction:
          type: string
          description: 每次运行交给机器人的任务指令
        model:
          type: string
          description: 运行使用的模型；空串用机器人当前模型
        needs_report:
          type: boolean
          description: true 时成功且非静默的运行也追加事件进主线
        enabled:
          type: boolean
        next_run_at:
          type: string
          format: date-time
          nullable: true
          description: 下一次计划触发时间（UTC）；停用或调度暂停时为 null
        state:
          type: string
          nullable: true
          description: 任务小状态的原始 JSON 文本（INT-123，无损；无状态为 null）。写入只经机器人 fs_schedule 的 state_set，用户只能经 DELETE .../state 清空
        state_updated_at:
          type: string
          format: date-time
          nullable: true
          description: 状态最近一次写入时间（UTC）；无状态为 null
        cost_last_7d:
          type: number
          format: double
          nullable: true
          description: 近 7 天该任务已计价成本合计（schedule run 自身+关联维护 + 连带主线成本，INT-162）；无已计价记录为 null
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_run:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/BotScheduleRun'

    BotScheduleRun:
      type: object
      required: [id, task_id, status, summary, silent, trigger_source, scheduled_for, started_at, finished_at, duration_ms, display_cost_estimate]
      properties:
        id:
          type: string
        task_id:
          type: string
          nullable: true
        status:
          type: string
          description: running / completed / failed / stopped / skipped
        summary:
          type: string
          description: 结果摘要（截断到 2000 字符）；skipped 记跳过原因，静默运行记空串
        silent:
          type: boolean
          description: true 表示运行以 [[SILENT]] 哨兵结束，无事可汇报
        trigger_source:
          type: string
          description: 触发来源：cron=按计划自动触发，manual=机器人经 fs_schedule run 手动立即触发（INT-121）
        error_code:
          type: string
        error_message:
          type: string
        scheduled_for:
          type: string
          format: date-time
          nullable: true
          description: 本 run 对应的计划时间（UTC）
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          format: int64
          nullable: true
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
        cost_estimate:
          type: number
          format: double
          description: 本 run 已计价请求的成本累计（USD，含送过 usage 的失败请求）；目录无价时缺省（缺失 ≠ 0，INT-139）
        cost_source:
          type: string
          description: 计价来源（catalog）
        display_cost_estimate:
          type: number
          format: double
          nullable: true
          description: 显示口径成本（INT-162）：本 run 已计价成本 + 关联维护运行已计价成本；两者都为 null 时为 null

    BotUsageTotals:
      type: object
      required: [cost, daily_average, total_requests, priced_requests, unpriced_requests]
      properties:
        cost:
          type: number
          format: double
          nullable: true
          description: 窗口内已计价成本合计（USD）；无任何已计价请求为 null（缺失 ≠ 0）
        daily_average:
          type: number
          format: double
          nullable: true
          description: cost / 窗口天数；cost 为 null 时同 null
        total_requests:
          type: integer
          format: int64
          description: 模型请求总数（主线/定时 + 维护）
        priced_requests:
          type: integer
          format: int64
        unpriced_requests:
          type: integer
          format: int64
          description: 未计价请求数（自定义提供商、目录无价、缺 usage、v0.1.63 前旧记录）

    BotUsageDay:
      type: object
      required: [date, cost, bots]
      properties:
        date:
          type: string
          description: 生效时区的当地日期 YYYY-MM-DD；窗口内每天一行（含无数据日）
        cost:
          type: number
          format: double
          description: 当日已计价成本合计；全未计价或无记录为 0
        bots:
          type: array
          description: 当日有模型请求（含未计价）的机器人
          items:
            type: object
            required: [bot_id, cost]
            properties:
              bot_id:
                type: string
              cost:
                type: number
                format: double

    BotUsageBot:
      type: object
      required: [bot_id, name, cost, cost_main, cost_schedule, cost_schedule_linked_approx, cost_maintenance, runs, avg_run_cost, max_run_cost, p90_run_cost, cache_hit_rate, unpriced_requests]
      properties:
        bot_id:
          type: string
        name:
          type: string
        cost:
          type: number
          format: double
          nullable: true
          description: 已计价合计 = cost_main + cost_schedule + cost_maintenance
        cost_main:
          type: number
          format: double
          nullable: true
          description: 主线桶：非 schedule_event 触发的 main run（自身成本+关联维护）
        cost_schedule:
          type: number
          format: double
          nullable: true
          description: 定时任务桶：schedule run（自身+关联维护）+ schedule_event 连带主线成本
        cost_schedule_linked_approx:
          type: number
          format: double
          nullable: true
          description: cost_schedule 中连带主线成本部分（近似，UI 标注）
        cost_maintenance:
          type: number
          format: double
          nullable: true
          description: 无父 run 的维护请求合计（如夜间整理）
        runs:
          type: integer
          format: int64
          description: 窗口内 run 数（main + schedule）
        avg_run_cost:
          type: number
          format: double
          nullable: true
          description: 单次运行平均显示成本（自身+关联维护）；只统计有已计价成本的 run
        max_run_cost:
          type: number
          format: double
          nullable: true
        p90_run_cost:
          type: number
          format: double
          nullable: true
          description: 单次运行显示成本的 P90（nearest-rank，与 avg/max 同一已计价 run 集合）；无已计价 run 为 null
        cache_hit_rate:
          type: number
          format: double
          nullable: true
          description: cached / prompt，只算 usage 完整的请求；无完整 usage 为 null
        unpriced_requests:
          type: integer
          format: int64

    BotUsageScheduleTask:
      type: object
      required: [task_id, bot_id, bot_name, name, deleted, enabled, cron_expression, timezone, runs, failed, skipped, cost, avg_run_cost, max_run_cost, p90_run_cost, linked_main_cost, estimated_monthly_cost]
      properties:
        task_id:
          type: string
          description: 聚合键；已删除任务仍取其运行记录上的 schedule_task_id
        bot_id:
          type: string
        bot_name:
          type: string
        name:
          type: string
          description: 现存任务名；已删除任务为空串（UI 显示「已删除的任务」）
        deleted:
          type: boolean
        enabled:
          type: boolean
          description: 已删除任务恒 false
        cron_expression:
          type: string
          description: 已删除任务为空串
        timezone:
          type: string
          description: 任务 IANA 时区；空串 = UTC
        runs:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        skipped:
          type: integer
          format: int64
        cost:
          type: number
          format: double
          nullable: true
          description: schedule run 自身+关联维护已计价合计（不含连带主线）
        avg_run_cost:
          type: number
          format: double
          nullable: true
        max_run_cost:
          type: number
          format: double
          nullable: true
        p90_run_cost:
          type: number
          format: double
          nullable: true
          description: 单次运行显示成本的 P90（nearest-rank，与 avg/max 同一已计价 run 集合）；无已计价 run 为 null
        linked_main_cost:
          type: number
          format: double
          nullable: true
          description: schedule_event 主线 run 的连带成本（近似）
        estimated_monthly_cost:
          type: number
          format: double
          nullable: true
          description: （单次定时运行平均 + 每次触发摊到的连带主线成本）× 未来 30 天触发次数（parseScheduleCron）；单次统计取最近 30 个当地日的固定窗口，与所选 range 无关；停用、已删除、无已计价平均或 cron 解析失败为 null

    BotUsageOverview:
      type: object
      required: [range, timezone, start, end, totals, days, bots, schedule_tasks]
      properties:
        range:
          type: string
          enum: [today, 7d, 30d]
        timezone:
          type: string
          description: 实际生效的切日时区（IANA）
        start:
          type: string
          format: date-time
          description: 统计窗口起点 UTC（含）
        end:
          type: string
          format: date-time
          description: 统计窗口终点 UTC（不含，即查询时刻）
        totals:
          $ref: '#/components/schemas/BotUsageTotals'
        days:
          type: array
          items:
            $ref: '#/components/schemas/BotUsageDay'
        bots:
          type: array
          items:
            $ref: '#/components/schemas/BotUsageBot'
        schedule_tasks:
          type: array
          items:
            $ref: '#/components/schemas/BotUsageScheduleTask'

    BotUsageRun:
      type: object
      required: [id, bot_id, bot_name, session_kind, trigger_source, trigger_key, status, summary, silent, usage_complete, created_at, cost_estimate, cost_source, maintenance_cost, display_cost]
      properties:
        id:
          type: string
        bot_id:
          type: string
        bot_name:
          type: string
        session_kind:
          type: string
          description: main / schedule
        schedule_task_id:
          type: string
          nullable: true
        schedule_task_name:
          type: string
          nullable: true
          description: 现存任务名；任务已删除或无关联时为 null
        trigger_source:
          type: string
        trigger_key:
          type: string
        status:
          type: string
        summary:
          type: string
        silent:
          type: boolean
        scheduled_for:
          type: string
          format: date-time
          nullable: true
        prompt_tokens:
          type: integer
          format: int64
          nullable: true
        completion_tokens:
          type: integer
          format: int64
          nullable: true
        total_tokens:
          type: integer
          format: int64
          nullable: true
        cached_tokens:
          type: integer
          format: int64
          nullable: true
        usage_complete:
          type: boolean
        cost_estimate:
          type: number
          format: double
          nullable: true
        cost_source:
          type: string
          nullable: true
        maintenance_cost:
          type: number
          format: double
          nullable: true
          description: 关联维护运行已计价成本合计
        display_cost:
          type: number
          format: double
          nullable: true
          description: cost_estimate + maintenance_cost；都为 null 时为 null
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true

    BotUsageToolCall:
      type: object
      required: [id, tool_name, action, status, created_at]
      properties:
        id:
          type: string
        tool_name:
          type: string
        action:
          type: string
        status:
          type: string
        error_code:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true

    BotUsageRequest:
      type: object
      required: [id, ordinal, status, is_retry, input_through_seq, input_tokens_estimate, input_estimator, tools_tokens_estimate, usage_complete, started_at, tool_calls, cost_estimate, cost_source]
      properties:
        id:
          type: string
        ordinal:
          type: integer
          format: int64
        status:
          type: string
          description: running / succeeded / failed
        is_retry:
          type: boolean
          description: 与同 run 更早请求 request_hash 相同即视为重试（每次重试单独一行）
        input_through_seq:
          type: integer
          format: int64
        input_tokens_estimate:
          type: integer
          format: int64
        input_estimator:
          type: string
        prompt_tokens:
          type: integer
          format: int64
          nullable: true
        cached_tokens:
          type: integer
          format: int64
          nullable: true
        completion_tokens:
          type: integer
          format: int64
          nullable: true
        total_tokens:
          type: integer
          format: int64
          nullable: true
        tools_tokens_estimate:
          type: integer
          format: int64
        usage_complete:
          type: boolean
        cost_estimate:
          type: number
          format: double
          nullable: true
        cost_source:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        first_delta_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/BotUsageToolCall'

    BotUsageMaintenanceRequest:
      type: object
      required: [id, ordinal, purpose, model, status, usage_complete, started_at, cost_estimate, cost_source]
      properties:
        id:
          type: string
        ordinal:
          type: integer
          format: int64
        purpose:
          type: string
          description: summary / archive / nightly
        model:
          type: string
        status:
          type: string
          description: running / succeeded / failed
        usage_complete:
          type: boolean
        prompt_tokens:
          type: integer
          format: int64
          nullable: true
        cached_tokens:
          type: integer
          format: int64
          nullable: true
        completion_tokens:
          type: integer
          format: int64
          nullable: true
        total_tokens:
          type: integer
          format: int64
          nullable: true
        cost_estimate:
          type: number
          format: double
          nullable: true
        cost_source:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true

    BotUsageMaintenanceRun:
      type: object
      required: [id, kind, status, created_at, requests, cost_estimate]
      properties:
        id:
          type: string
        kind:
          type: string
          description: compaction / nightly
        status:
          type: string
          description: running / succeeded / failed
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        cost_estimate:
          type: number
          format: double
          nullable: true
          description: 本维护运行已计价请求合计
        requests:
          type: array
          items:
            $ref: '#/components/schemas/BotUsageMaintenanceRequest'

    BotUsageRunDetail:
      type: object
      required: [run, requests, requests_truncated, maintenance_runs]
      properties:
        run:
          $ref: '#/components/schemas/BotUsageRun'
        requests:
          type: array
          description: run 的每次模型请求（含失败重试），按 ordinal 正序；超过上限时截断
          items:
            $ref: '#/components/schemas/BotUsageRequest'
        requests_truncated:
          type: boolean
          description: 请求数超过上限（500）被截断时为 true
        maintenance_runs:
          type: array
          description: parent_run_id 指向本 run 的维护运行及其请求
          items:
            $ref: '#/components/schemas/BotUsageMaintenanceRun'

    BotUsageDayCacheHit:
      type: object
      required: [date, rate]
      properties:
        date:
          type: string
          description: 生效时区的当地日期 YYYY-MM-DD；窗口内每天一行（含无数据日）
        rate:
          type: number
          format: double
          nullable: true
          description: 当日 cached / prompt；只统计 usage 完整的请求（按所属 run/维护运行自身 created_at 记日），当日无完整 usage 请求为 null

    BotUsageContextPoint:
      type: object
      required: [run_id, at, input_tokens, estimated, session_kind]
      properties:
        run_id:
          type: string
          description: 产生该点的 run ID（前端可链接到运行明细）
        at:
          type: string
          format: date-time
          description: run.created_at（UTC）
        input_tokens:
          type: integer
          format: int64
          description: 该 run 第一次请求的输入 token；estimated=false 取 prompt_tokens，否则取 input_tokens_estimate
        estimated:
          type: boolean
          description: true = 数值为服务端估算（该请求缺 usage），UI 须标注
        session_kind:
          type: string
          description: main / schedule

    BotUsageToolsShare:
      type: object
      required: [prompt_tokens, tools_tokens_estimate, share]
      properties:
        prompt_tokens:
          type: integer
          format: int64
          description: 分母：主线/定时 run 中 usage 完整请求的 prompt 合计（维护请求无工具定义列，不参与）
        tools_tokens_estimate:
          type: integer
          format: int64
          description: 分子：同一请求集合的 tools_tokens_estimate 合计（按 schema 字节的估算值，非精确 token 数）
        share:
          type: number
          format: double
          nullable: true
          description: tools_tokens_estimate / prompt_tokens；分母为 0（无完整 usage 请求）时 null

    BotUsageMaintenancePurpose:
      type: object
      required: [purpose, cost]
      properties:
        purpose:
          type: string
          description: 维护用途：summary / archive / nightly（窗口内出现过的才列出）
        cost:
          type: number
          format: double
          nullable: true
          description: 该用途下已计价请求合计；全部未计价为 null（缺失 ≠ 0）

    BotUsageMaintenanceShare:
      type: object
      required: [cost, share, by_purpose]
      properties:
        cost:
          type: number
          format: double
          nullable: true
          description: 窗口内该机器人全部维护请求已计价合计（含挂到 run 名下的压缩/归档，口径大于总览「维护」桶）
        share:
          type: number
          format: double
          nullable: true
          description: cost / 该机器人总花费（总览三桶之和）；任一未计价或总花费为 0 时为 null
        by_purpose:
          type: array
          description: 按用途拆分，按 cost 降序
          items:
            $ref: '#/components/schemas/BotUsageMaintenancePurpose'

    BotUsageFailureError:
      type: object
      required: [error_code, requests, cost]
      properties:
        error_code:
          type: string
          nullable: true
          description: 失败请求的 error_code；无错误码的失败归到 null 一组
        requests:
          type: integer
          format: int64
        cost:
          type: number
          format: double
          nullable: true
          description: 该组失败请求中已计价金额合计

    BotUsageFailureStats:
      type: object
      required: [failed_requests, failed_requests_cost, failed_runs, failed_runs_cost, retried_requests, by_error]
      properties:
        failed_requests:
          type: integer
          format: int64
          description: status=failed 的模型请求行数（bot_model_requests + bot_maintenance_requests）
        failed_requests_cost:
          type: number
          format: double
          nullable: true
          description: 失败请求中已计价金额合计——重试浪费口径：失败尝试若送过 usage 就已计价，其花费即浪费
        failed_runs:
          type: integer
          format: int64
          description: status=failed 的 bot_runs 数（main + schedule）
        failed_runs_cost:
          type: number
          format: double
          nullable: true
          description: 失败 run 的显示成本合计（自身 + 关联维护已计价）
        retried_requests:
          type: integer
          format: int64
          description: 与同 run 内更早请求 request_hash 相同的请求行数（每次重复尝试计 1，含最终成功那次）
        by_error:
          type: array
          description: 失败请求按 error_code 分组，按 cost 降序（null 组排最后）
          items:
            $ref: '#/components/schemas/BotUsageFailureError'

    BotUsageModelCandidate:
      type: object
      required: [model, cost, saving]
      properties:
        model:
          type: string
          description: 同目录内的候选模型名
        cost:
          type: number
          format: double
          description: 同一批请求的 token 数按该模型目录单价重算的总价（缓存命中按 cache_read，缺失回退 input）
        saving:
          type: number
          format: double
          description: actual_cost − cost；正值 = 省钱，负值 = 更贵

    BotUsageModelGroup:
      type: object
      required: [catalog_id, model, requests, actual_cost, candidates]
      properties:
        catalog_id:
          type: string
          description: run 冻结快照的目录归属；快照缺 catalog_id 或 model 的 run 不参与分组（旧账无法证明目录）
        model:
          type: string
          description: 该组 run 实际使用的模型
        requests:
          type: integer
          format: int64
          description: 参与重算的请求数（只含 usage 完整且当前模型已计价的请求）
        actual_cost:
          type: number
          format: double
          description: 这批请求在当前模型下的已计价合计（与重算同分母）
        candidates:
          type: array
          description: 同目录内单价完整（input+output 非空）的其他模型按同一 token 数重算，最便宜至多 3 个；只按价格重算，不代表效果一样
          items:
            $ref: '#/components/schemas/BotUsageModelCandidate'

    BotUsageInsightsBot:
      type: object
      required: [bot_id, name, cache_hit_rate, tools, maintenance, failures, context_growth, context_growth_truncated, model_alternatives]
      properties:
        bot_id:
          type: string
        name:
          type: string
        cache_hit_rate:
          type: number
          format: double
          nullable: true
          description: cached / prompt（主线/定时 + 维护请求的完整 usage 合计）；与总览同口径
        tools:
          $ref: '#/components/schemas/BotUsageToolsShare'
        maintenance:
          $ref: '#/components/schemas/BotUsageMaintenanceShare'
        failures:
          $ref: '#/components/schemas/BotUsageFailureStats'
        context_growth:
          type: array
          description: 每次运行第一次请求的输入 token 随时间变化（升序）；有请求的 run 才有点
          items:
            $ref: '#/components/schemas/BotUsageContextPoint'
        context_growth_truncated:
          type: boolean
          description: run 数超过每机器人点数上限（200）时为 true，已保留最新点
        model_alternatives:
          type: array
          description: 按（目录归属, 模型）分组的换模型差价；没有已计价请求的组不出现；维护请求不参与
          items:
            $ref: '#/components/schemas/BotUsageModelGroup'

    BotUsageInsightsTask:
      type: object
      required: [task_id, bot_id, bot_name, name, deleted, enabled, evaluated_runs, idle_runs, idle_rate, idle_cost, silent_runs, no_tool_call_runs, no_write_call_runs, cache_hit_rate]
      properties:
        task_id:
          type: string
        bot_id:
          type: string
        bot_name:
          type: string
        name:
          type: string
          description: 现存任务名；已删除任务为空串
        deleted:
          type: boolean
        enabled:
          type: boolean
        evaluated_runs:
          type: integer
          format: int64
          description: 空转判定分母：非 skipped 的终态 schedule run（completed/failed/stopped）；进行中与排队不计
        idle_runs:
          type: integer
          format: int64
          description: 满足任一空转条件的 run 数（各条件可叠加命中）
        idle_rate:
          type: number
          format: double
          nullable: true
          description: idle_runs / evaluated_runs；分母为 0 时 null
        idle_cost:
          type: number
          format: double
          nullable: true
          description: 空转 run 的显示成本合计（自身 + 关联维护已计价）
        silent_runs:
          type: integer
          format: int64
          description: 条件一：silent=true（静默哨兵）的 run 数
        no_tool_call_runs:
          type: integer
          format: int64
          description: 条件二：整次运行没有任何工具调用行的 run 数（调用行各状态都计）
        no_write_call_runs:
          type: integer
          format: int64
          description: 条件三：没有任何有效写操作调用的 run 数；写操作 = 当前工具注册表 ReadOnly 之外的 action（未知动作按写处理），且仅 status=succeeded 或 effect_may_have_occurred 的调用算有效——被拒/取消/失败/未执行的写调用不计
        cache_hit_rate:
          type: number
          format: double
          nullable: true
          description: 该任务 schedule run 名下 usage 完整请求的 cached / prompt；无完整 usage 为 null

    BotUsageInsights:
      type: object
      required: [range, timezone, start, end, cache_hit_by_day, bots, schedule_tasks]
      properties:
        range:
          type: string
          enum: [today, 7d, 30d]
        timezone:
          type: string
          description: 实际生效的切日时区（IANA）
        start:
          type: string
          format: date-time
          description: 统计窗口起点 UTC（含）
        end:
          type: string
          format: date-time
          description: 统计窗口终点 UTC（不含，即查询时刻）
        cache_hit_by_day:
          type: array
          description: 按天缓存命中率（窗口内每天一行）
          items:
            $ref: '#/components/schemas/BotUsageDayCacheHit'
        bots:
          type: array
          description: 查询集合内每个机器人一行（含无数据机器人），按总花费降序
          items:
            $ref: '#/components/schemas/BotUsageInsightsBot'
        schedule_tasks:
          type: array
          description: 窗口内有 schedule run 的任务一行（已删除任务保留）
          items:
            $ref: '#/components/schemas/BotUsageInsightsTask'

    BotToolCall:
      type: object
      required: [id, bot_id, request_id, provider_tool_call_id, tool_name, action, arguments, execution_mode, requires_confirmation, status, execution_context, result_chars, truncated, effect_may_have_occurred, created_at]
      properties:
        id:
          type: string
          description: 平台调用 ID，同时是执行幂等键
        bot_id:
          type: string
        request_id:
          type: string
        provider_tool_call_id:
          type: string
          description: 模型协议配对 ID
        tool_name:
          type: string
        action:
          type: string
        arguments:
          type: object
          description: 规范化后的参数
        execution_mode:
          type: string
          description: sync / async
        requires_confirmation:
          type: boolean
        status:
          type: string
          description: pending_confirmation / queued / running / succeeded / failed / rejected / cancelled / not_executed
        decision:
          type: string
          nullable: true
          description: approve / reject / always_allow
        decided_at:
          type: string
          format: date-time
          nullable: true
        authorization_id:
          type: string
          nullable: true
        execution_context:
          type: object
          description: 服务端生成的执行身份（T3 command/thread/message ID 等）与授权范围
        policy:
          type: object
          additionalProperties: true
          description: |
            分级放行评估结论（INT-160）：{tier, rule_id?, auto, source, facts?,
            downgrade_reason?, expiry?, schedule_denied?}。凡经过策略评估的写
            调用都有：自动执行（auto=true）、确认卡（含降级原因与过期时间）、
            定时任务会话 tier3 同步拒绝三类；历史行为空即「策略上线前」
        cancel_requested:
          type: boolean
        result_preview:
          type: object
          description: 进入模型上下文的受限结果（完整结果走 result 端点）
        result_chars:
          type: integer
          format: int64
        truncated:
          type: boolean
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        effect_may_have_occurred:
          type: boolean
          description: 副作用可能已发生（取消/中断/重启）；不声称回滚
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true

    BotCallResult:
      type: object
      required: [call_id, status, truncated, result_chars]
      properties:
        call_id:
          type: string
        status:
          type: string
        result:
          type: object
          description: 完整瘦身结果原文
        truncated:
          type: boolean
        result_chars:
          type: integer
          format: int64

    BotCallDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          description: approve / reject / always_allow

    BotAuthorization:
      type: object
      required: [id, tool_name, action, scope_kind, scope_id, constraints, created_at]
      properties:
        id:
          type: string
        tool_name:
          type: string
        action:
          type: string
        scope_kind:
          type: string
          description: project / project_collection / issue_project / thread_launch / thread / thread_stop
        scope_id:
          type: string
          description: 范围主体 ID（项目/Issue 所属项目/T3 项目/线程；project_collection 时为用户 ID）
        environment_id:
          type: string
          nullable: true
        constraints:
          type: object
          additionalProperties: true
          description: 规范化约束（如允许写入的字段集合 fields）
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 到期时间（INT-160）：新建「始终允许」默认创建后 30 天；到期后不再命中（视为已失效，惰性补 revoked_at）。历史行可能为 null
        revoked_at:
          type: string
          format: date-time
          nullable: true

    BotWritePolicyRule:
      type: object
      required: [rule_id, name, description, enabled, false_positive_count_24h]
      description: 分级放行 tier1 规则的独立开关与误判状态（INT-160）。分档与前置条件由服务端按「动作+参数+目标线程内存状态」计算，本端点只暴露开关
      properties:
        rule_id:
          type: string
          description: 规则 ID（thread_send_continue / thread_settle_idle / thread_unsettle）
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
          description: 行不存在即启用；误判自动降级或手动关闭后为 false
        false_positive_count_24h:
          type: integer
          description: 24 小时窗口内的误判次数（用户反向操作按事实计数）
        auto_disabled_at:
          type: string
          format: date-time
          nullable: true
          description: 误判自动降级的落库时间；手动重新启用后清空
        updated_at:
          type: string
          format: date-time
          nullable: true

    BotWritePolicyRuleToggleRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    BotEvent:
      type: object
      required: [seq, event_type, payload]
      description: SSE 重放账本条目（GET /events 的 HTTP 语义只用于流；本 schema 描述单帧 data）
      properties:
        seq:
          type: integer
          format: int64
        event_type:
          type: string
          description: delta / tool_call / tool_result / done / error
        payload:
          type: object
          description: 统一形状 {bot_id, run_id?, message_id?, call_id?, kind, phase?, payload}

    BotStreamEvent:
      type: object
      description: |
        SSE 帧 data 的统一形状：bot_id 必带；kind 区分 delta 下的
        text_delta / message_commit / run_started / user_message / lifecycle，
        tool_call 的 phase 区分 proposed / awaiting_confirmation / queued /
        running，tool_result 的 phase 区分 receipt / decision / terminal，
        done 携带 run 终态，error 携带 code/message（顺序固定 error → done）。
      properties:
        bot_id:
          type: string
        run_id:
          type: string
        message_id:
          type: string
        call_id:
          type: string
        kind:
          type: string
        phase:
          type: string
        payload:
          type: object
