  /api/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: 注册新用户（首个用户成为管理员；之后需有效邀请）
      security: []
      description: |
        INT-129 起公开注册按部署状态区分：
        - 库里还没有任何用户：本次注册创建**第一个用户**，`role=admin`，`invite_token` 即使携带也被忽略；
        - 库里已有用户：必须携带有效 `invite_token`（未使用、未撤销、未过期），新用户固定 `role=member`，
          邀请在注册同一事务内置为已使用（并发重复使用会整体失败，40932）。
        无邀请（或邀请无效/已过期/已撤销）时返回 40306 / 40432。注册页可先调
        `POST /api/auth/invites/validate` 校验（token 在请求体，不进 URL）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功，返回 token 与用户信息（首个用户 role=admin，其余 role=member）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: 已有用户且未携带邀请，公开注册关闭（40306）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 邀请无效或已过期（40432；不存在/已过期/已撤销统一此码）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 用户名已存在（40900）/ 邮箱已存在（40901）/ 邀请已被使用（40932）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/invites/validate:
    post:
      tags: [auth]
      operationId: validateInvite
      summary: 校验注册邀请是否可用（公开，注册页提前显示状态）
      security: []
      description: |
        供 `/register?invite=<token>` 页面在渲染表单前调用。token 走请求体、
        不落 URL 路径，避免明文被请求日志（selflog 记录 path）记下后被读回复用。
        有效返回过期时间；不存在、已过期、已撤销、已被使用统一返回 40432，
        不区分具体原因。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateInviteRequest'
      responses:
        '200':
          description: 邀请可用
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [expires_at]
                        properties:
                          expires_at:
                            type: string
                            format: date-time
                            description: 邀说过期时间
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 邀请无效或已过期（40432；不存在/已过期/已撤销/已使用/请求体缺 token 统一此码）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
