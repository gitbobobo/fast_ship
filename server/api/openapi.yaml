            - $ref: '#/components/schemas/IssueCollabDoc'
          description: 未产出为 null
    IssuePullRequest:
      type: object
      required: [id, issue_id, provider, repo_full_name, number, html_url, title, state, is_draft, author_login, head_ref, base_ref, merged_at, closed_at, link_origin, synced_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        issue_id:
          type: string
