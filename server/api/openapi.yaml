  /api/quota/accounts:
    get:
      tags: [quota]
      operationId: listQuotaAccounts
      summary: 列出当前用户的额度账号
      description: 回显最近一次成功抓取的快照（窗口、余额、套餐名）与状态；凭据不回显，credential_hint 只含末 4 位。JWT 与 API Key 均可（API Key 是机器人取数通道，只读）。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: 额度账号列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/QuotaAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [quota]
      operationId: createQuotaAccount
      summary: 添加额度账号
      description: |
        整组凭据按供应商元数据校验后 AES-256-GCM 加密落库；保存后服务端同步抓取一次，
        抓取失败仍然保存（HTTP 200，status 为 credential_invalid / provider_error），
        未抓取过时 status 为 pending。
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuotaAccountRequest'
      responses:
        '200':
          description: 保存成功（含同步抓取结果）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuotaAccount'
        '400':
          description: 参数无效（40001）；供应商未知（40030）；必填凭据字段缺失或为空（40031）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/quota/accounts/{id}:
    put:
      tags: [quota]
      operationId: updateQuotaAccount
      summary: 修改标签或整组替换凭据
      description: |
        省略 credentials 表示只改标签（不触发抓取）；提供 credentials 则整组替换凭据，
        抓取状态打回 pending 并同步重抓一次，旧快照保留到新快照写入。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/QuotaAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuotaAccountRequest'
      responses:
        '200':
          description: 更新后的额度账号
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuotaAccount'
        '400':
          description: 参数无效（40001）；凭据字段缺失或为空（40031）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 账号不存在或不属于当前用户（40430）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [quota]
      operationId: deleteQuotaAccount
      summary: 删除额度账号
      description: 删除该行（连带凭据密文与快照）；他人的账号一律 40430，不泄露存在性。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/QuotaAccountId'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 账号不存在或不属于当前用户（40430）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/quota/accounts/{id}/refresh:
    post:
      tags: [quota]
      operationId: refreshQuotaAccount
      summary: 立即抓取一次
      description: |
        同步抓取并落库后返回账号；抓取结果（成功或失败）落在 status 字段，HTTP 仍为 200。
        同一账号距上次成功抓取过近时返回 42900，message 写明需等待的秒数。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/QuotaAccountId'
      responses:
        '200':
          description: 抓取完成后的额度账号
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuotaAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 账号不存在或不属于当前用户（40430）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 手动刷新过于频繁（42900），message 含 Refresh-After 秒数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/quota/test:
