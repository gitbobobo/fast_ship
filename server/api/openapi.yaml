    CreateDocumentRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: trim 后 1-200 rune
        body:
          type: string
          description: ≤200000 rune
        parent_id:
          type: string
          description: 父文档 ID；须同项目，深度 ≤64
    UpdateDocumentRequest:
      type: object
      description: title/body/parent_id 至少传一个
      properties:
        title:
          type: string
          description: trim 后 1-200 rune
        body:
          type: string
          description: ≤200000 rune
        parent_id:
          type: string
          nullable: true
          description: 三态：不传=不变；null=清除父级；字符串=设为父文档（须同项目且无环）
    DocumentListItem:
      type: object
      required: [id, project_id, parent_id, title, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        parent_id:
          type: string
          nullable: true
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Document:
