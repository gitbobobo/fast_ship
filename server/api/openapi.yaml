      operationId: listProjectT3Bindings
      summary: 列出项目的 T3 绑定（附环境名与探测状态）
      description: |
        返回该 Fast Ship 项目在各 T3 环境下的 T3 项目绑定快照；
        `environment_name`/`environment_status` 取当前环境记录与实时探测结果
        （与 GET /api/environments 同口径）。快照字段与环境当前事实不一致
        即失效绑定，需重新绑定。JWT 与 API Key 均可访问（INT-89）。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 项目的绑定列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ProjectT3Binding'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 项目不存在（40401）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: 内部错误（50000）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/projects/{id}/t3-bindings/{environmentId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
        description: T3 环境 ID（UUID，归属当前用户；跨用户一律 40417）
    put:
      tags:
        - environments
      operationId: upsertProjectT3Binding
      summary: 绑定 T3 项目（实时校验后写入快照）
      description: |
        实时到目标环境确认 `t3_project_id` 存在后才写入绑定快照
        （`t3_project_title`/`workspace_root` 取绑定成功那一刻的上游值），
        不保存未校验的绑定：T3 项目不在该环境返回 40401，环境不存在 40417，
        环境不可达/凭证失效/上游错误返回 50202。同一 `(project_id,
        environment_id)` 重复 PUT 覆盖快照。JWT 与 API Key 均可访问（INT-89）。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertT3BindingRequest'
      responses:
        '200':
          description: 绑定成功，返回写入的快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectT3Binding'
        '400':
          description: 参数校验失败（40001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 项目不存在（40401）/ 环境不存在（40417）/ T3 项目不在该环境（40401）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: 环境不可达、凭证失效或 T3 上游失败（50202）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags:
        - environments
      operationId: deleteProjectT3Binding
      summary: 解绑 T3 项目
      description: 删除该环境下的绑定；已解绑时重复 DELETE 返回 200。JWT 与 API Key 均可访问（INT-89）。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 项目不存在（40401）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

