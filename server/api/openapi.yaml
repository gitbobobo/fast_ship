      summary: 更新机器人配置
      description: |
        指针字段表达「未提供保留」。provider_id 变更时新提供商必须属于当前用户，
        否则 40433；地址与密钥随提供商（INT-133），轮换密钥请更新 provider。
        人设变化重建系统提示词并递增 prompt_revision。配置变化对下个 run 生效，
        当前 run 使用开始时的快照与已创建的客户端。
