      operationId: answerT3ThreadSecretRequest
      summary: 应答线程内的密钥请求（保存或拒绝）
      description: |
        验证 itemId 是本线程本地 pending 的 secret_request 条目（合成 ID 转回
        T3 真实 turnItemId），再经 WS RPC `secrets.answerRequest` 提交。
