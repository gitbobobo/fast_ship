  /api/bots/usage:
    get:
      tags: [bots]
      operationId: getBotUsage
      summary: 花费总览（按天 / 按机器人 / 按定时任务，INT-162）
      description: |
        只用现有账本（bot_runs / bot_model_requests / bot_maintenance_*）实时
        聚合，不新增表、不回填。窗口按 users.timezone 切日，空值回退部署配置
        bots.memory.timezone，再回退 UTC。金额一律来自内置 models.dev 目录单价
        估算：目录无价、自定义提供商、缺 usage 的请求为「未计价」——已计价
        字段缺省为 null（缺失 ≠ 0），未计价请求计入 unpriced_requests。
        归属：session_kind='schedule' 的 run 按 schedule_task_id 归定时任务；
        触发来源 schedule_event 的主线 run 经 trigger_key 反查任务，计入该
        任务 linked_main_cost（近似，一次主线 run 可能同时处理多条输入），
        解析不出时计入主线；维护请求经 parent_run_id 计入所属 run 的显示
        成本，无父 run 的计入机器人维护项。仅返回当前用户自己的机器人数据。
      security:
        - jwtAuth: []
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [today, 7d, 30d]
            default: 7d
          description: 统计窗口；today = 生效时区的当天
        - name: bot_id
          in: query
          schema:
            type: string
          description: 限定单个机器人（须属于当前用户）；缺省为全部机器人总览
      responses:
        '200':
          description: 花费总览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BotUsageOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bots/usage/insights:
    get:
      tags: [bots]
      operationId: getBotUsageInsights
      summary: 花费优化参考（上下文增长 / 缓存命中 / 工具定义占比 / 维护占比 / 失败重试浪费 / 空转 / 换模型差价，INT-163）
      description: |
        与花费总览同一窗口、同一机器人集合的只读聚合，回答「钱花在哪、怎么省」。
        全部指标复用现有账本实时计算：金额仍是目录单价估算（缺失 ≠ 0），token
        估算列（input_tokens_estimate / tools_tokens_estimate）标 estimated。
        口径要点：
        - 缓存命中率：cached / prompt，只统计 usage 完整的请求；按天维度把请求
          计入所属 run（或维护运行）自身 created_at 的当地日，与总览记日一致。
        - 工具定义占比：tools_tokens_estimate / prompt_tokens，同一 usage 完整
          请求集合；分子是按 schema 字节的估算值。
        - 维护占比：窗口内全部维护请求已计价花费（含挂到 run 名下的，口径大于
          总览「维护」桶）占该机器人总花费（总览三桶之和）的比例，按用途拆分。
        - 失败和重试浪费：status=failed 的请求行中已计价金额、status=failed 的
          run 的显示成本合计、重复 request_hash 的重试次数；按 error_code 分组。
        - 空转：非 skipped 的终态 schedule run 中满足任一条件即算空转——
          silent=true、整次运行没有任何工具调用行、没有任何写操作调用（写操作
          按当前工具注册表 ReadOnly 之外的 action 判定，未知动作按写处理）。
        - 换模型差价：按 run 冻结快照的目录归属分组，用同一批 usage 完整请求的
          token 数按同目录其他模型单价重算，取最便宜至多 3 个候选；只按价格
          重算，不代表效果一样，也不考虑不同模型 tokenizer 的差异。
      security:
        - jwtAuth: []
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [today, 7d, 30d]
            default: 7d
          description: 统计窗口；today = 生效时区的当天
        - name: bot_id
          in: query
          schema:
            type: string
          description: 限定单个机器人（须属于当前用户）；缺省为全部机器人总览
      responses:
        '200':
          description: 花费优化参考
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BotUsageInsights'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bots/usage/runs/{runId}:
    get:
      tags: [bots]
      operationId: getBotUsageRun
      summary: 单次运行花费明细（INT-162）
      description: |
        单次 run 的完整账单：每次模型请求（含失败重试）及其工具调用、关联的
        压缩/维护运行与请求。display_cost = 自身已计价成本 + 关联维护已计价
        成本；不改写 run 的 cost_estimate 列。
      security:
        - jwtAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 运行花费明细
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BotUsageRunDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bots/{id}:
    get:
      tags: [bots]
      operationId: getBot
      summary: 读取机器人配置
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
      responses:
