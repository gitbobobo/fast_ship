  /api/projects/{id}/issues:
    get:
      tags: [issues]
      operationId: listIssues
      summary: 分页列出项目 Issue（服务端内存全量过滤后分页）
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IssueState'
          description: 按 open/closed 过滤
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: 关键词过滤（内存全量匹配）：匹配标题、正文、作者 login、`INT-123`/`GH-123` 编号，纯数字时还会匹配 sequence_number 或 GitHub number
        - name: label
          in: query
          required: false
          schema:
            type: string
          description: 按标签名过滤（不区分大小写；GitHub 标签与 internal-meta 标签均匹配）
        - name: source
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IssueSource'
          description: 按来源过滤
        - name: assignee
          in: query
          required: false
          schema:
            type: string
          description: 按 GitHub 指派人 login 过滤（不区分大小写）
        - name: milestone
          in: query
          required: false
          schema:
            type: string
          description: 按 GitHub 里程碑标题过滤（不区分大小写）
        - name: workflow_status
          in: query
          required: false
          schema:
            type: string
            enum: [todo, in_progress, done, unset]
          description: 按工作流状态过滤；`unset` 表示未设置（无 meta 或为空串）
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [updated_desc, updated_asc, created_desc, created_asc, comments_desc, comments_asc]
            default: updated_desc
          description: 排序；未知值按 updated_desc 处理
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize20'
      responses:
        '200':
          description: Issue 分页列表（列表项不含 collab / pull_requests 字段；带 pull_request_summary 聚合计数）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PaginatedData'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [issues]
      operationId: createIssue
      summary: 创建 Issue
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueRequest'
      responses:
        '200':
          description: 创建的 Issue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: API Key 创建 github 来源 Issue（40301）或项目未配 GitHub（40003）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
