                  maxItems: 200
                  items:
                    type: object
                    required: [issue_id]
                    properties:
                      issue_id:
                        type: string
                        format: uuid
                        description: Issue ID（UUID）
                      workflow_status:
                        $ref: '#/components/schemas/IssueWorkflowStatus'
