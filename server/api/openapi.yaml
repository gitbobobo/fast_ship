                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bots/{id}/messages:
    get:
      tags: [bots]
      operationId: listBotMessages
      summary: 主线消息分页
      description: |
        before_seq/after_seq 都是排他 seq 边界，页内按 seq 正序；不使用 offset 分页。
        两个边界都省略时返回最新的 limit 条（聊天首屏加载尾部）；只给 before_seq
        返回该边界之前最近的 limit 条（「加载更早」）；只给 after_seq 返回该边界
        之后最早的 limit 条（断线补读）。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
        - name: before_seq
          in: query
          schema:
            type: integer
            format: int64
          description: 只返回 seq 小于该值的消息；取距该边界最近的 limit 条（「加载更早」）
        - name: after_seq
          in: query
          schema:
            type: integer
            format: int64
          description: 只返回 seq 大于该值的消息；取距该边界最近的 limit 条（补读）
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 200
      responses:
        '200':
          description: 消息列表（含 total=本次返回条数）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, calls, total]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/BotMessage'
                          calls:
                            type: array
                            description: 页内消息引用到的调用记录（assistant 嵌套 tool_calls 与非 assistant 消息顶层 call_id），保证旧消息渲染确认/警示卡不缺数据
                            items:
                              $ref: '#/components/schemas/BotToolCall'
                          total:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [bots]
      operationId: sendBotMessage
      summary: 向主线发送用户消息
      description: |
        client_message_id 必填（幂等键）：同键同正文返回已有消息；同键不同正文
        返回 40925。消息落库后由 runtime 唤醒/延续主线 run；响应返回已落库
        消息、当前活动 run（可能尚未包含本消息）与 queued 标记。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendBotMessageRequest'
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SendBotMessageResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 同 client_message_id 已用于不同正文（40925）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bots/{id}/chat:
    get:
      tags: [bots]
      operationId: getBotChatSnapshot
      summary: 聊天页一致快照
      description: |
        消息尾部页、调用、run 与事件水位（next_event_seq）取自同一读取点。
        详情页先装快照再订阅：SSE 游标从 next_event_seq - 1 起读，与快照内容
        严格衔接，既不重放快照已含的事件也不漏掉快照之后的事件。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
        - name: message_limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
          description: 消息尾部页大小
      responses:
        '200':
          description: 快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BotChatSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bots/{id}/events:
    get:
      tags: [bots]
      operationId: streamBotEvents
      summary: SSE 事件流（持久重放账本）
      description: |
        `text/event-stream`。五种事件固定：`delta`（text_delta 增量、
        message_commit 完整消息提交、run_started、user_message、lifecycle）、
        `tool_call`（phase=proposed/awaiting_confirmation/queued/running）、
        `tool_result`（phase=receipt/decision/terminal）、`done`（run 完成，
        不是整个事件流关闭）、`error`（run 失败；顺序固定 error → done）。
        每帧 `id: <event_seq>`；断线后用 `after_seq=N` 重放补齐。心跳是
        `: ping` 注释。SSE 断开只结束订阅，不取消 run。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
        - name: after_seq
          in: query
          schema:
            type: integer
            format: int64
            default: 0
          description: 从该事件 seq 之后开始重放
      responses:
        '200':
          description: 事件流
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/BotStreamEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/bots/{id}/runs:
    get:
      tags: [bots]
