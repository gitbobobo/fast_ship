  /api/issues/internal-meta:
    put:
      tags: [issues]
      operationId: batchUpdateIssueInternalMeta
      summary: 批量更新 Issue 内部工作流状态
      description: 批量把多个 Issue 的 workflow_status 设为指定值；逐项处理，单项失败计入 failures 不中断整批。items 为空或 >200 整体 400；某项 issue_id 为空整体 400；某项 workflow_status 为 null 计入该项失败。JWT 与 API Key 均可调用。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [issue_id]
                    properties:
                      issue_id:
                        type: string
                        format: uuid
                        description: Issue ID（UUID）
                      workflow_status:
                        $ref: '#/components/schemas/IssueWorkflowStatus'
                        description: 缺省或为 null 时该项计入 failures
      responses:
        '200':
          description: 批量更新结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IssueBatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
