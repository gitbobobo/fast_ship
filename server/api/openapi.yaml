      operationId: reportAutomationRun
      summary: 自动化运行回报（started / finished）
      description: |
        仅运行令牌。开始回报幂等；结束回报在同一事务内消费令牌并登记后置操作，
        允许结束先于开始；线程超时后首次结束不能把状态改成 completed。
        结束后仅重放完全相同的结束回报（直到 expires_at），其它回报返回 409（40917）。
      security:
        - runTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationRunReportRequest'
      responses:
        '200':
          description: 回报受理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AutomationRunReportResult'
        '401':
          description: 运行令牌无效/过期（40106）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 凭证类型不允许（40304）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 回报冲突（40917）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

