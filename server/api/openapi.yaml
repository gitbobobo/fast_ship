  /api/automation-agent/pull-request/review:
    post:
      tags: [automation-agent]
      operationId: submitAgentPullRequestReview
      summary: 提交 PR review（COMMENT / APPROVE / REQUEST_CHANGES）
      description: commit_id 由服务端取本运行的 head SHA，不接受请求传入。
      security:
