                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentPullRequestReviewResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 运行令牌无效/过期/已消费（40106）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 凭证类型不允许（40304）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/automation-agent/pull-request/check:
    post:
      tags: [automation-agent]
      operationId: updateAgentPullRequestCheck
      summary: 更新本运行 check run 的标题与说明（结论由运行终态决定）
      description: 请求不接受 check run id；服务端只更新本运行绑定的 check。
      security:
        - runTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCheckUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 运行令牌无效/过期/已消费（40106）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 凭证类型不允许（40304）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token，由 POST /api/auth/register、login 或 refresh 签发。仅 JWT 的端点对 `fsk_` API Key 返回 403（40301）。
    apiKeyAuth:
      type: http
      scheme: bearer
      description: "API Key，以 `fsk_` 开头（Web「设置 → API Key」创建）。与 jwtAuth 共用 `Authorization: Bearer` 头，服务端按 `fsk_` 前缀区分凭证类型。"
    runTokenAuth:
      type: http
      scheme: bearer
      description: |
        自动化运行令牌，`fsr_` 开头，由 Fast Ship 在派发自动化线程时写进提示词（INT-90）。
        仅接受 `Authorization: Bearer`（不支持 query 凭证）；一次运行一个令牌，结束回报时消费。
        令牌过期前允许重放完全相同的结束回报；读线程/发通知端点在令牌消费后立即拒绝（40106）。
        携带 `fsk_` API Key 或 JWT 调用返回 403（40304）。

  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 项目 ID（UUID）
    T3EnvironmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: T3 环境 ID（UUID，归属当前用户，跨用户一律 40417）
    AutomationId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 自动化 ID（UUID，归属当前用户，跨用户一律 404）
    AutomationRunId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 自动化运行 ID（UUID，归属当前用户，跨用户一律 404）
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 通知 ID（UUID，归属当前用户，跨用户一律 404）
    T3ThreadId:
      name: threadId
      in: path
      required: true
      schema:
        type: string
      description: T3 threadId
    T3ThreadItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
      description: Fast Ship 条目 ID（sourceThreadId + "::" + T3 原始条目 id，来自线程详情的 items[].id）
    T3ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
      description: T3 projectId（来自 composer-options 的 projects[].id）
    T3RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
      description: T3 runId（排队消息行，来自线程详情 queue.items[].run_id）
    T3RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        maxLength: 256
      description: T3 运行时请求 ID（来自线程详情 items[].request_id）
    T3AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        maxLength: 256
      description: T3 附件 ID（来自附件上传响应的 id）
    ProjectOrKeyId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: API Key ID
    IssueId:
      name: iid
      in: path
      required: true
      schema:
        type: string
      description: Issue ID（UUID，非 INT-123/GH-123 短编号）
    PullRequestLinkId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: PR 关联行 ID（UUID）
    VersionId:
      name: vid
      in: path
      required: true
      schema:
        type: string
      description: 版本 ID（UUID）
    ScreenshotScreenId:
      name: sid
      in: path
      required: true
      schema:
        type: string
      description: 截图界面 ID（UUID）
    ScreenshotVersionId:
      name: vid
      in: path
      required: true
      schema:
        type: string
      description: 截图版本 ID（UUID）
    ScreenshotAnnotationId:
      name: aid
      in: path
      required: true
      schema:
        type: string
      description: 截图标注 ID（UUID）
    DocId:
      name: doc_id
      in: path
      required: true
      schema:
        type: string
      description: 文档 ID（UUID）
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
      description: 日志运行 ID（客户端生成，项目内唯一）
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
      description: 页码，<1 按 1 处理
    PageSize20:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: 每页条数；越界（<1 或 >100）回落为 20
    PageSize50:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
      description: 每页条数；越界（<1 或 >100）回落为 50
    QueryToken:
      name: token
      in: query
      required: false
      schema:
        type: string
      description: 可选 query 凭证（JWT 或 `fsk_` API Key），供无法携带 Authorization 头的场景（`<img>`、浏览器直链下载）。与 Authorization 头二选一，头优先。
    SelfLogStartTime:
      name: start_time
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: 起始时间（含），RFC3339
    SelfLogEndTime:
      name: end_time
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: 结束时间（含），RFC3339
    SelfLogLevel:
      name: level
      in: query
      required: false
      schema:
        type: string
        enum: [DEBUG, INFO, WARN, ERROR]
      description: 精确级别过滤
    SelfLogMinLevel:
      name: min_level
      in: query
      required: false
      schema:
        type: string
        enum: [DEBUG, INFO, WARN, ERROR]
      description: 不低于该级别的过滤（与 level 互斥，同时提供时以 level 为准）
    SelfLogModules:
      name: modules
      in: query
      required: false
      schema:
        type: string
      description: 模块过滤，逗号分隔多值（如 `http,automation`）；模块取值见条目 module 字段
    SelfLogRequestID:
      name: request_id
      in: query
      required: false
      schema:
        type: string
      description: 按请求 ID 过滤（响应头 X-Request-Id 的值）
    SelfLogUserID:
      name: user_id
      in: query
      required: false
      schema:
        type: string
      description: 按归属用户过滤；仅限本人，他人 ID 只会得到空结果
    SelfLogProjectID:
      name: project_id
      in: query
      required: false
      schema:
        type: string
      description: 按关联项目 ID 过滤
    SelfLogIssueID:
      name: issue_id
      in: query
      required: false
      schema:
        type: string
      description: 按关联 Issue ID 过滤
    SelfLogAutomationID:
      name: automation_id
      in: query
      required: false
      schema:
        type: string
      description: 按关联自动化 ID 过滤
    SelfLogRunID:
      name: run_id
      in: query
      required: false
      schema:
        type: string
      description: 按关联自动化运行 ID 过滤
    SelfLogThreadID:
      name: thread_id
      in: query
      required: false
      schema:
        type: string
      description: 按关联 T3 线程 ID 过滤
    SelfLogExtraEq:
      name: extra_eq
      in: query
      required: false
      schema:
        type: string
      description: 附加字段等值过滤，可重复，格式 `key=value`（json_extract 后 CAST 为文本再比较，数字值如 status=200 也可匹配）
    SelfLogKeyword:
      name: keyword
      in: query
      required: false
      schema:
        type: string
      description: 关键词包含过滤（匹配 message 与 extra）
    SelfLogExcludeKeyword:
      name: exclude_keyword
      in: query
      required: false
      schema:
        type: string
      description: 关键词排除过滤（同 keyword 口径）
    SelfLogCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: 分页游标；取上一页响应的 next_cursor
    SelfLogLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 500
      description: 单页条数；越界（<1 或 >500）回落为 100
    SelfLogOrder:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      description: 按时间排序方向；游标内含方向，翻页时不允许改变
    SelfLogFields:
      name: fields
      in: query
      required: false
      schema:
        type: string
      description: 返回字段选择，逗号分隔（如 `module,message,extra`）；id/time/level/message 始终返回，其余未选字段在条目中省略。未知字段名返回 40001

  responses:
    EmptySuccess:
      description: 操作成功（data 为 null）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    nullable: true
    BadRequest:
      description: 请求参数无效（40001-40099）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 未提供或提供无效凭证（40100-40199）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 已认证但无权限（40300-40399；40301=API Key 越权，40303=仅限 API Key）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在（40400-40499）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 业务冲突（40900-40999）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 服务器内部错误（50000）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RequestEntityTooLarge:
      description: 请求体超过大小限制（裸 413，无 JSON body）

  schemas:
    Envelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 业务错误码；0 表示成功
        message:
          type: string
          description: 人类可读信息；成功时为 "success"
        data:
          description: 响应负载；形状随端点而变，由 allOf 组合的兄弟 schema 收窄
      description: 统一 JSON 信封 {code, message, data}
    ErrorEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          description: 业务错误码（4xxxx 按区间映射 HTTP 状态：401xx→401，403xx→403，404xx→404，409xx→409，412xx→412，50xxx→500；502xx→502）
        message:
          type: string
        data:
          type: object
          nullable: true
          description: 恒为 null
      description: 错误响应信封
    PaginatedData:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: {}
          description: 当前页条目（元素类型由组合 schema 收窄）
        total:
          type: integer
          format: int64
          description: 符合条件的总条数
        page:
          type: integer
        page_size:
          type: integer
      description: 分页响应 data 形状；与 Envelope allOf 组合后 items 由兄弟 schema 收窄为具体类型

    # ---- 枚举（x-go-type 指回 model 包类型；oapi-codegen 生成时复用现有类型） ----
    IssueState:
      type: string
      enum: [open, closed]
      x-go-type: model.IssueState
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    IssueSource:
      type: string
      enum: [github, internal]
      x-go-type: model.IssueSource
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    IssueWorkflowStatus:
      type: string
      enum: ["", todo, in_progress, done]
      description: 空串表示未设置（重置语义）
      x-go-type: model.IssueWorkflowStatus
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    IssueSyncStatus:
      type: string
      enum: [idle, running, failed, completed]
      x-go-type: model.IssueSyncStatus
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    IssuePullRequestState:
      type: string
      enum: [open, closed, merged]
      description: merged = GitHub 上 closed 且 merged_at 非空
      x-go-type: model.IssuePullRequestState
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    IssuePullRequestLinkOrigin:
      type: string
      enum: [manual, synced]
      description: manual=用户显式 attach；synced=远端同步投影产生（清理逻辑只作用于 synced）
      x-go-type: model.IssuePullRequestLinkOrigin
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    IssueRecommendationPriority:
      type: string
      enum: [high, medium, low]
      x-go-type: model.IssueRecommendationPriority
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    CollabAuthorKind:
      type: string
      enum: [user, agent]
      x-go-type: model.CollabAuthorKind
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    LogLevel:
      type: string
      enum: [debug, info, warn, error, fatal]
      x-go-type: model.LogLevel
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    VersionStatus:
      type: string
      enum: [pending, shipped]
      x-go-type: model.VersionStatus
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    ShipStatus:
      type: string
      enum: ["", in_progress, failed, completed]
      description: 空串表示尚未发货（idle）
      x-go-type: model.ShipStatus
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    ShipStage:
      type: string
      enum: ["", precheck, create_tag, create_release, upload_assets, finalize]
      description: 空串表示未进入发货流程
      x-go-type: model.ShipStage
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    IssueShipHookStatus:
      type: string
      enum: [pending, running, fired]
      x-go-type: model.IssueShipHookStatus
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model

    # ---- auth ----
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 50
          description: 用户名，2-50 字符，全局唯一
          x-oapi-codegen-extra-tags:
            binding: required,min=2,max=50
        email:
          type: string
          format: email
          description: 邮箱，全局唯一
          x-oapi-codegen-extra-tags:
            binding: required,email
        password:
          type: string
          minLength: 8
          description: 密码，≥8 字符
          x-oapi-codegen-extra-tags:
            binding: required,min=8
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: 用户名或邮箱
          x-oapi-codegen-extra-tags:
            binding: required
        password:
          type: string
          x-oapi-codegen-extra-tags:
            binding: required
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: fsr_ 开头的 refresh token
          x-oapi-codegen-extra-tags:
            binding: required
    UpdateProfileRequest:
      type: object
      # 不带 binding tag：handler 用手写 updateMeInput 绑定（字段指针化后
      # omitempty 对显式空串的跳过语义不等价），见 handler/auth.go。
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 50
          description: 新用户名；与现值相同或省略则不变
        email:
          type: string
          format: email
          description: 新邮箱
    UpdatePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          x-oapi-codegen-extra-tags:
            binding: required
        new_password:
          type: string
          minLength: 8
          x-oapi-codegen-extra-tags:
            binding: required,min=8
    AuthResponse:
      type: object
      required: [token, refresh_token, user]
      properties:
        token:
          type: string
          description: JWT access token（HS256，有效期见服务端 jwt.expire_hours，默认 24h）
        refresh_token:
          type: string
          description: fsr_ 开头，有效期默认 7 天
        user:
          $ref: '#/components/schemas/User'
    RefreshResponse:
      type: object
      required: [token, refresh_token]
      properties:
        token:
          type: string
        refresh_token:
          type: string
    User:
      type: object
      required: [id, username, email, avatar_url, created_at, updated_at]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        avatar_url:
          type: string
          description: 形如 /api/avatars/:uid/:filename，未设置为空串
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ---- ai ----
    AISettings:
      type: object
      required: [api_host, model, configured]
      properties:
        api_host:
          type: string
          description: 默认 https://api.minimaxi.com
        model:
          type: string
          description: 默认 MiniMax-M2.5
        configured:
          type: boolean
          description: 是否已配置 API Key（Key 本身永不回显）
        updated_at:
          type: string
          format: date-time
          description: omitempty，未配置时缺省
    UpdateAISettingsRequest:
      type: object
      properties:
        api_host:
          type: string
          description: 缺省回退默认 host；须为合法 URL
        api_key:
          type: string
          description: 明文 Key（加密存储，不回显）；首次配置必填，已有配置时空串保留旧值
        model:
          type: string
          description: 缺省回退默认模型
    GenerateTitleResponse:
      type: object
      required: [titles]
      properties:
        titles:
          type: array
          items:
            type: string
          description: 候选标题（通常 3 个）
    IssueChecklistSuggestions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 12
          items:
            type: object
            required: [title]
            properties:
              title:
                type: string
    IssuePromptItem:
      type: object
      required: [id, name, content]
      properties:
        id:
          type: string
          description: trim 后非空
        name:
          type: string
          description: trim 后非空
        content:
          type: string
          description: 提示词正文；trim 后非空
        preferences:
          $ref: '#/components/schemas/IssuePromptPreferences'
    IssuePromptPreferences:
      type: object
      description: |
        T3 启动偏好（绑定在提示词条目上的默认值；对象缺省即各字段取默认）。
        写入时校验：environment 只能是 "auto" 或已存在的 T3 环境 ID，
        workspace 只能是 "worktree"|"root"，model_selection 的字段类型；
        非法值返回 40001
      properties:
        environment:
          type: string
          description: '"auto" 或已存在的 T3 环境 ID；缺省 auto'
        workspace:
          type: string
          description: '"worktree" 或 "root"；缺省 worktree'
        model_selection:
          $ref: '#/components/schemas/T3ModelSelection'
    IssuePrompts:
      type: object
      required: [prompts]
      properties:
        prompts:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/IssuePromptItem'
          description: 未配置时为 null，前端兜底默认提示词

    # ---- api keys ----
    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          x-oapi-codegen-extra-tags:
            binding: required,min=1,max=100
    ApiKey:
      type: object
      required: [id, user_id, name, key_prefix, key_hash, last_used_at, created_at]
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
          description: Key 原文前 8 字符（不含 fsk_ 前缀），用于列表辨识
        key_hash:
          type: string
          description: Key 的 SHA-256 哈希
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          properties:
            key:
              type: string
              description: 完整 API Key（fsk_ 前缀），仅创建响应中出现一次，服务端不存原文

    # ---- github tokens ----
    CreateGitHubTokenRequest:
      type: object
      required: [title, token]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Token 标题（如「主仓库发布 Token」）
          x-oapi-codegen-extra-tags:
            binding: required,min=1,max=100
        token:
          type: string
          minLength: 1
          description: GitHub PAT 明文（加密存储，任何响应都不回显）
          x-oapi-codegen-extra-tags:
            binding: required,min=1
    UpdateGitHubTokenRequest:
      type: object
      # 不带 binding tag：handler 允许只传 title 或只传 token，两个都可缺省。
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: 非空时替换标题；改标题不重新检测
        token:
          type: string
          minLength: 1
          description: 非空时替换密钥，对所有引用项目立即生效并重新检测；与同用户另一条记录明文重复时返回 40914；并发替换时密钥已变返回 40915
    GitHubToken:
      type: object
      required: [id, title, token_prefix, detection_status, detection_token_type, detection_scopes, detection_login, detection_detail, referenced_projects, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        token_prefix:
          type: string
          description: Token 明文前 8 个字符（如 ghp_Ab12），用于列表辨识；其余不存
        detection_status:
          type: string
          enum: [unchecked, ok, invalid, failed]
          description: unchecked=未检测；ok=认证成功；invalid=GitHub 拒绝凭证（401）；failed=检测失败（网络/GitHub 5xx，不是凭证无效）
        detection_token_type:
          type: string
          enum: [classic, fine_grained, unknown]
          description: classic=有 OAuth scopes 的 Classic PAT；fine_grained=github_pat_ 前缀；unknown=无法判断（未检测时恒为 unknown）
        detection_scopes:
          type: array
          items:
            type: string
          description: Classic PAT 的 OAuth scopes；fine-grained 恒为空数组
        detection_login:
          type: string
          description: 认证成功时的 GitHub login，否则为空串
        detection_detail:
          type: string
          description: 给人看的补充说明（fine-grained 的「无法自动获取完整授权」、失败原因等），不含 token
        detected_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次检测完成时间；未检测为 null
        referenced_projects:
          type: array
          items:
            $ref: '#/components/schemas/GitHubTokenProjectRef'
          description: 两个用途中任一引用了该 Token 的项目
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GitHubTokenProjectRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    # ---- projects ----
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 项目名，当前用户下唯一
          x-oapi-codegen-extra-tags:
            binding: required,min=1,max=100
        description:
          type: string
        repository_url:
          type: string
          description: GitHub 仓库链接（owner/repo 或完整 URL）；不再要求同时提供 Token
        public_github_token_id:
          type: string
          description: 公开仓库 Token（Token 库记录 id）引用；用于 Issue 同步与 GitHub 写、分支查询、发货。可空；必须属于当前用户，否则 40420
        code_github_token_id:
          type: string
          description: 代码仓库 Token（Token 库记录 id）引用；仅用于读取关联 PR（含其他仓库）。可空；必须属于当前用户，否则 40420
    UpdateProjectRequest:
      type: object
      # 不带 binding tag：handler 用手写 updateProjectInput 绑定，原因同
      # UpdateProfileRequest（见 handler/project.go）。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          description: 缺省或 null 保留现值；显式空串清空；非空替换
        repository_url:
          type: string
          description: 同创建；不再要求项目已配 Token
        public_github_token_id:
          type: string
          nullable: true
          description: 三态——key 缺省保留现值；显式 null 或空串清空该用途引用；非空替换（须属于当前用户，否则 40420）
        code_github_token_id:
          type: string
          nullable: true
          description: 三态——key 缺省保留现值；显式 null 或空串清空该用途引用；非空替换（须属于当前用户，否则 40420）
    Project:
      type: object
      required: [id, name, description, github_owner, github_repo, public_github_token_id, code_github_token_id, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        github_owner:
          type: string
        github_repo:
          type: string
        public_github_token_id:
          type: string
          description: 公开仓库 Token 引用；未配置为空串
        code_github_token_id:
          type: string
          description: 代码仓库 Token 引用；未配置为空串
        latest_version:
          $ref: '#/components/schemas/LatestVersion'
        issue_count:
          type: integer
          description: omitempty，仅在列表项中出现；项目 Issue 总数（不区分状态）
        issue_workflow_counts:
          $ref: '#/components/schemas/IssueWorkflowCounts'
        issue_sync:
          $ref: '#/components/schemas/IssueSyncState'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IssueWorkflowCounts:
      type: object
      description: omitempty，仅在列表项中出现；仅统计 state=open 的 Issue，按内部状态分组
      required: [unset, todo, in_progress, done]
      properties:
        unset:
          type: integer
          description: 未设置内部状态的 Issue 数（含无 internal meta 行的 Issue）
        todo:
          type: integer
        in_progress:
          type: integer
        done:
          type: integer
    LatestVersion:
      type: object
      required: [id, version_number, status, created_at]
      properties:
        id:
          type: string
        version_number:
          type: string
        status:
          $ref: '#/components/schemas/VersionStatus'
        created_at:
          type: string
          format: date-time
      description: omitempty，仅在列表项中出现
    IssueSyncState:
      type: object
      required: [status, last_error]
      properties:
        status:
          $ref: '#/components/schemas/IssueSyncStatus'
        last_issue_updated_at:
          type: string
          format: date-time
          description: omitempty
        last_synced_at:
          type: string
          format: date-time
          description: omitempty
        last_successful_sync_at:
          type: string
          format: date-time
          description: omitempty
        last_error:
          type: string
      description: omitempty，项目 GitHub 同步状态
    Branch:
      type: object
      required: [name, sha, default]
      properties:
        name:
          type: string
        sha:
          type: string
        default:
          type: boolean

    # ---- versions & ship ----
    CreateVersionRequest:
      type: object
      required: [version_number]
      properties:
        version_number:
          type: string
          description: 版本号（同 tag 名），项目内唯一
          x-oapi-codegen-extra-tags:
            binding: required
        release_notes:
          type: string
          description: Release 说明；发货前必填
        target_commitish:
          type: string
          description: 目标分支；非空时校验为仓库已存在分支
    UpdateVersionRequest:
      type: object
      properties:
        version_number:
          type: string
          description: 仅 JWT 可改；API Key 携带返回 40301。非空且项目内唯一
        release_notes:
          type: string
        target_commitish:
          type: string
          description: 非空时校验为仓库已存在分支；空串清除
    Version:
      type: object
      required: [id, project_id, version_number, status, release_notes, target_commitish, github_release_url, error_log, ship_status, ship_stage, ship_message, ship_hooks_status, created_at, shipped_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        version_number:
          type: string
        status:
          $ref: '#/components/schemas/VersionStatus'
        release_notes:
          type: string
        target_commitish:
          type: string
        github_release_url:
          type: string
          description: 发货成功后写入
        error_log:
          type: string
        ship_status:
          $ref: '#/components/schemas/ShipStatus'
        ship_stage:
          $ref: '#/components/schemas/ShipStage'
        ship_message:
          type: string
        ship_hooks_status:
          type: string
          enum: [pending, completed, failed, incomplete]
          description: 该次发货触发的 issue 钩子执行汇总状态
        created_at:
          type: string
          format: date-time
        shipped_at:
          type: string
          format: date-time
          nullable: true
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
          description: omitempty，无安装包时缺省
    ShipCheckItem:
      type: object
      required: [key, label, ok]
      properties:
        key:
          type: string
          description: release_notes / artifacts / target_commitish / github_config
        label:
          type: string
        ok:
          type: boolean
        detail:
          type: string
          description: omitempty
    PendingIssueHook:
      type: object
      required: [issue_id, reference, title, comment, close, workflow_enabled, workflow_status]
      properties:
        issue_id:
          type: string
        reference:
          type: string
          description: INT-n 或 GH-n
        title:
          type: string
        comment:
          type: boolean
        close:
          type: boolean
        workflow_enabled:
          type: boolean
        workflow_status:
          type: string
          description: 目标工作流状态，可能为 ""（重置）
    ShipCheck:
      type: object
      required: [can_ship, items, pending_issue_hooks]
      properties:
        can_ship:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShipCheckItem'
        pending_issue_hooks:
          type: array
          items:
            $ref: '#/components/schemas/PendingIssueHook'
    ShipResult:
      type: object
      required: [hook_total, hook_failed, hook_status]
      properties:
        hook_total:
          type: integer
        hook_failed:
          type: integer
        hook_status:
          type: string
          description: completed / failed / incomplete
        hook_error:
          type: string
          description: omitempty

    # ---- artifacts ----
    Artifact:
      type: object
      required: [id, version_id, file_name, file_size, platform, uploaded_by, uploaded_at]
      properties:
        id:
          type: string
        version_id:
          type: string
        file_name:
          type: string
        file_size:
          type: integer
          format: int64
        platform:
          type: string
        uploaded_by:
          type: string
          description: '用户名或 "API Key: <name>"'
        uploaded_at:
          type: string
          format: date-time

    # ---- issues ----
    CreateIssueRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: trim 后须非空
        body:
          type: string
          description: Markdown；引用 /api/issues/assets/{aid}/content 链接会在创建时挂载草稿附件
        workflow_status:
          $ref: '#/components/schemas/IssueWorkflowStatus'
        source:
          $ref: '#/components/schemas/IssueSource'
          description: 默认 internal；github 仅 JWT 可用，API Key 传 github 返回 40301；其他值按 internal 处理
    UpdateIssueRequest:
      type: object
      description: 至少传一个字段；state_reason 必须随 state 同传
      properties:
        title:
          type: string
          description: trim 后须非空
        body:
          type: string
        state:
          $ref: '#/components/schemas/IssueState'
          description: 仅 JWT；API Key 携带返回 40301
        state_reason:
          type: string
          enum: [completed, not_planned, reopened]
          description: 仅 JWT；closed→completed|not_planned，open→reopened；置 open 且 reason 为空会清空
        labels:
          type: array
          items:
            type: string
          description: 标签名数组；internal issue 须为已存在仓库标签，GitHub issue 仅做非空/去重校验
    IssueChecklistItemInput:
      type: object
      required: [title]
      properties:
        id:
          type: string
          description: 缺省时服务端生成；传旧 id 复用条目
        title:
          type: string
          description: trim 后须非空
        is_completed:
          type: boolean
    UpsertShipHookRequest:
      type: object
      description: 三类动作至少启用一个，否则 40001
      properties:
        comment_body:
          type: string
          description: 传入即启用评论动作；trim 后 1-4000 rune；支持 {version}、{release_url} 占位符
        close:
          type: boolean
          description: true 时发货后关闭 Issue（state_reason=completed）
        workflow_status:
          $ref: '#/components/schemas/IssueWorkflowStatus'
          description: 传入即启用工作流动作（含 "" 重置）
    UpsertIssueRecommendationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: 推荐理由，trim 后 1-500 rune
        priority:
          $ref: '#/components/schemas/IssueRecommendationPriority'
        dependencies:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
          description: 前置依赖 Issue UUID 数组，整组替换，不含自身；重复自动去重（保序）
    DeferIssueRecommendationRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
          description: 延后备注，trim 后 ≤500 rune；缺省或空串表示无备注
    UpsertIssueCollabRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: Markdown；trim 后 1-8000 rune；重复 PUT 覆盖
    AttachIssuePullRequestRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: GitHub PR 链接，形如 https://github.com/<owner>/<repo>/pull/<number>（允许 http、www 前缀与尾部 /files、query、fragment 等）；其他字段由服务端从 GitHub 拉取
    IssueBatchFailure:
      type: object
      required: [id, error]
      properties:
        id:
          type: string
          description: Issue ID
        reference:
          type: string
          description: omitempty；INT-n 或 GH-n
        error:
          type: string
    IssueBatchResult:
      type: object
      required: [total, succeeded, failed, failures, elapsed_ms]
      properties:
        total:
          type: integer
          format: int64
        succeeded:
          type: integer
        failed:
          type: integer
        failures:
          type: array
          items:
            $ref: '#/components/schemas/IssueBatchFailure'
          description: 最多返回前 50 条失败明细
        elapsed_ms:
          type: integer
          format: int64
      description: 批量操作结果，与 service.BatchCloseDoneIssuesResponse 同形；batch-close 与批量 internal-meta 共用
    IssueActor:
      type: object
      required: [login, avatar_url]
      properties:
        login:
          type: string
        avatar_url:
          type: string
          description: GitHub 头像经媒体代理改写；internal 用户为空串
    IssueLabel:
      type: object
      required: [name, color, description]
      properties:
        name:
          type: string
        color:
          type: string
          description: "十六进制颜色（不带 # 前缀）"
        description:
          type: string
    IssueMilestone:
      type: object
      required: [number, title, state, description]
      properties:
        number:
          type: integer
        title:
          type: string
        state:
          type: string
        description:
          type: string
    IssueReactionSummary:
      type: object
      required: [total_count, "+1", "-1", laugh, hooray, confused, heart, rocket, eyes]
      properties:
        total_count:
          type: integer
        "+1":
          type: integer
        "-1":
          type: integer
        laugh:
          type: integer
        hooray:
          type: integer
        confused:
          type: integer
        heart:
          type: integer
        rocket:
          type: integer
        eyes:
          type: integer
    IssueGitHubMeta:
      type: object
      required: [github_issue_id, github_node_id, number, html_url, author_association, assignees, labels, reactions, comments_count, locked, active_lock_reason, synced_at]
      properties:
        github_issue_id:
          type: integer
          format: int64
        github_node_id:
          type: string
        number:
          type: integer
          description: GitHub issue 编号（reference 的 GH-n 来源）
        html_url:
          type: string
        author_association:
          type: string
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/IssueActor'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/IssueLabel'
        milestone:
          $ref: '#/components/schemas/IssueMilestone'
        reactions:
          $ref: '#/components/schemas/IssueReactionSummary'
        comments_count:
          type: integer
        locked:
          type: boolean
        active_lock_reason:
          type: string
        synced_at:
          type: string
          format: date-time
      description: omitempty，仅 github 来源 Issue 出现
    IssueChecklistItem:
      type: object
      required: [id, title, is_completed, sort_order]
      properties:
        id:
          type: string
        title:
          type: string
        is_completed:
          type: boolean
        sort_order:
          type: integer
    IssueInternalMeta:
      type: object
      required: [workflow_status, progress_percent, checklist_total, checklist_done]
      properties:
        workflow_status:
          $ref: '#/components/schemas/IssueWorkflowStatus'
        progress_percent:
          type: integer
          nullable: true
          description: checklist 完成度 0-100；无 checklist 时为 null
        checklist_total:
          type: integer
        checklist_done:
          type: integer
        started_at:
          type: string
          format: date-time
          description: omitempty；首次进入 in_progress/done 时写入
        completed_at:
          type: string
          format: date-time
          description: omitempty；首次进入 done 时写入
        checklist_updated_at:
          type: string
          format: date-time
          description: omitempty；checklist 非空时的最近替换时间
        updated_at:
          type: string
          format: date-time
          description: omitempty
        checklist:
          type: array
          items:
            $ref: '#/components/schemas/IssueChecklistItem'
          description: omitempty；仅 Issue 详情/PUT checklist 响应携带
        labels:
          type: array
          items:
            $ref: '#/components/schemas/IssueLabel'
          description: omitempty；internal issue 的标签
      description: omitempty；无 meta 且无 checklist 时整个字段缺省
    IssueShipHookActionResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        skipped:
          type: boolean
          description: omitempty
        error:
          type: string
          description: omitempty
    IssueShipHookResults:
      type: object
      properties:
        comment:
          $ref: '#/components/schemas/IssueShipHookActionResult'
        close:
          $ref: '#/components/schemas/IssueShipHookActionResult'
        workflow_status:
          $ref: '#/components/schemas/IssueShipHookActionResult'
      description: omitempty；fired 后按启用的动作出现
    IssueShipHook:
      type: object
      required: [status, comment_enabled, close_enabled, workflow_enabled, workflow_status]
      properties:
        status:
          $ref: '#/components/schemas/IssueShipHookStatus'
        comment_enabled:
          type: boolean
        comment_body:
          type: string
          description: omitempty；fired 后为渲染后正文
        close_enabled:
          type: boolean
        workflow_enabled:
          type: boolean
        workflow_status:
          type: string
          description: 目标工作流状态；workflow_enabled=true 且为 "" 表示重置
        version_id:
          type: string
          description: omitempty；fired 时的触发版本
        version_number:
          type: string
          description: omitempty
        release_url:
          type: string
          description: omitempty
        fired_at:
          type: string
          format: date-time
          description: omitempty
        results:
          $ref: '#/components/schemas/IssueShipHookResults'
      description: omitempty；仅 Issue 详情/列表项中出现，未预约时缺省
    IssueCollabDoc:
      type: object
      required: [issue_id, body, author, created_at, updated_at]
      properties:
        issue_id:
          type: string
        body:
          type: string
        author:
          type: object
          required: [kind, login, avatar_url]
          properties:
            kind:
              $ref: '#/components/schemas/CollabAuthorKind'
            login:
              type: string
              description: agent 时为 "代理"；用户不存在时为 "未知用户"
            avatar_url:
              type: string
              description: 仅 user 作者可能有值，否则空串
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IssueCollabArea:
      type: object
      required: [consensus, summary]
      properties:
        consensus:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/IssueCollabDoc'
          description: 未产出为 null
        summary:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/IssueCollabDoc'
          description: 未产出为 null
    IssuePullRequest:
      type: object
      required: [id, issue_id, provider, repo_full_name, number, html_url, title, state, is_draft, author_login, head_ref, base_ref, merged_at, closed_at, link_origin, synced_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        issue_id:
          type: string
        provider:
          type: string
          description: 当前恒为 github；字段预留 gitlab
        repo_full_name:
          type: string
          description: owner/repo；允许与项目配置的仓库不同（跨仓库 attach）
        number:
          type: integer
        html_url:
          type: string
        title:
          type: string
        state:
          $ref: '#/components/schemas/IssuePullRequestState'
        is_draft:
          type: boolean
        author_login:
          type: string
        head_ref:
          type: string
        base_ref:
          type: string
        merged_at:
          type: string
          format: date-time
          nullable: true
          description: state=merged 时有值
        closed_at:
          type: string
          format: date-time
          nullable: true
        link_origin:
          $ref: '#/components/schemas/IssuePullRequestLinkOrigin'
        synced_at:
          type: string
          format: date-time
          description: 最近一次从 GitHub 刷新成功的时间
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IssuePullRequestSummary:
      type: object
      required: [total, open, merged]
      properties:
        total:
          type: integer
        open:
          type: integer
          description: state=open 计数
        merged:
          type: integer
          description: state=merged 计数
      description: Issue 关联 PR 的聚合计数；closed 计数 = total - open - merged
    IssuePullRequestSyncFailure:
      type: object
      required: [id, error]
      properties:
        id:
          type: string
          description: 关联行 id（issue_pull_requests.id，detach 时用此 id）
        error:
          type: string
          description: 失败原因，前缀带 repo_full_name#number 便于定位
      description: PR 关联刷新失败明细；失败行保留旧数据
    IssuePullRequestSyncResult:
      type: object
      required: [items, failures]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IssuePullRequest'
          description: 本轮刷新成功的关联行（无关联或无成功时为空数组）
        failures:
          type: array
          items:
            $ref: '#/components/schemas/IssuePullRequestSyncFailure'
          description: 逐行失败明细
      description: syncIssuePullRequests 的响应形状，与批量 internal-meta 的 {items, failures} 约定一致
    Issue:
      type: object
      required: [id, project_id, source, sequence_number, reference, state, state_reason, title, body, body_html, author, created_at, updated_at, closed_at, unread_comments_count]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
        source:
          $ref: '#/components/schemas/IssueSource'
        sequence_number:
          type: integer
          description: 项目内自增序号（reference 的 INT-n 来源）
        reference:
          type: string
          description: 短编号；github 为 GH-<number>，internal 为 INT-<sequence_number>
        state:
          $ref: '#/components/schemas/IssueState'
        state_reason:
          type: string
          description: completed / not_planned / reopened 或空串
        title:
          type: string
        body:
          type: string
        body_html:
          type: string
          description: github 来源为远端渲染 HTML（媒体链接经代理改写）；internal 为空串
        author:
          $ref: '#/components/schemas/IssueActor'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        unread_comments_count:
          type: integer
          description: 未读评论数；仅列表响应填充（internal issue 恒为 0），详情响应恒为 0
        internal_meta:
          $ref: '#/components/schemas/IssueInternalMeta'
        ship_hook:
          $ref: '#/components/schemas/IssueShipHook'
        github:
          $ref: '#/components/schemas/IssueGitHubMeta'
        collab:
          $ref: '#/components/schemas/IssueCollabArea'
          description: omitempty；仅 Issue 详情响应携带，与 GET /collab 的 data 同形；列表项不出现
        pull_requests:
          type: array
          items:
            $ref: '#/components/schemas/IssuePullRequest'
          description: omitempty；仅 Issue 详情响应携带（读取失败或无关联时缺省）；列表项不出现
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/IssueAttachment'
          description: omitempty；仅 Issue 详情响应携带（无附件时缺省）；列表项不出现
        screenshot_annotations:
          type: array
          items:
            $ref: '#/components/schemas/ScreenshotAnnotation'
          description: omitempty；仅 Issue 详情响应携带（无关联标注时缺省）；列表项不出现
        pull_request_summary:
          $ref: '#/components/schemas/IssuePullRequestSummary'
          description: omitempty；仅 Issue 列表项携带的 PR 聚合计数；详情项不出现
    IssueComment:
      type: object
      required: [id, issue_id, source, github_comment_id, github_node_id, body, body_html, html_url, author, author_association, reactions, created_at, updated_at]
      properties:
        id:
          type: string
        issue_id:
          type: string
        source:
          $ref: '#/components/schemas/IssueSource'
        github_comment_id:
          type: integer
          format: int64
          description: internal 评论为本地合成的负值序号
        github_node_id:
          type: string
        body:
          type: string
        body_html:
          type: string
        html_url:
          type: string
        author:
          $ref: '#/components/schemas/IssueActor'
        author_association:
          type: string
        reactions:
          $ref: '#/components/schemas/IssueReactionSummary'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IssueTimelineEvent:
      type: object
      required: [id, issue_id, event_key, event_type, github_event_id, actor, body, summary, payload, created_at]
      properties:
        id:
