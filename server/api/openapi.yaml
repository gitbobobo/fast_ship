        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{id}/screenshots:
    post:
      tags: [screenshots]
      operationId: uploadScreenshot
      summary: 上传界面截图（multipart/form-data，字段名 file + screen_key）
      description: |
        multipart 字段：`file`（必填；内容嗅探须为 image/png、image/jpeg、image/webp、image/gif，大小受服务端 upload.max_file_size 限制）、
        `screen_key`（必填；服务端按 ToLower+TrimSpace 规范化，规范化后须 1~100 字符，否则 40001）、
        `group`/`title`/`note`（可选）。
        同 project 下 screen_key 唯一对应一个界面：首次出现自动建界面，重复上传归并为新版本（版本全量保留，不去重、不清理）。
        表单含 `group` 字段（允许空串=未分组）即更新界面分组；`title` 非空即更新界面标题；`note` 记在该版本上。
        `uploaded_by` 由服务端按凭证自动记录（用户名，或 "API Key: <name>"）。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, screen_key]
              properties:
                file:
                  type: string
                  format: binary
                  description: 截图文件；内容须为 image/png、image/jpeg、image/webp、image/gif
                screen_key:
                  type: string
                  description: 界面标识；规范化后 1~100 字符
                group:
                  type: string
                  description: 分组名；字段出现即更新（空串置为未分组），不出现则保持原值
                title:
                  type: string
                  description: 界面标题；非空才更新
                note:
                  type: string
                  description: 本次上传版本的备注
      responses:
        '200':
          description: 上传结果（screen 为归并后的界面，version 为新建版本）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScreenshotUploadResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [screenshots]
      operationId: listScreenshotScreens
      summary: 列出项目全部界面（last_uploaded_at 倒序）
      description: 每项为界面字段 + version_count + latest_version（最新一个版本，无版本时为 null，实际不会发生）。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 界面列表（data 为 {items}，非分页信封）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ScreenshotScreenListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/screenshot-screens/{sid}:
    get:
      tags: [screenshots]
      operationId: getScreenshotScreen
      summary: 获取界面详情（含全部版本，uploaded_at 倒序）
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotScreenId'
      responses:
        '200':
          description: 界面详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScreenshotScreenDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [screenshots]
      operationId: updateScreenshotScreen
      summary: 更新界面分组/标题（仅 JWT）
      description: group 与 title 均为可选指针字段：字段出现才更新（group 允许空串置为未分组），都不传返回 40001。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotScreenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScreenshotScreenRequest'
      responses:
        '200':
          description: 更新后的界面详情（含全部版本）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScreenshotScreenDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [screenshots]
      operationId: deleteScreenshotScreen
      summary: 删除界面及其全部版本与磁盘文件（仅 JWT）
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotScreenId'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/screenshot-versions/{vid}:
    delete:
      tags: [screenshots]
      operationId: deleteScreenshotVersion
      summary: 删除单个截图版本与文件（仅 JWT）
      description: 若删除的是该界面最后一个版本，连带删除界面本身。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotVersionId'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/screenshot-versions/{vid}/content:
    get:
      tags: [screenshots]
      operationId: getScreenshotVersionContent
      summary: 获取截图版本图片内容
      description: "返回图片二进制内容（存储时嗅探的 mime type，`Content-Disposition: inline`，`Cache-Control: private, max-age=300`）。支持 Authorization 头或 `?token=` query 凭证（供 `<img>` 直链）。同一路径另注册 HEAD 变体，语义同 GET 但不返回 body。"
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotVersionId'
        - $ref: '#/components/parameters/QueryToken'
      responses:
        '200':
          description: 图片二进制内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    head:
      tags: [screenshots]
      operationId: getScreenshotVersionContentHead
      summary: 获取截图版本图片头信息（HEAD）
      description: 与 GET 语义相同但不返回 body。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotVersionId'
        - $ref: '#/components/parameters/QueryToken'
      responses:
        '200':
          description: 仅响应头
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token，由 POST /api/auth/register、login 或 refresh 签发。仅 JWT 的端点对 `fsk_` API Key 返回 403（40301）。
    apiKeyAuth:
      type: http
      scheme: bearer
      description: "API Key，以 `fsk_` 开头（Web「设置 → API Key」创建）。与 jwtAuth 共用 `Authorization: Bearer` 头，服务端按 `fsk_` 前缀区分凭证类型。"

  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 项目 ID（UUID）
    ProjectOrKeyId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: API Key ID
    IssueId:
      name: iid
      in: path
      required: true
      schema:
        type: string
      description: Issue ID（UUID，非 INT-123/GH-123 短编号）
    PullRequestLinkId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: PR 关联行 ID（UUID）
    VersionId:
      name: vid
      in: path
      required: true
      schema:
        type: string
      description: 版本 ID（UUID）
    ScreenshotScreenId:
      name: sid
      in: path
      required: true
      schema:
        type: string
      description: 截图界面 ID（UUID）
    ScreenshotVersionId:
      name: vid
      in: path
      required: true
      schema:
        type: string
      description: 截图版本 ID（UUID）
    DocId:
      name: doc_id
      in: path
      required: true
      schema:
        type: string
      description: 文档 ID（UUID）
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
      description: 日志运行 ID（客户端生成，项目内唯一）
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
      description: 页码，<1 按 1 处理
    PageSize20:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: 每页条数；越界（<1 或 >100）回落为 20
    PageSize50:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
      description: 每页条数；越界（<1 或 >100）回落为 50
    QueryToken:
      name: token
      in: query
      required: false
      schema:
        type: string
      description: 可选 query 凭证（JWT 或 `fsk_` API Key），供无法携带 Authorization 头的场景（`<img>`、浏览器直链下载）。与 Authorization 头二选一，头优先。

  responses:
    EmptySuccess:
      description: 操作成功（data 为 null）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    nullable: true
    BadRequest:
      description: 请求参数无效（40001-40099）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 未提供或提供无效凭证（40100-40199）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 已认证但无权限（40300-40399；40301=API Key 越权，40303=仅限 API Key）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在（40400-40499）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 业务冲突（40900-40999）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 服务器内部错误（50000）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RequestEntityTooLarge:
      description: 请求体超过大小限制（裸 413，无 JSON body）

  schemas:
    Envelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 业务错误码；0 表示成功
        message:
          type: string
          description: 人类可读信息；成功时为 "success"
        data:
          description: 响应负载；形状随端点而变，由 allOf 组合的兄弟 schema 收窄
      description: 统一 JSON 信封 {code, message, data}
    ErrorEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          description: 业务错误码（4xxxx 按区间映射 HTTP 状态：401xx→401，403xx→403，404xx→404，409xx→409，412xx→412，50xxx→500；502xx→502）
        message:
          type: string
        data:
          type: object
          nullable: true
          description: 恒为 null
      description: 错误响应信封
    PaginatedData:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: {}
          description: 当前页条目（元素类型由组合 schema 收窄）
        total:
          type: integer
          format: int64
          description: 符合条件的总条数
        page:
          type: integer
        page_size:
          type: integer
      description: 分页响应 data 形状；与 Envelope allOf 组合后 items 由兄弟 schema 收窄为具体类型

    # ---- 枚举（x-go-type 指回 model 包类型；oapi-codegen 生成时复用现有类型） ----
    IssueState:
      type: string
      enum: [open, closed]
      x-go-type: model.IssueState
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    IssueSource:
      type: string
      enum: [github, internal]
      x-go-type: model.IssueSource
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    IssueWorkflowStatus:
      type: string
      enum: ["", todo, in_progress, done]
      description: 空串表示未设置（重置语义）
      x-go-type: model.IssueWorkflowStatus
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    IssueSyncStatus:
      type: string
      enum: [idle, running, failed, completed]
      x-go-type: model.IssueSyncStatus
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    IssuePullRequestState:
      type: string
      enum: [open, closed, merged]
      description: merged = GitHub 上 closed 且 merged_at 非空
      x-go-type: model.IssuePullRequestState
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    IssuePullRequestLinkOrigin:
      type: string
      enum: [manual, synced]
      description: manual=用户显式 attach；synced=远端同步投影产生（清理逻辑只作用于 synced）
      x-go-type: model.IssuePullRequestLinkOrigin
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    IssueRecommendationPriority:
      type: string
      enum: [high, medium, low]
      x-go-type: model.IssueRecommendationPriority
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    CollabAuthorKind:
      type: string
      enum: [user, agent]
      x-go-type: model.CollabAuthorKind
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    LogLevel:
      type: string
      enum: [debug, info, warn, error, fatal]
      x-go-type: model.LogLevel
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    VersionStatus:
      type: string
      enum: [pending, shipped]
      x-go-type: model.VersionStatus
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    ShipStatus:
      type: string
      enum: ["", in_progress, failed, completed]
      description: 空串表示尚未发货（idle）
      x-go-type: model.ShipStatus
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    ShipStage:
      type: string
      enum: ["", precheck, create_tag, create_release, upload_assets, finalize]
      description: 空串表示未进入发货流程
      x-go-type: model.ShipStage
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model
    IssueShipHookStatus:
      type: string
      enum: [pending, running, fired]
      x-go-type: model.IssueShipHookStatus
      x-go-type-import:
        name: model
        path: github.com/godbobo/fast_ship/server/internal/model

    # ---- auth ----
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 50
          description: 用户名，2-50 字符，全局唯一
          x-oapi-codegen-extra-tags:
            binding: required,min=2,max=50
        email:
          type: string
          format: email
          description: 邮箱，全局唯一
          x-oapi-codegen-extra-tags:
            binding: required,email
        password:
          type: string
          minLength: 8
          description: 密码，≥8 字符
          x-oapi-codegen-extra-tags:
            binding: required,min=8
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: 用户名或邮箱
          x-oapi-codegen-extra-tags:
            binding: required
        password:
          type: string
          x-oapi-codegen-extra-tags:
            binding: required
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: fsr_ 开头的 refresh token
          x-oapi-codegen-extra-tags:
            binding: required
    UpdateProfileRequest:
      type: object
      # 不带 binding tag：handler 用手写 updateMeInput 绑定（字段指针化后
      # omitempty 对显式空串的跳过语义不等价），见 handler/auth.go。
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 50
          description: 新用户名；与现值相同或省略则不变
        email:
          type: string
          format: email
          description: 新邮箱
    UpdatePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          x-oapi-codegen-extra-tags:
            binding: required
        new_password:
          type: string
          minLength: 8
          x-oapi-codegen-extra-tags:
            binding: required,min=8
    AuthResponse:
      type: object
      required: [token, refresh_token, user]
      properties:
        token:
          type: string
          description: JWT access token（HS256，有效期见服务端 jwt.expire_hours，默认 24h）
        refresh_token:
          type: string
          description: fsr_ 开头，有效期默认 7 天
        user:
          $ref: '#/components/schemas/User'
    RefreshResponse:
      type: object
      required: [token, refresh_token]
      properties:
        token:
          type: string
        refresh_token:
          type: string
    User:
      type: object
      required: [id, username, email, avatar_url, created_at, updated_at]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        avatar_url:
          type: string
          description: 形如 /api/avatars/:uid/:filename，未设置为空串
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ---- ai ----
    AISettings:
      type: object
      required: [api_host, model, configured]
      properties:
        api_host:
          type: string
          description: 默认 https://api.minimaxi.com
        model:
          type: string
          description: 默认 MiniMax-M2.5
        configured:
          type: boolean
          description: 是否已配置 API Key（Key 本身永不回显）
        updated_at:
          type: string
          format: date-time
          description: omitempty，未配置时缺省
    UpdateAISettingsRequest:
      type: object
      properties:
        api_host:
          type: string
          description: 缺省回退默认 host；须为合法 URL
        api_key:
          type: string
          description: 明文 Key（加密存储，不回显）；首次配置必填，已有配置时空串保留旧值
        model:
          type: string
          description: 缺省回退默认模型
    GenerateTitleResponse:
      type: object
      required: [titles]
      properties:
        titles:
          type: array
          items:
            type: string
          description: 候选标题（通常 3 个）
    IssueChecklistSuggestions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 12
          items:
            type: object
            required: [title]
            properties:
              title:
                type: string
    IssuePromptItem:
      type: object
      required: [id, name, content]
      properties:
        id:
          type: string
          description: trim 后非空
        name:
          type: string
          description: trim 后非空
        content:
          type: string
          description: 提示词正文；trim 后非空
        supports_batch:
          type: boolean
          description: 是否支持批量场景
    IssuePrompts:
      type: object
      required: [prompts]
      properties:
        prompts:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/IssuePromptItem'
          description: 未配置时为 null，前端兜底默认提示词

    # ---- api keys ----
    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          x-oapi-codegen-extra-tags:
            binding: required,min=1,max=100
    ApiKey:
      type: object
      required: [id, user_id, name, key_prefix, key_hash, last_used_at, created_at]
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
          description: Key 原文前 8 字符（不含 fsk_ 前缀），用于列表辨识
        key_hash:
          type: string
          description: Key 的 SHA-256 哈希
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          properties:
            key:
              type: string
              description: 完整 API Key（fsk_ 前缀），仅创建响应中出现一次，服务端不存原文

    # ---- projects ----
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 项目名，当前用户下唯一
          x-oapi-codegen-extra-tags:
            binding: required,min=1,max=100
        description:
          type: string
        repository_url:
          type: string
          description: GitHub 仓库链接（owner/repo 或完整 URL）；设置时须同时提供 github_token 或 source_project_id
        github_token:
          type: string
          description: GitHub PAT（加密存储，不回显）
        source_project_id:
          type: string
          description: 复用另一项目的 GitHub Token；优先于 github_token
    UpdateProjectRequest:
      type: object
      # 不带 binding tag：handler 用手写 updateProjectInput 绑定，原因同
      # UpdateProfileRequest（见 handler/project.go）。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        repository_url:
          type: string
          description: 同创建；变更仓库且项目无 token 时须提供 token
        github_token:
          type: string
        source_project_id:
          type: string
    Project:
      type: object
      required: [id, name, description, github_owner, github_repo, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        github_owner:
          type: string
        github_repo:
          type: string
        latest_version:
          $ref: '#/components/schemas/LatestVersion'
        issue_sync:
          $ref: '#/components/schemas/IssueSyncState'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LatestVersion:
      type: object
      required: [id, version_number, status, created_at]
      properties:
        id:
          type: string
        version_number:
          type: string
        status:
          $ref: '#/components/schemas/VersionStatus'
        created_at:
          type: string
          format: date-time
      description: omitempty，仅在列表项中出现
    IssueSyncState:
      type: object
      required: [status, last_error]
      properties:
        status:
          $ref: '#/components/schemas/IssueSyncStatus'
        last_issue_updated_at:
          type: string
          format: date-time
          description: omitempty
        last_synced_at:
          type: string
          format: date-time
          description: omitempty
        last_successful_sync_at:
          type: string
          format: date-time
          description: omitempty
        last_error:
          type: string
      description: omitempty，项目 GitHub 同步状态
    Branch:
      type: object
      required: [name, sha, default]
      properties:
        name:
          type: string
        sha:
          type: string
        default:
          type: boolean

    # ---- versions & ship ----
    CreateVersionRequest:
      type: object
      required: [version_number]
      properties:
        version_number:
          type: string
          description: 版本号（同 tag 名），项目内唯一
          x-oapi-codegen-extra-tags:
            binding: required
        release_notes:
          type: string
          description: Release 说明；发货前必填
        target_commitish:
          type: string
          description: 目标分支；非空时校验为仓库已存在分支
    UpdateVersionRequest:
      type: object
      properties:
        version_number:
          type: string
          description: 仅 JWT 可改；API Key 携带返回 40301。非空且项目内唯一
        release_notes:
          type: string
        target_commitish:
          type: string
          description: 非空时校验为仓库已存在分支；空串清除
    Version:
      type: object
      required: [id, project_id, version_number, status, release_notes, target_commitish, github_release_url, error_log, ship_status, ship_stage, ship_message, ship_hooks_status, created_at, shipped_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        version_number:
          type: string
        status:
          $ref: '#/components/schemas/VersionStatus'
        release_notes:
          type: string
        target_commitish:
          type: string
        github_release_url:
          type: string
          description: 发货成功后写入
        error_log:
          type: string
        ship_status:
          $ref: '#/components/schemas/ShipStatus'
        ship_stage:
          $ref: '#/components/schemas/ShipStage'
        ship_message:
          type: string
        ship_hooks_status:
          type: string
          enum: [pending, completed, failed, incomplete]
          description: 该次发货触发的 issue 钩子执行汇总状态
        created_at:
          type: string
          format: date-time
        shipped_at:
          type: string
          format: date-time
          nullable: true
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
          description: omitempty，无安装包时缺省
    ShipCheckItem:
      type: object
      required: [key, label, ok]
      properties:
        key:
          type: string
          description: release_notes / artifacts / target_commitish / github_config
        label:
          type: string
        ok:
          type: boolean
        detail:
          type: string
          description: omitempty
    PendingIssueHook:
      type: object
      required: [issue_id, reference, title, comment, close, workflow_enabled, workflow_status]
      properties:
        issue_id:
          type: string
        reference:
          type: string
          description: INT-n 或 GH-n
        title:
          type: string
        comment:
          type: boolean
        close:
          type: boolean
        workflow_enabled:
          type: boolean
        workflow_status:
          type: string
          description: 目标工作流状态，可能为 ""（重置）
    ShipCheck:
      type: object
      required: [can_ship, items, pending_issue_hooks]
      properties:
        can_ship:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShipCheckItem'
        pending_issue_hooks:
          type: array
          items:
            $ref: '#/components/schemas/PendingIssueHook'
    ShipResult:
      type: object
      required: [hook_total, hook_failed, hook_status]
      properties:
        hook_total:
          type: integer
        hook_failed:
          type: integer
        hook_status:
          type: string
          description: completed / failed / incomplete
        hook_error:
          type: string
          description: omitempty

    # ---- artifacts ----
    Artifact:
      type: object
      required: [id, version_id, file_name, file_size, platform, uploaded_by, uploaded_at]
      properties:
        id:
          type: string
        version_id:
          type: string
        file_name:
          type: string
        file_size:
          type: integer
          format: int64
        platform:
          type: string
        uploaded_by:
          type: string
          description: '用户名或 "API Key: <name>"'
        uploaded_at:
          type: string
          format: date-time

    # ---- issues ----
    CreateIssueRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: trim 后须非空
        body:
          type: string
          description: Markdown；引用 /api/issues/assets/{aid}/content 链接会在创建时挂载草稿附件
        workflow_status:
          $ref: '#/components/schemas/IssueWorkflowStatus'
        source:
          $ref: '#/components/schemas/IssueSource'
          description: 默认 internal；github 仅 JWT 可用，API Key 传 github 返回 40301；其他值按 internal 处理
    UpdateIssueRequest:
      type: object
      description: 至少传一个字段；state_reason 必须随 state 同传
      properties:
        title:
          type: string
          description: trim 后须非空
        body:
          type: string
        state:
          $ref: '#/components/schemas/IssueState'
          description: 仅 JWT；API Key 携带返回 40301
        state_reason:
          type: string
          enum: [completed, not_planned, reopened]
          description: 仅 JWT；closed→completed|not_planned，open→reopened；置 open 且 reason 为空会清空
        labels:
          type: array
          items:
            type: string
          description: 标签名数组；internal issue 须为已存在仓库标签，GitHub issue 仅做非空/去重校验
    IssueChecklistItemInput:
      type: object
      required: [title]
      properties:
        id:
          type: string
          description: 缺省时服务端生成；传旧 id 复用条目
        title:
          type: string
          description: trim 后须非空
        is_completed:
          type: boolean
    UpsertShipHookRequest:
      type: object
      description: 三类动作至少启用一个，否则 40001
      properties:
        comment_body:
          type: string
          description: 传入即启用评论动作；trim 后 1-4000 rune；支持 {version}、{release_url} 占位符
        close:
          type: boolean
          description: true 时发货后关闭 Issue（state_reason=completed）
        workflow_status:
          $ref: '#/components/schemas/IssueWorkflowStatus'
          description: 传入即启用工作流动作（含 "" 重置）
    UpsertIssueRecommendationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: 推荐理由，trim 后 1-500 rune
        priority:
          $ref: '#/components/schemas/IssueRecommendationPriority'
        dependencies:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
          description: 前置依赖 Issue UUID 数组，整组替换，不含自身；重复自动去重（保序）
    DeferIssueRecommendationRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
          description: 延后备注，trim 后 ≤500 rune；缺省或空串表示无备注
    UpsertIssueCollabRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: Markdown；trim 后 1-8000 rune；重复 PUT 覆盖
    AttachIssuePullRequestRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: GitHub PR 链接，形如 https://github.com/<owner>/<repo>/pull/<number>（允许 http、www 前缀与尾部 /files、query、fragment 等）；其他字段由服务端从 GitHub 拉取
    IssueBatchFailure:
      type: object
      required: [id, error]
      properties:
        id:
          type: string
          description: Issue ID
        reference:
          type: string
          description: omitempty；INT-n 或 GH-n
        error:
          type: string
    IssueBatchResult:
      type: object
      required: [total, succeeded, failed, failures, elapsed_ms]
      properties:
        total:
          type: integer
          format: int64
        succeeded:
          type: integer
        failed:
          type: integer
        failures:
          type: array
          items:
            $ref: '#/components/schemas/IssueBatchFailure'
          description: 最多返回前 50 条失败明细
        elapsed_ms:
          type: integer
          format: int64
      description: 批量操作结果，与 service.BatchCloseDoneIssuesResponse 同形；batch-close 与批量 internal-meta 共用
    IssueActor:
      type: object
      required: [login, avatar_url]
      properties:
        login:
          type: string
        avatar_url:
          type: string
          description: GitHub 头像经媒体代理改写；internal 用户为空串
    IssueLabel:
      type: object
      required: [name, color, description]
      properties:
        name:
          type: string
        color:
          type: string
          description: "十六进制颜色（不带 # 前缀）"
        description:
          type: string
    IssueMilestone:
      type: object
      required: [number, title, state, description]
      properties:
        number:
          type: integer
        title:
          type: string
        state:
          type: string
        description:
          type: string
    IssueReactionSummary:
      type: object
      required: [total_count, "+1", "-1", laugh, hooray, confused, heart, rocket, eyes]
      properties:
        total_count:
          type: integer
        "+1":
          type: integer
        "-1":
          type: integer
        laugh:
          type: integer
        hooray:
          type: integer
        confused:
          type: integer
        heart:
          type: integer
        rocket:
          type: integer
        eyes:
          type: integer
    IssueGitHubMeta:
      type: object
      required: [github_issue_id, github_node_id, number, html_url, author_association, assignees, labels, reactions, comments_count, locked, active_lock_reason, synced_at]
      properties:
        github_issue_id:
          type: integer
          format: int64
        github_node_id:
          type: string
        number:
          type: integer
          description: GitHub issue 编号（reference 的 GH-n 来源）
        html_url:
          type: string
        author_association:
          type: string
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/IssueActor'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/IssueLabel'
        milestone:
          $ref: '#/components/schemas/IssueMilestone'
        reactions:
          $ref: '#/components/schemas/IssueReactionSummary'
        comments_count:
          type: integer
        locked:
          type: boolean
        active_lock_reason:
          type: string
        synced_at:
          type: string
          format: date-time
      description: omitempty，仅 github 来源 Issue 出现
    IssueChecklistItem:
      type: object
      required: [id, title, is_completed, sort_order]
      properties:
        id:
          type: string
        title:
          type: string
        is_completed:
          type: boolean
        sort_order:
          type: integer
    IssueInternalMeta:
      type: object
      required: [workflow_status, progress_percent, checklist_total, checklist_done]
      properties:
        workflow_status:
          $ref: '#/components/schemas/IssueWorkflowStatus'
        progress_percent:
          type: integer
          nullable: true
          description: checklist 完成度 0-100；无 checklist 时为 null
        checklist_total:
          type: integer
        checklist_done:
          type: integer
        started_at:
          type: string
          format: date-time
          description: omitempty；首次进入 in_progress/done 时写入
        completed_at:
          type: string
          format: date-time
          description: omitempty；首次进入 done 时写入
        checklist_updated_at:
          type: string
          format: date-time
          description: omitempty；checklist 非空时的最近替换时间
        updated_at:
          type: string
          format: date-time
          description: omitempty
        checklist:
          type: array
          items:
            $ref: '#/components/schemas/IssueChecklistItem'
          description: omitempty；仅 Issue 详情/PUT checklist 响应携带
        labels:
          type: array
          items:
            $ref: '#/components/schemas/IssueLabel'
          description: omitempty；internal issue 的标签
      description: omitempty；无 meta 且无 checklist 时整个字段缺省
    IssueShipHookActionResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        skipped:
          type: boolean
          description: omitempty
        error:
          type: string
          description: omitempty
    IssueShipHookResults:
      type: object
      properties:
        comment:
          $ref: '#/components/schemas/IssueShipHookActionResult'
        close:
          $ref: '#/components/schemas/IssueShipHookActionResult'
        workflow_status:
          $ref: '#/components/schemas/IssueShipHookActionResult'
      description: omitempty；fired 后按启用的动作出现
    IssueShipHook:
      type: object
      required: [status, comment_enabled, close_enabled, workflow_enabled, workflow_status]
      properties:
        status:
          $ref: '#/components/schemas/IssueShipHookStatus'
        comment_enabled:
          type: boolean
        comment_body:
          type: string
          description: omitempty；fired 后为渲染后正文
        close_enabled:
          type: boolean
        workflow_enabled:
          type: boolean
        workflow_status:
          type: string
          description: 目标工作流状态；workflow_enabled=true 且为 "" 表示重置
        version_id:
          type: string
          description: omitempty；fired 时的触发版本
        version_number:
          type: string
          description: omitempty
        release_url:
          type: string
          description: omitempty
        fired_at:
          type: string
          format: date-time
          description: omitempty
        results:
          $ref: '#/components/schemas/IssueShipHookResults'
      description: omitempty；仅 Issue 详情/列表项中出现，未预约时缺省
    IssueCollabDoc:
      type: object
      required: [issue_id, body, author, created_at, updated_at]
      properties:
        issue_id:
          type: string
        body:
          type: string
        author:
          type: object
          required: [kind, login, avatar_url]
          properties:
            kind:
              $ref: '#/components/schemas/CollabAuthorKind'
            login:
              type: string
              description: agent 时为 "代理"；用户不存在时为 "未知用户"
            avatar_url:
              type: string
              description: 仅 user 作者可能有值，否则空串
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IssueCollabArea:
      type: object
      required: [consensus, summary]
      properties:
        consensus:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/IssueCollabDoc'
          description: 未产出为 null
        summary:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/IssueCollabDoc'
          description: 未产出为 null
    IssuePullRequest:
      type: object
      required: [id, issue_id, provider, repo_full_name, number, html_url, title, state, is_draft, author_login, head_ref, base_ref, merged_at, closed_at, link_origin, synced_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        issue_id:
          type: string
        provider:
          type: string
          description: 当前恒为 github；字段预留 gitlab
        repo_full_name:
          type: string
          description: owner/repo；允许与项目配置的仓库不同（跨仓库 attach）
        number:
          type: integer
        html_url:
          type: string
        title:
          type: string
        state:
          $ref: '#/components/schemas/IssuePullRequestState'
        is_draft:
          type: boolean
        author_login:
          type: string
        head_ref:
          type: string
        base_ref:
          type: string
        merged_at:
          type: string
          format: date-time
          nullable: true
          description: state=merged 时有值
        closed_at:
          type: string
          format: date-time
          nullable: true
        link_origin:
          $ref: '#/components/schemas/IssuePullRequestLinkOrigin'
        synced_at:
          type: string
          format: date-time
          description: 最近一次从 GitHub 刷新成功的时间
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IssuePullRequestSummary:
      type: object
      required: [total, open, merged]
      properties:
        total:
          type: integer
        open:
          type: integer
          description: state=open 计数
        merged:
          type: integer
          description: state=merged 计数
      description: Issue 关联 PR 的聚合计数；closed 计数 = total - open - merged
    IssuePullRequestSyncFailure:
      type: object
      required: [id, error]
      properties:
        id:
          type: string
          description: 关联行 id（issue_pull_requests.id，detach 时用此 id）
        error:
          type: string
          description: 失败原因，前缀带 repo_full_name#number 便于定位
      description: PR 关联刷新失败明细；失败行保留旧数据
    IssuePullRequestSyncResult:
      type: object
      required: [items, failures]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IssuePullRequest'
          description: 本轮刷新成功的关联行（无关联或无成功时为空数组）
        failures:
          type: array
          items:
            $ref: '#/components/schemas/IssuePullRequestSyncFailure'
          description: 逐行失败明细
      description: syncIssuePullRequests 的响应形状，与批量 internal-meta 的 {items, failures} 约定一致
    Issue:
      type: object
      required: [id, project_id, source, sequence_number, reference, state, state_reason, title, body, body_html, author, created_at, updated_at, closed_at, unread_comments_count]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
        source:
          $ref: '#/components/schemas/IssueSource'
        sequence_number:
          type: integer
          description: 项目内自增序号（reference 的 INT-n 来源）
        reference:
          type: string
          description: 短编号；github 为 GH-<number>，internal 为 INT-<sequence_number>
        state:
          $ref: '#/components/schemas/IssueState'
        state_reason:
          type: string
          description: completed / not_planned / reopened 或空串
        title:
          type: string
        body:
          type: string
        body_html:
          type: string
          description: github 来源为远端渲染 HTML（媒体链接经代理改写）；internal 为空串
        author:
          $ref: '#/components/schemas/IssueActor'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        unread_comments_count:
          type: integer
          description: 未读评论数；仅列表响应填充（internal issue 恒为 0），详情响应恒为 0
        internal_meta:
          $ref: '#/components/schemas/IssueInternalMeta'
        ship_hook:
          $ref: '#/components/schemas/IssueShipHook'
        github:
          $ref: '#/components/schemas/IssueGitHubMeta'
        collab:
          $ref: '#/components/schemas/IssueCollabArea'
          description: omitempty；仅 Issue 详情响应携带，与 GET /collab 的 data 同形；列表项不出现
        pull_requests:
          type: array
          items:
            $ref: '#/components/schemas/IssuePullRequest'
          description: omitempty；仅 Issue 详情响应携带（读取失败或无关联时缺省）；列表项不出现
        pull_request_summary:
          $ref: '#/components/schemas/IssuePullRequestSummary'
          description: omitempty；仅 Issue 列表项携带的 PR 聚合计数；详情项不出现
    IssueComment:
      type: object
      required: [id, issue_id, source, github_comment_id, github_node_id, body, body_html, html_url, author, author_association, reactions, created_at, updated_at]
      properties:
        id:
          type: string
        issue_id:
          type: string
        source:
          $ref: '#/components/schemas/IssueSource'
        github_comment_id:
          type: integer
          format: int64
          description: internal 评论为本地合成的负值序号
        github_node_id:
          type: string
        body:
          type: string
        body_html:
          type: string
        html_url:
          type: string
        author:
          $ref: '#/components/schemas/IssueActor'
        author_association:
          type: string
        reactions:
          $ref: '#/components/schemas/IssueReactionSummary'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IssueTimelineEvent:
      type: object
      required: [id, issue_id, event_key, event_type, github_event_id, actor, body, summary, payload, created_at]
      properties:
        id:
          type: string
        issue_id:
          type: string
        event_key:
          type: string
        event_type:
          type: string
          description: GitHub 事件类型（labeled/assigned/closed/...）
        github_event_id:
          type: integer
          format: int64
        actor:
          $ref: '#/components/schemas/IssueActor'
        body:
          type: string
        summary:
          type: string
          description: 中文化摘要
        payload:
          type: object
          description: 原始事件 JSON
        created_at:
          type: string
          format: date-time
    IssueSyncResult:
      type: object
      required: [project_id, synced_issue_count, synced_comment_count, synced_timeline_count, started_at, completed_at]
      properties:
        project_id:
          type: string
        synced_issue_count:
          type: integer
        synced_comment_count:
          type: integer
        synced_timeline_count:
          type: integer
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        last_issue_updated_at:
          type: string
          format: date-time
          description: omitempty；本次增量水位
    IssueFilterOptions:
      type: object
      required: [labels, assignees, milestones]
      properties:
        labels:
          type: array
          items:
            type: string
        assignees:
          type: array
          items:
            type: string
        milestones:
          type: array
          items:
            type: string
    IssueAsset:
      type: object
      required: [id, issue_id, file_name, mime_type, file_size, content_url, markdown, created_at]
      properties:
        id:
          type: string
        issue_id:
          type: string
          description: 草稿附件为空串
        file_name:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
          format: int64
        content_url:
          type: string
          description: /api/issues/assets/{aid}/content
        markdown:
          type: string
          description: 可直接粘贴的 ![alt](content_url) 片段
        created_at:
          type: string
          format: date-time

    # ---- recommendations ----
    RecommendationIssueSummary:
      type: object
      required: [id, project_id, project_name, source, sequence_number, reference, title, state, workflow_status]
      properties:
        id:
          type: string
        project_id:
          type: string
        project_name:
          type: string
        source:
          $ref: '#/components/schemas/IssueSource'
        sequence_number:
          type: integer
        reference:
          type: string
        title:
          type: string
        state:
          $ref: '#/components/schemas/IssueState'
        workflow_status:
          $ref: '#/components/schemas/IssueWorkflowStatus'
    RecommendationDependency:
      type: object
      required: [issue_id, title, state, workflow_status, project_id, sequence_number, reference]
      properties:
        issue_id:
          type: string
        title:
          type: string
        state:
          $ref: '#/components/schemas/IssueState'
        workflow_status:
          $ref: '#/components/schemas/IssueWorkflowStatus'
        project_id:
          type: string
        sequence_number:
          type: integer
        reference:
          type: string
    IssueRecommendation:
      type: object
      required: [issue, reason, priority, created_by, status, deferred_at, defer_note, created_at, updated_at, dependencies]
      properties:
        issue:
          $ref: '#/components/schemas/RecommendationIssueSummary'
        reason:
          type: string
        priority:
          $ref: '#/components/schemas/IssueRecommendationPriority'
        created_by:
          type: string
          description: 提交者 API Key 名称
        status:
          type: string
          enum: [active, deferred]
          description: deferred 表示被用户延后；延后项对 Agent 不可再推荐（PUT 返回 40911）
        deferred_at:
          type: string
          format: date-time
          nullable: true
          description: 延后时间；status=active 时为 null
        defer_note:
          type: string
          nullable: true
          description: 延后备注；无备注时为 null
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationDependency'

    # ---- dashboard ----
    DashboardProjectOpenIssuePoint:
      type: object
      required: [project_id, project_name, open_issue_count]
      properties:
        project_id:
          type: string
        project_name:
          type: string
        open_issue_count:
          type: integer
    DashboardDailyResolvedProjectPoint:
      type: object
      required: [project_id, project_name, count]
      properties:
        project_id:
          type: string
        project_name:
          type: string
        count:
          type: integer
    DashboardDailyResolvedPoint:
      type: object
      required: [date, resolved_count, projects]
      properties:
        date:
          type: string
          description: YYYY-MM-DD
        resolved_count:
          type: integer
        projects:
          type: array
          items:
            $ref: '#/components/schemas/DashboardDailyResolvedProjectPoint'
          description: 当日无数据的项目不出现（可为 null/空）
    DashboardOverview:
      type: object
      required: [open_issues_by_project, daily_resolved]
      properties:
        open_issues_by_project:
          type: array
          items:
            $ref: '#/components/schemas/DashboardProjectOpenIssuePoint'
        daily_resolved:
          type: array
          items:
            $ref: '#/components/schemas/DashboardDailyResolvedPoint'
          description: 固定近 30 天（含今天），逐日排列

    # ---- logs ----
    LogEntryInput:
      type: object
      required: [timestamp, level, message]
      properties:
        timestamp:
          type: string
          format: date-time
          description: 必填，不能为零值时间
        level:
          $ref: '#/components/schemas/LogLevel'
        source:
          type: string
          maxLength: 128
          description: ≤128 字节
        message:
          type: string
          description: 1-4000 字节
        metadata:
          type: object
          description: 可选 JSON 对象，序列化后 ≤4KB
    UploadLogsRequest:
      type: object
      required: [run_id, chunk_id, entries]
      properties:
        run_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,128}$'
          description: 客户端生成的运行 ID，项目内唯一
        chunk_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,128}$'
          description: 分片 ID；同 (run_id, chunk_id) 重试幂等，不要复用 chunk_id 传不同内容
        source:
          type: string
          maxLength: 128
          description: ≤128 字节；仅首次创建运行时写入
        description:
          type: string
          maxLength: 500
          description: ≤500 字节；仅首次创建运行时写入
        entries:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/LogEntryInput'
    UploadLogsResult:
      type: object
      required: [run_id, source, description, entry_count, first_entry_at, last_entry_at, accepted_count, duplicate]
      properties:
        run_id:
          type: string
        source:
          type: string
        description:
          type: string
        entry_count:
          type: integer
          description: 该运行累计条目数
        first_entry_at:
          type: string
          format: date-time
          nullable: true
        last_entry_at:
          type: string
          format: date-time
          nullable: true
        accepted_count:
          type: integer
          description: 本次实际写入条数；重复 chunk 为 0
        duplicate:
          type: boolean
          description: (run_id, chunk_id) 重复时为 true，本次不插入
    LogEntry:
      type: object
      required: [id, run_id, timestamp, level, source, message, created_at]
      properties:
        id:
          type: string
        run_id:
          type: string
        timestamp:
          type: string
          format: date-time
        level:
          $ref: '#/components/schemas/LogLevel'
        source:
          type: string
        message:
          type: string
        metadata:
          type: string
          description: omitempty；JSON 文本（非对象）
        created_at:
          type: string
          format: date-time
    LogRun:
      type: object
      required: [project_id, run_id, source, description, entry_count, first_entry_at, last_entry_at, created_at, updated_at]
      properties:
        project_id:
          type: string
        run_id:
          type: string
        source:
          type: string
        description:
          type: string
        entry_count:
          type: integer
        first_entry_at:
          type: string
          format: date-time
          nullable: true
        last_entry_at:
          type: string
          format: date-time
          nullable: true
        uploader_api_key_id:
          type: string
          description: omitempty
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ---- documents ----
    CreateDocumentRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: trim 后 1-200 rune
        body:
          type: string
          description: ≤200000 rune
        parent_id:
          type: string
          description: 父文档 ID；须同项目，深度 ≤64
    UpdateDocumentRequest:
      type: object
      description: title/body/parent_id 至少传一个
      properties:
        title:
          type: string
          description: trim 后 1-200 rune
        body:
          type: string
          description: ≤200000 rune
        parent_id:
          type: string
          nullable: true
          description: 三态：不传=不变；null=清除父级；字符串=设为父文档（须同项目且无环）
    DocumentListItem:
      type: object
      required: [id, project_id, parent_id, title, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        parent_id:
          type: string
          nullable: true
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Document:
      allOf:
        - $ref: '#/components/schemas/DocumentListItem'
        - type: object
          required: [body]
          properties:
            body:
              type: string

    # ---- screenshots ----
    ScreenshotScreen:
      type: object
      required: [id, project_id, screen_key, title, group, version_count, last_uploaded_at, created_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        screen_key:
          type: string
          description: 服务端规范化（ToLower+TrimSpace）后的界面标识
        title:
          type: string
          description: 可为空串，客户端回退显示 screen_key
        group:
          type: string
          description: 自由文本分组；空串表示未分组
        version_count:
          type: integer
          description: 该界面累计保留的版本数
        last_uploaded_at:
          type: string
          format: date-time
          description: 最近一次上传时间，列表按它倒序
        created_at:
          type: string
          format: date-time
    ScreenshotVersion:
      type: object
      required: [id, screen_id, note, file_name, file_size, mime_type, uploaded_by, uploaded_at, content_url]
      properties:
        id:
          type: string
        screen_id:
          type: string
        note:
          type: string
        file_name:
          type: string
        file_size:
          type: integer
          format: int64
        mime_type:
          type: string
          description: 上传时内容嗅探得到的类型（image/png、image/jpeg、image/webp、image/gif 之一）
        uploaded_by:
          type: string
          description: '用户名或 "API Key: <name>"'
        uploaded_at:
          type: string
          format: date-time
        content_url:
          type: string
          description: /api/screenshot-versions/{vid}/content；前端自行追加 ?token=
    ScreenshotScreenListItem:
      allOf:
        - $ref: '#/components/schemas/ScreenshotScreen'
        - type: object
          required: [latest_version]
          properties:
            latest_version:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ScreenshotVersion'
              description: 最新一个版本；无版本时为 null
    ScreenshotScreenDetail:
      allOf:
        - $ref: '#/components/schemas/ScreenshotScreen'
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              items:
                $ref: '#/components/schemas/ScreenshotVersion'
              description: 全部历史版本，uploaded_at 倒序
    ScreenshotUploadResult:
      type: object
      required: [screen, version]
      properties:
        screen:
          $ref: '#/components/schemas/ScreenshotScreen'
        version:
          $ref: '#/components/schemas/ScreenshotVersion'
    UpdateScreenshotScreenRequest:
      type: object
      description: 两字段均可选，出现才更新；都不传返回 40001
      properties:
        group:
          type: string
          description: 分组名；允许空串置为未分组
        title:
          type: string
          description: 界面标题
