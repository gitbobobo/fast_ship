                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/BotWritePolicyRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bots/{id}/policy-rules/{ruleId}:
    put:
      tags: [bots]
      operationId: setBotWritePolicyRuleEnabled
      summary: 开关一条分级放行规则（INT-160）
      description: |
        开关 tier1 规则；行不存在则落行。手动重新启用会清空自动降级时间戳
        与误判计数（窗口重新开始）。误判自动降级（24 小时内 2 次用户反向
        操作）也会写本开关并给主线追加生命周期消息。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotWritePolicyRuleToggleRequest'
      responses:
        '200':
          description: 开关后的规则状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BotWritePolicyRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token，由 POST /api/auth/register、login 或 refresh 签发。仅 JWT 的端点对 `fsk_` API Key 返回 403（40301）。
    apiKeyAuth:
      type: http
      scheme: bearer
      description: "API Key，以 `fsk_` 开头（Web「设置 → API Key」创建）。与 jwtAuth 共用 `Authorization: Bearer` 头，服务端按 `fsk_` 前缀区分凭证类型。"
    runTokenAuth:
      type: http
      scheme: bearer
      description: |
        审查运行令牌，`fsr_` 开头，由 Fast Ship 在派发审查线程时写进提示词（INT-135）。
        仅接受 `Authorization: Bearer`（不支持 query 凭证）；一次运行一个令牌，结束回报时消费。
        令牌过期前允许重放完全相同的结论提交；读端点在令牌消费后立即拒绝（40106）。
        携带 `fsk_` API Key 或 JWT 调用返回 403（40304）。

  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 项目 ID（UUID）
    T3EnvironmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: T3 环境 ID（UUID，归属当前用户，跨用户一律 40417）
    ForgeIntegrationId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 代码仓集成 ID（内置 github-default 或 forge_integrations 行 ID）
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 通知 ID（UUID，归属当前用户，跨用户一律 404）
    T3ThreadId:
      name: threadId
      in: path
      required: true
      schema:
        type: string
      description: T3 threadId
    T3ThreadItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
      description: Fast Ship 条目 ID（sourceThreadId + "::" + T3 原始条目 id，来自线程详情的 items[].id）
    T3ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
      description: T3 projectId（来自 composer-options 的 projects[].id）
    T3RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
      description: T3 runId（排队消息行，来自线程详情 queue.items[].run_id）
    T3RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        maxLength: 256
      description: T3 运行时请求 ID（来自线程详情 items[].request_id）
    T3AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        maxLength: 256
      description: T3 附件 ID（来自附件上传响应的 id）
    ProjectOrKeyId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: API Key ID
    QuotaAccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 额度账号 ID（UUID）
    QuotaDeviceAuthorizationId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 设备授权会话 ID（POST 返回的 id）
    IssueId:
      name: iid
      in: path
      required: true
      schema:
        type: string
      description: Issue ID（UUID，非 INT-123/GH-123 短编号）
    PullRequestLinkId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: PR 关联行 ID（UUID）
    VersionId:
      name: vid
      in: path
      required: true
      schema:
        type: string
      description: 版本 ID（UUID）
    ScreenshotScreenId:
      name: sid
      in: path
      required: true
      schema:
        type: string
      description: 截图 ID（UUID）
    ScreenshotAnnotationId:
      name: aid
      in: path
      required: true
      schema:
        type: string
      description: 截图标注 ID（UUID）
    DocId:
      name: doc_id
      in: path
      required: true
      schema:
        type: string
      description: 文档 ID（UUID）
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
      description: 日志运行 ID（客户端生成，项目内唯一）
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
      description: 页码，<1 按 1 处理
    PageSize20:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: 每页条数；越界（<1 或 >100）回落为 20
    PageSize50:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
      description: 每页条数；越界（<1 或 >100）回落为 50
    QueryToken:
      name: token
      in: query
      required: false
      schema:
        type: string
      description: 可选 query 凭证（JWT 或 `fsk_` API Key），供无法携带 Authorization 头的场景（`<img>`、浏览器直链下载）。与 Authorization 头二选一，头优先。
    SelfLogStartTime:
      name: start_time
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: 起始时间（含），RFC3339
    SelfLogEndTime:
      name: end_time
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: 结束时间（含），RFC3339
    SelfLogLevel:
      name: level
      in: query
      required: false
      schema:
        type: string
        enum: [DEBUG, INFO, WARN, ERROR]
      description: 精确级别过滤
    SelfLogMinLevel:
      name: min_level
      in: query
      required: false
      schema:
        type: string
        enum: [DEBUG, INFO, WARN, ERROR]
      description: 不低于该级别的过滤（与 level 互斥，同时提供时以 level 为准）
    SelfLogModules:
      name: modules
      in: query
      required: false
      schema:
        type: string
      description: 模块过滤，逗号分隔多值（如 `http,review`）；模块取值见条目 module 字段
    SelfLogRequestID:
      name: request_id
      in: query
      required: false
      schema:
        type: string
      description: 按请求 ID 过滤（响应头 X-Request-Id 的值）
    SelfLogUserID:
      name: user_id
      in: query
      required: false
      schema:
        type: string
      description: 按归属用户过滤；仅限本人，他人 ID 只会得到空结果
    SelfLogProjectID:
      name: project_id
      in: query
      required: false
      schema:
        type: string
      description: 按关联项目 ID 过滤
    SelfLogIssueID:
      name: issue_id
      in: query
      required: false
      schema:
        type: string
      description: 按关联 Issue ID 过滤
    SelfLogRunID:
      name: run_id
      in: query
      required: false
      schema:
        type: string
      description: 按关联审查运行 ID 过滤（review_runs.id）
    SelfLogThreadID:
      name: thread_id
      in: query
      required: false
      schema:
        type: string
      description: 按关联 T3 线程 ID 过滤
    SelfLogExtraEq:
      name: extra_eq
      in: query
      required: false
      schema:
        type: string
      description: 附加字段等值过滤，可重复，格式 `key=value`（json_extract 后 CAST 为文本再比较，数字值如 status=200 也可匹配）
    SelfLogKeyword:
      name: keyword
      in: query
      required: false
      schema:
        type: string
      description: 关键词包含过滤（匹配 message 与 extra）
    SelfLogExcludeKeyword:
      name: exclude_keyword
      in: query
      required: false
      schema:
        type: string
      description: 关键词排除过滤（同 keyword 口径）
    SelfLogCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: 分页游标；取上一页响应的 next_cursor
    SelfLogLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 500
      description: 单页条数；越界（<1 或 >500）回落为 100
    SelfLogOrder:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      description: 按时间排序方向；游标内含方向，翻页时不允许改变
    SelfLogFields:
      name: fields
      in: query
      required: false
      schema:
        type: string
      description: 返回字段选择，逗号分隔（如 `module,message,extra`）；id/time/level/message 始终返回，其余未选字段在条目中省略。未知字段名返回 40001

  responses:
    EmptySuccess:
      description: 操作成功（data 为 null）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    nullable: true
    BadRequest:
      description: 请求参数无效（40001-40099）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 未提供或提供无效凭证（40100-40199）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 已认证但无权限（40300-40399；40301=API Key 越权，40303=仅限 API Key）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在（40400-40499）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 业务冲突（40900-40999）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 服务器内部错误（50000）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RequestEntityTooLarge:
      description: 请求体超过大小限制（裸 413，无 JSON body）

  schemas:
    Envelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 业务错误码；0 表示成功
        message:
          type: string
          description: 人类可读信息；成功时为 "success"
        data:
          description: 响应负载；形状随端点而变，由 allOf 组合的兄弟 schema 收窄
      description: 统一 JSON 信封 {code, message, data}
    ErrorEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          description: 业务错误码（4xxxx 按区间映射 HTTP 状态：401xx→401，403xx→403，404xx→404，409xx→409，412xx→412，50xxx→500；502xx→502）
        message:
          type: string
        data:
          type: object
          nullable: true
          description: 恒为 null
      description: 错误响应信封
    PaginatedData:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: {}
          description: 当前页条目（元素类型由组合 schema 收窄）
        total:
          type: integer
          format: int64
          description: 符合条件的总条数
        page:
          type: integer
        page_size:
          type: integer
      description: 分页响应 data 形状；与 Envelope allOf 组合后 items 由兄弟 schema 收窄为具体类型

    # ---- 枚举（x-go-type 指回 model 包类型；oapi-codegen 生成时复用现有类型） ----
