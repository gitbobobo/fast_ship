  /api/github-tokens/{id}:
    put:
      tags: [github-tokens]
      operationId: updateGithubToken
      summary: 修改标题或替换密钥
      description: |
        改标题不重新检测。替换密钥即对所有引用该 Token 的项目一起生效；
        新明文与同用户另一条记录指纹重复时返回 40914（消息指向已有记录），
        不做隐式合并。替换按加载时的指纹条件写入，并发替换返回 40915。
        替换后服务端重新检测。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGitHubTokenRequest'
      responses:
        '200':
          description: 更新后的 Token 记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GitHubToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 新明文与同用户另一条记录重复（40914）；并发替换时密钥已变（40915）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [github-tokens]
      operationId: deleteGithubToken
      summary: 删除 GitHub Token
      description: 仍被任何项目（任一用途）引用时返回 40913，需先解除或更换引用；删除项目不影响 Token 库。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Token 仍被项目引用（40913）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/github-tokens/{id}/detect:
    post:
      tags: [github-tokens]
      operationId: detectGithubToken
      summary: 手动刷新检测
      description: 对该 Token 做一次只读检测（GET https://api.github.com/user），刷新检测状态与权限摘要；不创建任何 GitHub 资源。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
      responses:
        '200':
          description: 检测完成后的 Token 记录（检测失败时 detection_status=failed，仍是 200）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GitHubToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

