    # ---- auth ----
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 50
          description: 用户名，2-50 字符，全局唯一
          x-oapi-codegen-extra-tags:
            binding: required,min=2,max=50
        email:
          type: string
          format: email
          description: 邮箱，全局唯一
          x-oapi-codegen-extra-tags:
            binding: required,email
        password:
          type: string
          minLength: 8
          description: 密码，≥8 字符
          x-oapi-codegen-extra-tags:
            binding: required,min=8
        invite_token:
          type: string
          description: 邀请明文 token（/register?invite= 携带）；部署还没有用户时被忽略（首个用户直接成为 admin），已有用户时必须有效
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: 用户名或邮箱
          x-oapi-codegen-extra-tags:
            binding: required
        password:
          type: string
          x-oapi-codegen-extra-tags:
            binding: required
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: fsr_ 开头的 refresh token
          x-oapi-codegen-extra-tags:
            binding: required
    UpdateProfileRequest:
      type: object
      # 不带 binding tag：handler 用手写 updateMeInput 绑定（字段指针化后
      # omitempty 对显式空串的跳过语义不等价），见 handler/auth.go。
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 50
          description: 新用户名；与现值相同或省略则不变
        email:
          type: string
          format: email
          description: 新邮箱
        timezone:
          type: string
          maxLength: 64
          description: 用户 IANA 时区（INT-138）；空串清空，非法名称拒绝
    UpdatePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          x-oapi-codegen-extra-tags:
            binding: required
        new_password:
          type: string
          minLength: 8
          x-oapi-codegen-extra-tags:
            binding: required,min=8
    AuthResponse:
      type: object
      required: [token, refresh_token, user]
      properties:
        token:
          type: string
          description: JWT access token（HS256，有效期见服务端 jwt.expire_hours，默认 24h）
        refresh_token:
          type: string
          description: fsr_ 开头，有效期默认 7 天
        user:
          $ref: '#/components/schemas/User'
    RefreshResponse:
      type: object
      required: [token, refresh_token]
      properties:
        token:
          type: string
        refresh_token:
          type: string
    User:
      type: object
      required: [id, username, email, avatar_url, role, timezone, created_at, updated_at]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        avatar_url:
          type: string
          description: 形如 /api/avatars/:uid/:filename，未设置为空串
        role:
          $ref: '#/components/schemas/UserRole'
        timezone:
          type: string
          description: 用户 IANA 时区（INT-138）；空串表示未声明，机器人按部署配置回退
        effective_timezone:
          type: string
          description: 生效时区（INT-138）：timezone 非空时为它，否则为部署配置 bots.memory.timezone，再否则 UTC。/auth/me 会返回；成员列表不返回（省略）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserRole:
      type: string
      enum: [admin, member]
      description: 用户角色（INT-129）：admin 可管理成员、邀请与部署设置；member 只能使用自己的资源。角色只存库，服务端每请求查库判定，不写进 JWT
    # ---- members & invites（INT-129）----
    Member:
      type: object
      description: 成员（/api/members 的元素），形状与 User 完全一致
      allOf:
        - $ref: '#/components/schemas/User'
    Invite:
      type: object
      required: [id, created_by, expires_at, revoked_at, used_at, used_by, created_at]
      properties:
        id:
          type: string
        created_by:
          type: string
          description: 签发邀请的管理员用户 ID
        expires_at:
          type: string
          format: date-time
          description: 过期时间
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: 撤销时间；未撤销为 null
        used_at:
          type: string
          format: date-time
          nullable: true
          description: 被使用（注册消费）时间；未使用为 null
        used_by:
          type: string
          nullable: true
          description: 使用该邀请注册的用户 ID；未使用为 null
        created_at:
          type: string
          format: date-time
      description: 邀请投影，不含 token 明文（明文只在创建响应里出现一次）
    CreatedInvite:
      type: object
      description: 新建邀请（Invite 全部字段 + 一次性 token 明文）
      allOf:
        - $ref: '#/components/schemas/Invite'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: 邀请明文 token，只在本次响应出现一次；前端拼 /register?invite=<token>
    CreateInviteRequest:
      type: object
      properties:
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 720
          description: 有效期（小时），省略默认 72；越界 40001
    ValidateInviteRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: 邀请链接中的明文 token；走请求体，不进 URL 路径
    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
    # ---- deployment（INT-129）----
    DeploymentSettings:
      type: object
      required: [public_url, public_url_source, updated_at]
      properties:
        public_url:
          type: string
          description: 当前生效的对外访问基址（trim 且去尾部 /）；两处都没有时为空串
        public_url_source:
          type: string
          enum: [database, config, none]
          description: public_url 来源：database=部署设置保存的值（优先）；config=config.yaml 的 server.public_url 兜底；none=未配置
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: 部署设置最近保存时间；数据库从未保存过该行为 null
    UpdateDeploymentSettingsRequest:
      type: object
      required: [public_url]
      properties:
        public_url:
          type: string
          description: 对外访问基址；空串=清空数据库值回落 config；其余必须是 http(s) 绝对 URL、host 非空、不带 query/fragment，末尾 / 自动去掉
    GitHubAppDeployment:
      type: object
      required: [configured, source, app_id, app_slug, private_key_set, webhook_secret_set, webhook_url, install_url, detection_status, detection_detail, detected_at, updated_at]
      properties:
        configured:
          type: boolean
          description: 本部署是否有 App 身份配置来源（部署设置行或 config 兜底）；私钥是否真的可读看 private_key_set
        source:
          type: string
          enum: [database, config, none]
          description: 当前生效来源；database 优先，config 是 config.yaml 兜底，none 为未配置
        app_id:
          type: string
          description: GitHub App ID（未配置时为空串）
        app_slug:
          type: string
          description: GitHub App slug（拼 install_url 用；未配置时为空串）
        private_key_set:
          type: boolean
          description: 私钥是否已配置（本体永不回显）
        webhook_secret_set:
          type: boolean
          description: webhook 验签密钥是否已配置（本体永不回显）
        webhook_url:
          type: string
          description: 填进 GitHub App 的 Webhook URL（{public_url}/api/github/webhooks）；public_url 未配置时为空串
        install_url:
          type: string
          description: 安装到仓库入口（https://github.com/apps/{slug}/installations/new）；slug 为空时为空串
        detection_status:
          type: string
          enum: [unchecked, ok, invalid, failed]
          description: unchecked=未检测；ok=App 身份认证成功；invalid=GitHub 拒绝凭证（401）；failed=检测失败（网络/限流/5xx，不是凭证无效）
        detection_detail:
          type: string
          description: 给人看的补充说明（App 名称、失败原因等），不含任何密钥
        detected_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次检测完成时间；未检测为 null
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: 数据库配置最近保存时间；source 为 config/none 时为 null
    UpdateGitHubAppDeploymentRequest:
      type: object
      required: [app_id]
      properties:
        app_id:
          type: string
          description: GitHub App ID（纯数字）
        private_key_pem:
          type: string
          nullable: true
          description: App 私钥 PEM（RSA）；省略或 null 表示保留已有私钥，首次配置必填
        webhook_secret:
          type: string
          nullable: true
          description: webhook 验签密钥；省略或 null 表示保留已有值，空串表示清空
    ForgeIntegration:
      type: object
      description: 部署级代码仓集成投影（INT-166）；内置 github-default 与 forgejo 行同形
      required: [id, kind, name, base_url, api_base_url, api_base_url_derived, token_set, webhook_secret_set, has_ca_cert, allow_private_network, builtin, created_at, updated_at]
      properties:
        id:
          type: string
          description: 内置集成固定为 github-default；forgejo 行为 forge_integrations 行 ID
        kind:
          type: string
          enum: [github, forgejo]
          description: github=内置 GitHub App（只读映射）；forgejo=机器人账号 + 仓库范围 PAT
        name:
          type: string
          description: 显示名
        base_url:
          type: string
          description: Forgejo 实例基址（内置集成为 https://github.com）
        api_base_url:
          type: string
          description: API 基址（forgejo 保存时已推导展开；内置集成为部署 GitHub App 的 api_base_url）
        api_base_url_derived:
          type: boolean
          description: >-
            true=api_base_url 是按 {base_url}/api/v1 推导的展开值（改 base_url 时跟随
            重新推导）；false=管理员显式钉死的端点（不随 base_url 变化）。内置集成恒 false。
        token_set:
          type: boolean
          description: 凭证是否已配置（内置=GitHub App 身份可用；本体永不回显）
        webhook_secret_set:
          type: boolean
          description: webhook 验签密钥是否已配置（本体永不回显）
        has_ca_cert:
          type: boolean
          description: 是否配置了自定义 CA（本体永不回显）
        allow_private_network:
          type: boolean
          description: 是否放行本集成配置主机解析到私网地址（http 同样仅在开启时可用）
        builtin:
          type: boolean
          description: 内置集成恒为 true，不可修改、不可删除、不可走 test 端点
        unavailable:
          type: boolean
          description: >-
            omitempty；仅内置 github-default 可能出现：true 表示内置投影读取
            失败（如 App 密文解不开），该条目仅作占位展示、凭证状态不可信，
            请检查部署级 GitHub App 配置。forgejo 行恒无此字段。
        created_at:
          type: string
          format: date-time
          nullable: true
          description: 创建时间；内置集成无落库行，为 null
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: 最近保存时间；内置集成为 null
    IntegrationOption:
      type: object
      description: 项目表单用的代码仓集成精简投影（INT-167）；无凭证标记等管理字段
      required: [id, kind, name, base_url, builtin]
      properties:
        id:
          type: string
          description: 内置集成固定为 github-default；forgejo 行为 forge_integrations 行 ID
        kind:
          type: string
          enum: [github, forgejo]
          description: github=内置 GitHub App；forgejo=机器人账号 + 仓库范围 PAT
        name:
          type: string
          description: 显示名
        base_url:
          type: string
          description: 实例基址（仓库 URL 按 {base_url}/{owner}/{repo} 解析到本集成）
        builtin:
          type: boolean
          description: 内置集成恒为 true
    ForgeIntegrationTest:
      type: object
      description: Forgejo 连接检测结论；不落库，只随本次响应返回
      required: [status, version, username, detail]
      properties:
        status:
          type: string
          enum: [unchecked, ok, invalid, failed]
          description: ok=version+user 均成功；invalid=凭证被拒（401/403）；failed=网络/5xx 等检测失败。unchecked 仅为口径对齐，本端点不会返回
        version:
          type: string
          description: Forgejo 实例版本（检测成功时非空）
        username:
          type: string
          description: 机器人账号名（检测成功时非空）
        detail:
          type: string
          description: 给人看的补充说明（失败原因等），不含任何密钥
    CreateForgeIntegrationRequest:
      type: object
      description: 新建 forgejo 集成请求；本期不接受 github 种类（内置 App 走 deployment/github-app）
      required: [name, base_url, token]
      properties:
        name:
          type: string
          description: 显示名（必填）
        base_url:
          type: string
          description: Forgejo 实例基址；必须 https（开启 allow_private_network 后可用 http）且解析不到内网地址
        api_base_url:
          type: string
          nullable: true
          description: API 基址；省略或 null 按 {base_url}/api/v1 推导
        token:
          type: string
          description: 仓库范围 PAT（必填）；加密落库、只写不回显
        webhook_secret:
          type: string
          nullable: true
          description: webhook 验签密钥（可选）；加密落库、只写不回显
        ca_cert_pem:
          type: string
          nullable: true
          description: 自定义 CA（PEM，可选）；追加系统根证书池
        allow_private_network:
          type: boolean
          description: 放行该集成配置主机解析到私网地址；缺省 false
    UpdateForgeIntegrationRequest:
      type: object
      description: 部分更新请求；省略的字段保持不变
      properties:
        name:
          type: string
          nullable: true
          description: 显示名；null 或空串拒绝（name 不允许为空）
        base_url:
          type: string
          nullable: true
          description: 基址变更时重新校验（含 DNS）；null 保留
        api_base_url:
          type: string
          nullable: true
          description: null 保留（存量恰为旧 base_url 推导值时随新 base_url 重新推导）；空串重置为 {base_url}/api/v1；其余重新校验
        token:
          type: string
          nullable: true
          description: 新 PAT；省略或 null = 保留现值；空串 = 40001（必需凭证不可清空，需删除集成重建）；其余替换并加密落库
        webhook_secret:
          type: string
          nullable: true
          description: 新验签密钥；省略或 null = 保留现值；空串 = 清空已存密钥；其余替换并加密落库
        ca_cert_pem:
          type: string
          nullable: true
          description: null = 保留；空串 = 清空；其余替换并校验 PEM
        allow_private_network:
          type: boolean
          nullable: true
          description: null = 保留；变更后按新开关复核现有基址
    GitHubAppManifest:
      type: object
      description: 原样 POST 给 GitHub 的 App Manifest（形状由 GitHub Manifest 流程约定）
      required: [name, url, hook_attributes, redirect_url, setup_url, public, default_events, default_permissions]
      properties:
        name:
          type: string
          description: App 名称（取自部署，如 Fast Ship）
        url:
          type: string
          description: 主页地址 = public_url
        hook_attributes:
          type: object
          required: [url, active]
          properties:
            url:
              type: string
              description: Webhook URL = {public_url}/api/github/webhooks
            active:
              type: boolean
              description: 恒为 true（不用 enum[true]：oapi-codegen 会生成与 api.True 撞名的常量）
        redirect_url:
          type: string
          description: 创建完成回跳地址 = {public_url}/settings/integrations/github/callback
        setup_url:
          type: string
          description: 安装后跳转地址 = {public_url}/settings/integrations
        public:
          type: boolean
          description: 恒为 false（非公开 App；同上不用 enum[false] 避免生成撞名常量）
        default_events:
          type: array
          items:
            type: string
            enum: [pull_request]
        default_permissions:
          type: object
          description: PR 审查所需的最小权限集（结论用 commit status，不用 Checks API）
          required: [pull_requests, issues, statuses, contents, metadata]
          properties:
            pull_requests:
              type: string
              enum: [write]
            issues:
              type: string
              enum: [write]
            statuses:
              type: string
              enum: [write]
            contents:
              type: string
              enum: [read]
            metadata:
              type: string
              enum: [read]
    GitHubAppManifestRequest:
      type: object
      properties:
        org:
          type: string
          description: 目标组织；填了则创建页指向该组织的 Apps 设置，省略为个人 App
    GitHubAppManifestResponse:
      type: object
      required: [action_url, state, manifest]
      properties:
        action_url:
          type: string
          description: GitHub 创建页；默认 https://github.com/settings/apps/new，填了 org 时 https://github.com/organizations/{org}/settings/apps/new
        state:
          type: string
          description: 防 CSRF 的一次性 state，GitHub 回跳时原样带回
        manifest:
          $ref: '#/components/schemas/GitHubAppManifest'
    CompleteGitHubAppManifestRequest:
      type: object
      required: [code, state]
      properties:
        code:
          type: string
          description: GitHub 回跳携带的一次性 code，用于换取 App 凭证
        state:
          type: string
          description: 发起创建时签发的 state，服务端核对一致才继续


    AISettings:
      type: object
      required: [api_host, model, configured]
      properties:
        api_host:
          type: string
          description: 默认 https://api.minimaxi.com
        model:
          type: string
          description: 默认 MiniMax-M2.5
        configured:
          type: boolean
          description: 是否已配置 API Key（Key 本身永不回显）
        updated_at:
          type: string
          format: date-time
          description: omitempty，未配置时缺省
    UpdateAISettingsRequest:
      type: object
      properties:
        api_host:
          type: string
          description: 缺省回退默认 host；须为合法 URL
        api_key:
          type: string
          description: 明文 Key（加密存储，不回显）；首次配置必填，已有配置时空串保留旧值
        model:
          type: string
          description: 缺省回退默认模型
    GenerateTitleResponse:
      type: object
      required: [titles]
      properties:
        titles:
          type: array
          items:
            type: string
          description: 候选标题（通常 3 个）
    IssueChecklistSuggestions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 12
          items:
            type: object
            required: [title]
            properties:
              title:
                type: string
    IssuePromptItem:
      type: object
      required: [id, name, content]
      properties:
        id:
          type: string
          description: trim 后非空
        name:
          type: string
          description: trim 后非空
        content:
          type: string
          description: 提示词正文；trim 后非空
        preferences:
          $ref: '#/components/schemas/IssuePromptPreferences'
    IssuePromptPreferences:
      type: object
      description: |
        T3 启动偏好（绑定在提示词条目上的默认值；对象缺省即各字段取默认）。
        写入时校验：environment 只能是 "auto" 或已存在的 T3 环境 ID，
        workspace 只能是 "worktree"|"root"，model_selection 的字段类型；
        非法值返回 40001
      properties:
        environment:
          type: string
          description: '"auto" 或已存在的 T3 环境 ID；缺省 auto'
        workspace:
          type: string
          description: '"worktree" 或 "root"；缺省 worktree'
        model_selection:
          $ref: '#/components/schemas/T3ModelSelection'
    IssuePrompts:
      type: object
      required: [prompts]
      properties:
        prompts:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/IssuePromptItem'
          description: 未配置时为 null，前端兜底默认提示词

    # ---- api keys ----
    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          x-oapi-codegen-extra-tags:
            binding: required,min=1,max=100
    ApiKey:
      type: object
      required: [id, user_id, name, key_prefix, key_hash, last_used_at, created_at]
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
          description: Key 原文前 8 字符（不含 fsk_ 前缀），用于列表辨识
        key_hash:
          type: string
          description: Key 的 SHA-256 哈希
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: 完整 API Key（fsk_ 前缀），仅创建响应中出现一次，服务端不存原文

    # ---- github tokens ----
    CreateGitHubTokenRequest:
      type: object
      required: [title, token]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Token 标题（如「主仓库发布 Token」）
          x-oapi-codegen-extra-tags:
            binding: required,min=1,max=100
        token:
          type: string
          minLength: 1
          description: GitHub PAT 明文（加密存储，任何响应都不回显）
          x-oapi-codegen-extra-tags:
            binding: required,min=1
    UpdateGitHubTokenRequest:
      type: object
      # 不带 binding tag：handler 允许只传 title 或只传 token，两个都可缺省。
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: 非空时替换标题；改标题不重新检测
        token:
          type: string
          minLength: 1
          description: 非空时替换密钥，对所有引用项目立即生效并重新检测；与同用户另一条记录明文重复时返回 40914；并发替换时密钥已变返回 40915
    GitHubToken:
      type: object
      required: [id, title, token_prefix, detection_status, detection_token_type, detection_scopes, detection_login, detection_detail, referenced_projects, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        token_prefix:
          type: string
          description: Token 明文前 8 个字符（如 ghp_Ab12），用于列表辨识；其余不存
        detection_status:
          type: string
          enum: [unchecked, ok, invalid, failed]
          description: unchecked=未检测；ok=认证成功；invalid=GitHub 拒绝凭证（401）；failed=检测失败（网络/GitHub 5xx，不是凭证无效）
        detection_token_type:
          type: string
          enum: [classic, fine_grained, unknown]
          description: classic=有 OAuth scopes 的 Classic PAT；fine_grained=github_pat_ 前缀；unknown=无法判断（未检测时恒为 unknown）
        detection_scopes:
          type: array
          items:
            type: string
          description: Classic PAT 的 OAuth scopes；fine-grained 恒为空数组
        detection_login:
          type: string
          description: 认证成功时的 GitHub login，否则为空串
        detection_detail:
          type: string
          description: 给人看的补充说明（fine-grained 的「无法自动获取完整授权」、失败原因等），不含 token
        detected_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次检测完成时间；未检测为 null
        referenced_projects:
          type: array
          items:
            $ref: '#/components/schemas/GitHubTokenProjectRef'
          description: 两个用途中任一引用了该 Token 的项目
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GitHubTokenProjectRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    # ---- quota（INT-109）----
    QuotaCredentials:
      type: object
      additionalProperties:
        type: string
      description: 按供应商 credential_fields 的 key 组织的明文凭据（加密落库，任何响应不回显）；整组替换语义
    QuotaCredentialField:
      type: object
      required: [key, label, secret, required, placeholder, help]
      properties:
        key:
          type: string
          description: 凭据字段标识（api_key / token / access_token / org_id / account_id），提交时以它为 credentials 的 map key
        label:
          type: string
        secret:
          type: boolean
          description: 密文字段前端用密码框展示；任何响应不回显
        required:
          type: boolean
        placeholder:
          type: string
        help:
          type: string
    QuotaProvider:
      type: object
      required: [id, name, plan_hint, credential_fields, instructions, warning, device_authorization]
      properties:
        id:
          type: string
          description: 供应商标识（commandcode / opencodego / zai / grok / codex / devin / factory / opendesign）
        name:
          type: string
        plan_hint:
          type: string
          description: 可选，仅供空态提示
        credential_fields:
          type: array
          items:
            $ref: '#/components/schemas/QuotaCredentialField'
        instructions:
          type: array
          items:
            type: string
          description: 「凭据从哪里获取」分步说明，逐条一句话
        warning:
          type: string
          description: 会话令牌类供应商必填的过期提示；其余为空串
        device_authorization:
          type: boolean
          description: 该供应商是否支持浏览器设备授权获取凭据；true 时前端显示「使用浏览器授权」
    QuotaWindow:
      type: object
      required: [kind, label, used_percent, unit]
      properties:
        kind:
          type: string
          enum: [five_hour, daily, weekly, monthly, other]
        label:
          type: string
          description: 面向用户的窗口名；other 类给准确名字（如 MCP 次数）
        used_percent:
          type: number
          format: double
          nullable: true
          description: 0..100，四舍五入到 1 位小数；算不出为 null
        used:
          type: number
          format: double
          nullable: true
          description: 单位由 unit 决定
        limit:
          type: number
          format: double
          nullable: true
        unit:
          type: string
          enum: [percent, usd, count]
        reset_at:
          type: string
          format: date-time
          nullable: true
          description: UTC；窗口重置时间
        pool:
          type: string
          description: 窗口所属额度池的展示名；只有同账号存在多个并行额度池时才出现，如 Factory Droid 的「标准」/「Core」
    QuotaBalance:
      type: object
      required: [label, amount, currency]
      properties:
        label:
          type: string
        amount:
          type: number
          format: double
          description: 金额；显式 double，不降 float32
        currency:
          type: string
    QuotaAccount:
      type: object
      required: [id, provider, provider_name, label, credential_hint, plan_name, note, status, last_error, fetched_at, last_success_at, windows, balance, created_at, updated_at]
      properties:
        id:
          type: string
        provider:
          type: string
        provider_name:
          type: string
          description: 供应商显示名（随供应商元数据，非用户可改）
        label:
          type: string
        credential_hint:
          type: string
          description: 凭据尾号（形如 …ab12）；绝不回显明文
        plan_name:
          type: string
          description: 最近一次成功快照的套餐名；未抓取过为空串
        note:
          type: string
          description: 供应商特有的补充说明（如「无 Design Plan 额度，按钱包计费」）；为空串表示无
        status:
          type: string
          enum: [ok, credential_invalid, provider_error, pending]
          description: ok=正常；credential_invalid=凭据失效（401/403）；provider_error=接口异常；pending=暂未抓取
        last_error:
          type: string
          description: 最近一次失败原因（脱敏后的用户可读文本）
        fetched_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次成功抓取时间（= 快照数据时间）；未成功过为 null
        last_success_at:
          type: string
          format: date-time
          nullable: true
          description: 同 fetched_at（保留字段名便于前端区分）
        windows:
          type: array
          items:
            $ref: '#/components/schemas/QuotaWindow'
          description: 最近一次成功快照的窗口；失败时保留旧数据
        balance:
          allOf:
            - $ref: '#/components/schemas/QuotaBalance'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateQuotaAccountRequest:
      type: object
      required: [provider, label, credentials]
      properties:
        provider:
          type: string
          minLength: 1
          description: 供应商 id（GET /api/quota/providers 返回的 id）；未知返回 40030
          x-oapi-codegen-extra-tags:
            binding: required
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: 用户给账号起的名字（如「我的 Pro」）
          x-oapi-codegen-extra-tags:
            binding: required,min=1,max=100
        credentials:
          $ref: '#/components/schemas/QuotaCredentials'
    UpdateQuotaAccountRequest:
      type: object
      # 省略 credentials 表示只改标签；给了就是整组替换。
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: 非空时替换标签；改标签不触发抓取
          x-oapi-codegen-extra-tags:
            binding: omitempty,max=100
        credentials:
          $ref: '#/components/schemas/QuotaCredentials'
    TestQuotaCredentialsRequest:
      type: object
      required: [provider, credentials]
      properties:
        provider:
          type: string
          minLength: 1
          description: 供应商 id；未知返回 40030
          x-oapi-codegen-extra-tags:
            binding: required
        credentials:
          $ref: '#/components/schemas/QuotaCredentials'
    QuotaProbe:
      type: object
      required: [status, plan_name, note, windows, balance, error, detail]
      properties:
        status:
          type: string
          enum: [ok, credential_invalid, provider_error]
        plan_name:
          type: string
        note:
          type: string
          description: 供应商特有的补充说明（如「无 Design Plan 额度，按钱包计费」）；为空串表示无
        windows:
          type: array
          items:
            $ref: '#/components/schemas/QuotaWindow'
        balance:
          allOf:
            - $ref: '#/components/schemas/QuotaBalance'
          nullable: true
        error:
          type: string
          description: status != ok 时给用户可读原因（已脱敏）
        detail:
          type: string
          description: 可选；更细的诊断（HTTP 状态码等），可为空串

    StartQuotaDeviceAuthorizationRequest:
      type: object
      required: [provider, label]
      properties:
        provider:
          type: string
          minLength: 1
          description: 供应商 id（GET /api/quota/providers 返回的 id）；未知返回 40030，不支持设备授权返回 40032
          x-oapi-codegen-extra-tags:
            binding: required
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: 批准后新建额度账号的名字
          x-oapi-codegen-extra-tags:
            binding: required,min=1,max=100
        account_id:
          type: string
          description: |
            可选；带上时批准后不再新建账号，而是整组替换该已有账号的凭据（为已有账号
            换凭据，编辑场景使用）。账号不存在或属于他人返回 40430；目标账号必须与
            provider 是同一供应商，否则返回 40001（校验在建会话之前，不触上游）。
          x-oapi-codegen-extra-tags:
            binding: omitempty

    QuotaDeviceAuthorization:
      type: object
      required: [id, provider, status, user_code, activation_url, expires_at, poll_interval_seconds, account_id, error]
      properties:
        id:
          type: string
          description: 会话 ID，用于后续 GET 轮询与 DELETE 取消
        provider:
          type: string
        status:
          type: string
          enum: [pending, approved, expired, denied, invalid]
          description: |
            pending 等待用户批准；approved 已拿到控制面密钥并创建账号；
            expired 验证码过期或本地超时；denied 用户拒绝/取消；
            invalid 设备密钥失效（上游 401/404）
        user_code:
          type: string
          description: 用户在批准页面输入的验证码
        activation_url:
          type: string
          description: 浏览器批准页面地址（前端 target=_blank 打开，不在服务端跳转）
        expires_at:
          type: string
          format: date-time
          description: UTC；超过后前端可直接提示过期（服务端 GET 也会判本地超时）
        poll_interval_seconds:
          type: integer
          description: 前端轮询节奏（上游给的值，缺省 2）
        account_id:
          type: string
          description: approved 时新建账号的 id；其余空串
        error:
          type: string
          description: status 为 expired/denied/invalid 时的用户可读原因；其余空串

    # ---- projects ----
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 项目名，当前用户下唯一
          x-oapi-codegen-extra-tags:
            binding: required,min=1,max=100
        description:
          type: string
        repository_url:
          type: string
          description: GitHub 仓库链接（owner/repo 或完整 URL）；不再要求同时提供 Token
        code_repository_url:
          type: string
          description: 代码仓库链接（owner/repo 或完整 URL），供 PR 审查使用；空 = 与公开仓库相同
        public_github_token_id:
          type: string
          description: 公开仓库 Token（Token 库记录 id）引用；用于 Issue 同步与 GitHub 写、分支查询、发货。可空；必须属于当前用户，否则 40420
        code_github_token_id:
          type: string
          description: 代码仓库 Token（Token 库记录 id）引用；仅用于读取关联 PR（含其他仓库）。可空；必须属于当前用户，否则 40420
    UpdateProjectRequest:
      type: object
      # 不带 binding tag：handler 用手写 updateProjectInput 绑定，原因同
      # UpdateProfileRequest（见 handler/project.go）。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          description: 缺省或 null 保留现值；显式空串清空；非空替换
        repository_url:
          type: string
          description: 同创建；不再要求项目已配 Token
        code_repository_url:
          type: string
          nullable: true
          description: 三态——key 缺省保留现值；显式 null 或空串清空（回落公开仓库）；非空替换（owner/repo 或完整 URL；与公开仓库相同则归一为空）
        public_github_token_id:
          type: string
          nullable: true
          description: 三态——key 缺省保留现值；显式 null 或空串清空该用途引用；非空替换（须属于当前用户，否则 40420）
        code_github_token_id:
          type: string
          nullable: true
          description: 三态——key 缺省保留现值；显式 null 或空串清空该用途引用；非空替换（须属于当前用户，否则 40420）
    Project:
      type: object
      required: [id, name, description, github_owner, github_repo, repository_url, code_github_owner, code_github_repo, public_github_token_id, code_github_token_id, code_integration_id, public_integration_id, code_repo_url, shelved_at, shelved_until, is_shelved, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        github_owner:
          type: string
        github_repo:
          type: string
        repository_url:
          type: string
          nullable: true
          description: 公开仓页面地址（INT-166）。无公开仓（owner/repo 缺一）为 null；github_host='github.com' 为 https://github.com/{owner}/{repo}，空串（本部署 GitHub/GHE）按部署 GitHub Web 基址拼。编辑表单据此回填，不自行拼主机
        code_github_owner:
          type: string
          description: 代码仓库（PR 审查用）owner；未单独配置为空串，表示与公开仓库相同
        code_github_repo:
          type: string
          description: 代码仓库（PR 审查用）repo 名；未单独配置为空串，表示与公开仓库相同
        public_github_token_id:
          type: string
          description: 公开仓库 Token 引用；未配置为空串
        code_github_token_id:
          type: string
          description: 代码仓库 Token 引用；未配置为空串
        code_integration_id:
          type: string
          nullable: true
          description: 代码仓集成引用（INT-166）；null 或空串 = 内置 github-default。写入接线由后续任务完成，本期只随响应带出
        public_integration_id:
          type: string
          nullable: true
          description: 公开仓库集成引用（INT-166）；null 或空串 = 内置 github-default。写入接线由后续任务完成，本期只随响应带出
        code_repo_url:
          type: string
          nullable: true
          description: 代码仓页面地址（INT-166）。无代码仓（owner/repo 缺一）为 null；内置 github 集成为 https://github.com/{owner}/{repo}；forgejo 集成为 {base_url}/{owner}/{repo}；绑定的集成行已删除时为 null（不回落 github.com，避免私有仓库地址外发）
        latest_version:
          $ref: '#/components/schemas/LatestVersion'
        issue_count:
          type: integer
          description: omitempty，仅在列表项中出现；项目 Issue 总数（不区分状态）
        issue_workflow_counts:
          $ref: '#/components/schemas/IssueWorkflowCounts'
        issue_sync:
          $ref: '#/components/schemas/IssueSyncState'
        shelved_at:
          type: string
          format: date-time
          nullable: true
          description: 搁置开始时间；null 表示未搁置（INT-165）
        shelved_until:
          type: string
          format: date-time
          nullable: true
          description: 搁置截止时间；null 表示无限期或未搁置（INT-165）
        is_shelved:
          type: boolean
          description: 响应生成时刻是否处于搁置中；到期自动恢复，无后台任务（INT-165）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ShelveProjectRequest:
      type: object
      description: 搁置项目请求体；整包可省略或为空对象，表示无限期搁置（INT-165）
      properties:
        until:
          type: string
          format: date-time
          description: 搁置截止时间（RFC3339）；提供时必须晚于当前时间，缺省表示无限期
    IssueWorkflowCounts:
      type: object
      description: omitempty，仅在列表项中出现；仅统计 state=open 的 Issue，按内部状态分组
      required: [unset, todo, in_progress, done]
      properties:
        unset:
          type: integer
          description: 未设置内部状态的 Issue 数（含无 internal meta 行的 Issue）
        todo:
          type: integer
        in_progress:
          type: integer
        done:
          type: integer
    LatestVersion:
      type: object
      required: [id, version_number, status, created_at]
      properties:
        id:
          type: string
        version_number:
          type: string
        status:
          $ref: '#/components/schemas/VersionStatus'
        created_at:
          type: string
          format: date-time
      description: omitempty，仅在列表项中出现
    IssueSyncState:
      type: object
      required: [status, last_error]
      properties:
        status:
          $ref: '#/components/schemas/IssueSyncStatus'
        last_issue_updated_at:
          type: string
          format: date-time
          description: omitempty
        last_synced_at:
          type: string
          format: date-time
          description: omitempty
        last_successful_sync_at:
          type: string
          format: date-time
          description: omitempty
        last_error:
          type: string
      description: omitempty，项目 GitHub 同步状态
    Branch:
      type: object
      required: [name, sha, default]
      properties:
        name:
          type: string
        sha:
          type: string
        default:
          type: boolean

    # ---- versions & ship ----
    CreateVersionRequest:
      type: object
      required: [version_number]
      properties:
        version_number:
          type: string
          description: 版本号（同 tag 名），项目内唯一
          x-oapi-codegen-extra-tags:
            binding: required
        release_notes:
          type: string
          description: Release 说明；发货前必填
        target_commitish:
          type: string
          description: 目标分支；非空时校验为仓库已存在分支
    UpdateVersionRequest:
      type: object
      properties:
        version_number:
          type: string
          description: 仅 JWT 可改；API Key 携带返回 40301。非空且项目内唯一
        release_notes:
          type: string
        target_commitish:
          type: string
          description: 非空时校验为仓库已存在分支；空串清除
    Version:
      type: object
      required: [id, project_id, version_number, status, release_notes, target_commitish, github_release_url, error_log, ship_status, ship_stage, ship_message, ship_hooks_status, created_at, shipped_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        version_number:
          type: string
        status:
          $ref: '#/components/schemas/VersionStatus'
        release_notes:
          type: string
        target_commitish:
          type: string
        github_release_url:
          type: string
          description: 发货成功后写入
        error_log:
          type: string
        ship_status:
          $ref: '#/components/schemas/ShipStatus'
        ship_stage:
          $ref: '#/components/schemas/ShipStage'
        ship_message:
          type: string
        ship_hooks_status:
          type: string
          enum: [pending, completed, failed, incomplete]
          description: 该次发货触发的 issue 钩子执行汇总状态
        created_at:
          type: string
          format: date-time
        shipped_at:
          type: string
          format: date-time
          nullable: true
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
          description: omitempty，无安装包时缺省
    ShipCheckItem:
      type: object
      required: [key, label, ok]
      properties:
        key:
          type: string
          description: release_notes / artifacts / target_commitish / github_config
        label:
          type: string
        ok:
          type: boolean
        detail:
          type: string
          description: omitempty
    PendingIssueHook:
      type: object
      required: [issue_id, reference, title, comment, close, workflow_enabled, workflow_status]
      properties:
        issue_id:
          type: string
        reference:
          type: string
          description: INT-n 或 GH-n
        title:
          type: string
        comment:
          type: boolean
        close:
          type: boolean
        workflow_enabled:
          type: boolean
        workflow_status:
          type: string
          description: 目标工作流状态，可能为 ""（重置）
    ShipCheck:
      type: object
      required: [can_ship, items, pending_issue_hooks]
      properties:
        can_ship:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShipCheckItem'
        pending_issue_hooks:
          type: array
          items:
            $ref: '#/components/schemas/PendingIssueHook'
    ShipResult:
      type: object
      required: [hook_total, hook_failed, hook_status]
      properties:
        hook_total:
          type: integer
        hook_failed:
          type: integer
        hook_status:
          type: string
          description: completed / failed / incomplete
        hook_error:
          type: string
          description: omitempty

    # ---- artifacts ----
    Artifact:
      type: object
      required: [id, version_id, file_name, file_size, platform, uploaded_by, uploaded_at]
      properties:
        id:
          type: string
        version_id:
          type: string
        file_name:
          type: string
        file_size:
          type: integer
          format: int64
        platform:
          type: string
        uploaded_by:
          type: string
          description: '用户名或 "API Key: <name>"'
        uploaded_at:
          type: string
          format: date-time

    # ---- issues ----
    CreateIssueRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: trim 后须非空
        body:
          type: string
          description: Markdown；引用 /api/issues/assets/{aid}/content 链接会在创建时挂载草稿附件
        workflow_status:
          $ref: '#/components/schemas/IssueWorkflowStatus'
        source:
          $ref: '#/components/schemas/IssueSource'
          description: 默认 internal；github 仅 JWT 可用，API Key 传 github 返回 40301；其他值按 internal 处理
    UpdateIssueRequest:
      type: object
      description: 至少传一个字段；state_reason 必须随 state 同传
      properties:
        title:
          type: string
          description: trim 后须非空
        body:
          type: string
        state:
          $ref: '#/components/schemas/IssueState'
          description: 仅 JWT；API Key 携带返回 40301
        state_reason:
          type: string
          enum: [completed, not_planned, reopened]
          description: 仅 JWT；closed→completed|not_planned，open→reopened；置 open 且 reason 为空会清空
        labels:
          type: array
          items:
            type: string
          description: 标签名数组；internal issue 须为已存在仓库标签，GitHub issue 仅做非空/去重校验
    IssueChecklistItemInput:
      type: object
      required: [title]
      properties:
        id:
          type: string
          description: 缺省时服务端生成；传旧 id 复用条目
        title:
          type: string
          description: trim 后须非空
        is_completed:
          type: boolean
    UpsertShipHookRequest:
      type: object
      description: 三类动作至少启用一个，否则 40001
      properties:
        comment_body:
          type: string
          description: 传入即启用评论动作；trim 后 1-4000 rune；支持 {version}、{release_url} 占位符
        close:
          type: boolean
          description: true 时发货后关闭 Issue（state_reason=completed）
        workflow_status:
          $ref: '#/components/schemas/IssueWorkflowStatus'
          description: 传入即启用工作流动作（含 "" 重置）
    UpsertIssueRecommendationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: 推荐理由，trim 后 1-500 rune
        priority:
          $ref: '#/components/schemas/IssueRecommendationPriority'
        dependencies:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
          description: 前置依赖 Issue UUID 数组，整组替换，不含自身；重复自动去重（保序）
    DeferIssueRecommendationRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
          description: 延后备注，trim 后 ≤500 rune；缺省或空串表示无备注
    UpsertIssueCollabRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: Markdown；trim 后 1-8000 rune；重复 PUT 覆盖
    AttachIssuePullRequestRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: GitHub PR 链接，形如 https://github.com/<owner>/<repo>/pull/<number>（允许 http、www 前缀与尾部 /files、query、fragment 等）；其他字段由服务端从 GitHub 拉取
    IssueBatchFailure:
      type: object
      required: [id, error]
      properties:
        id:
          type: string
          description: Issue ID
        reference:
          type: string
          description: omitempty；INT-n 或 GH-n
        error:
          type: string
    IssueBatchResult:
      type: object
      required: [total, succeeded, failed, failures, elapsed_ms]
      properties:
        total:
          type: integer
          format: int64
        succeeded:
          type: integer
        failed:
          type: integer
        failures:
          type: array
          items:
            $ref: '#/components/schemas/IssueBatchFailure'
          description: 最多返回前 50 条失败明细
        elapsed_ms:
          type: integer
          format: int64
      description: 批量操作结果，与 service.BatchCloseDoneIssuesResponse 同形；batch-close 与批量 internal-meta 共用
    IssueActor:
      type: object
      required: [login, avatar_url]
      properties:
        login:
          type: string
        avatar_url:
          type: string
          description: GitHub 头像经媒体代理改写；internal 用户为空串
    IssueLabel:
      type: object
      required: [name, color, description]
      properties:
        name:
          type: string
        color:
          type: string
          description: "十六进制颜色（不带 # 前缀）"
        description:
          type: string
    IssueMilestone:
      type: object
      required: [number, title, state, description]
      properties:
        number:
          type: integer
        title:
          type: string
        state:
          type: string
        description:
          type: string
    IssueReactionSummary:
      type: object
      required: [total_count, "+1", "-1", laugh, hooray, confused, heart, rocket, eyes]
      properties:
        total_count:
          type: integer
        "+1":
          type: integer
        "-1":
          type: integer
        laugh:
          type: integer
        hooray:
          type: integer
        confused:
          type: integer
        heart:
          type: integer
        rocket:
          type: integer
        eyes:
          type: integer
    IssueGitHubMeta:
      type: object
