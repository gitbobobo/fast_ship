          type: integer
          format: int64
        actor:
          $ref: '#/components/schemas/IssueActor'
        body:
          type: string
        summary:
          type: string
          description: 中文化摘要
        payload:
          type: object
          description: 原始事件 JSON
        created_at:
          type: string
          format: date-time
    IssueSyncResult:
      type: object
      required: [project_id, synced_issue_count, synced_comment_count, synced_timeline_count, started_at, completed_at]
      properties:
        project_id:
          type: string
        synced_issue_count:
          type: integer
        synced_comment_count:
          type: integer
        synced_timeline_count:
          type: integer
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        last_issue_updated_at:
          type: string
          format: date-time
          description: omitempty；本次增量水位
    IssueFilterOptions:
      type: object
      required: [labels, assignees, milestones]
      properties:
        labels:
          type: array
          items:
            type: string
        assignees:
          type: array
          items:
            type: string
        milestones:
          type: array
          items:
            type: string
    IssueAsset:
      type: object
      required: [id, issue_id, file_name, mime_type, file_size, content_url, markdown, created_at]
      properties:
        id:
          type: string
        issue_id:
          type: string
          description: 草稿附件为空串
        file_name:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
          format: int64
        content_url:
          type: string
          description: /api/issues/assets/{aid}/content
        markdown:
          type: string
          description: 可直接粘贴的 ![alt](content_url) 片段
        created_at:
          type: string
          format: date-time
    IssueAttachment:
      type: object
      required: [id, file_name, file_size, mime_type, uploader, download_url, created_at]
      properties:
        id:
          type: string
        file_name:
          type: string
        file_size:
          type: integer
          format: int64
        mime_type:
          type: string
          description: 内容嗅探结果（http.DetectContentType），供 UI 图标使用
        uploader:
          type: string
          description: '用户名或 "API Key: <name>"'
        download_url:
          type: string
          description: /api/attachments/{id}/download
        created_at:
          type: string
          format: date-time

    # ---- recommendations ----
    RecommendationIssueSummary:
      type: object
      required: [id, project_id, project_name, source, sequence_number, reference, title, state, workflow_status]
      properties:
        id:
          type: string
        project_id:
          type: string
        project_name:
          type: string
        source:
          $ref: '#/components/schemas/IssueSource'
        sequence_number:
          type: integer
        reference:
          type: string
        title:
          type: string
        state:
          $ref: '#/components/schemas/IssueState'
        workflow_status:
          $ref: '#/components/schemas/IssueWorkflowStatus'
    RecommendationDependency:
      type: object
      required: [issue_id, title, state, workflow_status, project_id, sequence_number, reference]
      properties:
        issue_id:
          type: string
        title:
          type: string
        state:
          $ref: '#/components/schemas/IssueState'
        workflow_status:
          $ref: '#/components/schemas/IssueWorkflowStatus'
        project_id:
          type: string
        sequence_number:
          type: integer
        reference:
          type: string
    IssueRecommendation:
      type: object
      required: [issue, reason, priority, created_by, status, deferred_at, defer_note, created_at, updated_at, dependencies]
      properties:
        issue:
          $ref: '#/components/schemas/RecommendationIssueSummary'
        reason:
          type: string
        priority:
          $ref: '#/components/schemas/IssueRecommendationPriority'
        created_by:
          type: string
          description: 提交者 API Key 名称
        status:
          type: string
          enum: [active, deferred]
          description: deferred 表示被用户延后；延后项对 Agent 不可再推荐（PUT 返回 40911）
        deferred_at:
          type: string
          format: date-time
          nullable: true
          description: 延后时间；status=active 时为 null
        defer_note:
          type: string
          nullable: true
          description: 延后备注；无备注时为 null
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationDependency'

    # ---- dashboard ----
    DashboardProjectOpenIssuePoint:
      type: object
      required: [project_id, project_name, open_issue_count]
      properties:
        project_id:
          type: string
        project_name:
          type: string
        open_issue_count:
          type: integer
    DashboardDailyResolvedProjectPoint:
      type: object
      required: [project_id, project_name, count]
      properties:
        project_id:
          type: string
        project_name:
          type: string
        count:
          type: integer
    DashboardDailyResolvedPoint:
      type: object
      required: [date, resolved_count, projects]
      properties:
        date:
          type: string
          description: YYYY-MM-DD
        resolved_count:
          type: integer
        projects:
          type: array
          items:
            $ref: '#/components/schemas/DashboardDailyResolvedProjectPoint'
          description: 当日无数据的项目不出现（可为 null/空）
    DashboardOverview:
      type: object
      required: [open_issues_by_project, daily_resolved]
      properties:
        open_issues_by_project:
          type: array
          items:
            $ref: '#/components/schemas/DashboardProjectOpenIssuePoint'
        daily_resolved:
          type: array
          items:
            $ref: '#/components/schemas/DashboardDailyResolvedPoint'
          description: 固定近 30 天（含今天），逐日排列

    # ---- logs ----
    LogEntryInput:
      type: object
      required: [timestamp, level, message]
      properties:
        timestamp:
          type: string
          format: date-time
          description: 必填，不能为零值时间
        level:
          $ref: '#/components/schemas/LogLevel'
        source:
          type: string
          maxLength: 128
          description: ≤128 字节
        message:
          type: string
          description: 1-4000 字节
        metadata:
          type: object
          description: 可选 JSON 对象，序列化后 ≤4KB
    UploadLogsRequest:
      type: object
      required: [run_id, chunk_id, entries]
      properties:
        run_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,128}$'
          description: 客户端生成的运行 ID，项目内唯一
        chunk_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,128}$'
          description: 分片 ID；同 (run_id, chunk_id) 重试幂等，不要复用 chunk_id 传不同内容
        source:
          type: string
          maxLength: 128
          description: ≤128 字节；仅首次创建运行时写入
        description:
          type: string
          maxLength: 500
          description: ≤500 字节；仅首次创建运行时写入
        entries:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/LogEntryInput'
    UploadLogsResult:
      type: object
      required: [run_id, source, description, entry_count, first_entry_at, last_entry_at, accepted_count, duplicate]
      properties:
        run_id:
          type: string
        source:
          type: string
        description:
          type: string
        entry_count:
          type: integer
          description: 该运行累计条目数
        first_entry_at:
          type: string
          format: date-time
          nullable: true
        last_entry_at:
          type: string
          format: date-time
          nullable: true
        accepted_count:
          type: integer
          description: 本次实际写入条数；重复 chunk 为 0
        duplicate:
          type: boolean
          description: (run_id, chunk_id) 重复时为 true，本次不插入
    LogEntry:
      type: object
      required: [id, run_id, timestamp, level, source, message, created_at]
      properties:
        id:
          type: string
        run_id:
          type: string
        timestamp:
          type: string
          format: date-time
        level:
          $ref: '#/components/schemas/LogLevel'
        source:
          type: string
        message:
          type: string
        metadata:
          type: string
          description: omitempty；JSON 文本（非对象）
        created_at:
          type: string
          format: date-time
    LogRun:
      type: object
      required: [project_id, run_id, source, description, entry_count, first_entry_at, last_entry_at, created_at, updated_at]
      properties:
        project_id:
          type: string
        run_id:
          type: string
        source:
          type: string
        description:
          type: string
        entry_count:
          type: integer
        first_entry_at:
          type: string
          format: date-time
          nullable: true
        last_entry_at:
          type: string
          format: date-time
          nullable: true
        uploader_api_key_id:
          type: string
          description: omitempty
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ---- documents ----
    CreateDocumentRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: trim 后 1-200 rune
        body:
          type: string
          description: ≤200000 rune
        parent_id:
          type: string
          description: 父文档 ID；须同项目，深度 ≤64
    UpdateDocumentRequest:
      type: object
      description: title/body/parent_id 至少传一个
      properties:
        title:
          type: string
          description: trim 后 1-200 rune
        body:
          type: string
          description: ≤200000 rune
        parent_id:
          type: string
          nullable: true
          description: 三态：不传=不变；null=清除父级；字符串=设为父文档（须同项目且无环）
    DocumentListItem:
      type: object
      required: [id, project_id, parent_id, title, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        parent_id:
          type: string
          nullable: true
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Document:
      allOf:
        - $ref: '#/components/schemas/DocumentListItem'
        - type: object
          required: [body]
          properties:
            body:
              type: string

    # ---- screenshots ----
    ScreenshotScreen:
      type: object
      required: [id, project_id, screen_key, title, group, version_count, last_uploaded_at, created_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        screen_key:
          type: string
          description: 服务端规范化（ToLower+TrimSpace）后的界面标识
        title:
          type: string
          description: 可为空串，客户端回退显示 screen_key
        group:
          type: string
          description: 自由文本分组；空串表示未分组
        version_count:
          type: integer
          description: 该界面累计保留的版本数
        last_uploaded_at:
          type: string
          format: date-time
          description: 最近一次上传时间，列表按它倒序
        created_at:
          type: string
          format: date-time
    ScreenshotVersion:
      type: object
      required: [id, screen_id, note, file_name, file_size, mime_type, uploaded_by, uploaded_at, width, height, content_url]
      properties:
        id:
          type: string
        screen_id:
          type: string
        note:
          type: string
        file_name:
          type: string
        file_size:
          type: integer
          format: int64
        mime_type:
          type: string
          description: 上传时内容嗅探得到的类型（image/png、image/jpeg、image/webp、image/gif 之一）
        uploaded_by:
          type: string
          description: '用户名或 "API Key: <name>"'
        uploaded_at:
          type: string
          format: date-time
        width:
          type: integer
          description: 原图宽像素；0 表示未知（历史存量版本未记录尺寸）
        height:
          type: integer
          description: 原图高像素；0 表示未知
        content_url:
          type: string
          description: /api/screenshot-versions/{vid}/content；前端自行追加 ?token=
    ScreenshotScreenListItem:
      allOf:
        - $ref: '#/components/schemas/ScreenshotScreen'
        - type: object
          required: [latest_version]
          properties:
            latest_version:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ScreenshotVersion'
              description: 最新一个版本；无版本时为 null
    ScreenshotScreenDetail:
      allOf:
        - $ref: '#/components/schemas/ScreenshotScreen'
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              items:
                $ref: '#/components/schemas/ScreenshotVersion'
              description: 全部历史版本，uploaded_at 倒序
    ScreenshotUploadResult:
      type: object
      required: [screen, version]
      properties:
        screen:
          $ref: '#/components/schemas/ScreenshotScreen'
        version:
          $ref: '#/components/schemas/ScreenshotVersion'
    UpdateScreenshotScreenRequest:
      type: object
      description: 两字段均可选，出现才更新；都不传返回 40001
      properties:
        group:
          type: string
          maxLength: 100
          description: 分组名（≤100 字符）；允许空串置为未分组
        title:
          type: string
          maxLength: 200
          description: 界面标题（≤200 字符）；空串回退显示 screen_key

    # ---- screenshot annotations ----
    ScreenshotAnnotationStatus:
      type: string
      enum: [open, resolved]
      description: open=未解决，resolved=已解决

    ScreenshotAnnotationRect:
      type: object
      description: 像素矩形（原图坐标系）
      required: [x, y, width, height]
      properties:
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
        height:
          type: integer

    ScreenshotAnnotation:
      type: object
      description: 挂在某个截图版本上的「矩形框 + 文字」标注；坐标以图片宽高比例（0~1）存储
      required: [id, project_id, screen_id, version_id, issue_id, issue_reference, issue_title, screen_key, screen_title, screen_group, image_url, image_width, image_height, is_latest_version, x, y, width, height, pixel_rect, body, status, crop_url, created_by, created_at, updated_at, resolved_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        screen_id:
          type: string
          description: 所属界面 ID（由版本冗余带出，便于过滤）
        version_id:
          type: string
          description: 标注挂在该版本上；版本删除时标注级联删除
        issue_id:
          type: string
          nullable: true
          description: 关联的本项目 Issue ID；未关联为 null。删除 Issue 只解除关联不删标注
        issue_reference:
          type: string
          nullable: true
          description: 关联 Issue 的短编号（INT-n / GH-n）；未关联为 null
        issue_title:
          type: string
          nullable: true
          description: 关联 Issue 的标题；未关联为 null
        screen_key:
          type: string
        screen_title:
          type: string
          description: 界面显示名；空串时客户端回退展示 screen_key
        screen_group:
          type: string
          description: 界面分组；空串表示未分组
        image_url:
          type: string
          description: 标注所在版本的原图地址（版本 content_url）；追加 ?token= 供 <img>
        image_width:
          type: integer
          description: 原图宽像素；0 表示未知（存量版本未记录尺寸）
        image_height:
          type: integer
          description: 原图高像素；0 表示未知
        is_latest_version:
          type: boolean
          description: 标注是否挂在该界面当前最新版本上（画布只展示最新版本，旧版本标注经预览弹窗查看）
        x:
          type: number
          description: 框选矩形左上角横坐标 / 图宽（0~1）
        y:
          type: number
          description: 框选矩形左上角纵坐标 / 图高（0~1）
        width:
          type: number
          description: 框选矩形宽 / 图宽（0~1）
        height:
          type: number
          description: 框选矩形高 / 图高（0~1）
        pixel_rect:
          allOf:
            - $ref: '#/components/schemas/ScreenshotAnnotationRect'
          nullable: true
          description: 由比例坐标 × 原图尺寸换算的像素矩形；原图尺寸未知时为 null
        body:
          type: string
          description: 标注文字
        status:
          $ref: '#/components/schemas/ScreenshotAnnotationStatus'
        crop_url:
          type: string
          description: /api/screenshot-annotations/{aid}/crop；统一输出 PNG，前端自行追加 ?token=
        created_by:
          type: string
          description: '用户名或 "API Key: <name>"'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次标为已解决的时间；open 状态为 null

    CreateScreenshotAnnotationRequest:
      type: object
      required: [x, y, width, height, body]
      description: x/y/width/height 必填；字段缺省或传 null 一律 40001（nullable 仅为让服务端能区分缺省与显式 0）
      properties:
        x:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        y:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        width:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
        height:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          description: x+width ≤ 1 且 y+height ≤ 1，否则 40001
        body:
          type: string
          minLength: 1
          maxLength: 1000
          description: 标注文字（1~1000 字符）
        issue_id:
          type: string
          description: 可选；关联本项目内 Issue，缺省或空串 = 不关联

    UpdateScreenshotAnnotationRequest:
      type: object
      description: |
        指针语义：字段出现才更新，都不传返回 40001。
        JWT 可更新全部字段；API Key 只允许传 `{"status":"resolved"}`，其余字段或 status=open 返回 40301。
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
          description: 标注文字（1~1000 字符）
        status:
          $ref: '#/components/schemas/ScreenshotAnnotationStatus'
          description: open=重开（仅 JWT），resolved=标为已解决
        issue_id:
          type: string
          description: 空串=解除关联；非空须为本项目内 Issue（否则 40001）；不传或传 null = 保持不变

    T3EnvironmentAccess:
      type: string
      enum: [read-only, operate]
      description: |
        会话能力：仅当精确持有 `orchestration:operate` scope 时为 `operate`，
        否则 `read-only`。唯一判定依据是精确 token 的 scope 列；
        `read-only` 环境调用任何写入口返回 40300（重新配对后可操作）

    T3EnvironmentStatus:
      type: string
      enum: [ok, unreachable, repair, degraded]
      description: |
        探测状态：ok=Bearer 会话有效；unreachable=网络不可达/超时/5xx；
        repair=可达但凭证失效（Bearer 过期或被吊销），需重新配对；
        degraded=可达且凭证有效，但部分数据读取失败（如归档线程快照），
        其余数据仍返回

    T3Environment:
      type: object
      description: 已配对的 T3 环境连接；不泄漏任何凭证字段
      required: [id, name, address, status, scopes, access, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
          description: 从配对链接解析出的 T3 服务端基址（规范化 origin，如 https://host）
        status:
          $ref: '#/components/schemas/T3EnvironmentStatus'
        scopes:
          type: array
          items:
            type: string
          description: 该环境会话实际授予的 T3 scope 列表（配对时服务端授予，原样落库）
        access:
          $ref: '#/components/schemas/T3EnvironmentAccess'
        error:
          type: string
          description: 最近一次探测失败的说明；成功时省略
        updated_at:
          type: string
          format: date-time

    CreateT3EnvironmentRequest:
      type: object
      required: [name, pairing_url]
      properties:
        name:
          type: string
          minLength: 1
          description: 环境显示名；同一用户下唯一（重复返回 40912）
        pairing_url:
          type: string
          minLength: 1
          description: |
            配对链接：`t3 pair` 直接链接（`https://host/#token=code`，hash 优先，
            兼容 `?token=`）或 hosted 包装链接（`https://relay/?host=<backend>&token=code`）。
            协议支持 http/https/ws/wss；缺省协议时 IP 字面量补 http、其余补 https。

    UpdateT3EnvironmentRequest:
      type: object
      description: 指针语义：字段出现才更新，都不传返回 40001
      properties:
        name:
          type: string
          minLength: 1
        pairing_url:
          type: string
          description: 出现时重新配对（覆盖地址与 Bearer），用于修复 repair 状态

    T3DiscoveredProject:
      type: object
      description: 环境中发现的 T3 项目（绑定候选）
      required: [id, title]
      properties:
        id:
          type: string
          description: T3 projectId
        title:
          type: string
        workspace_root:
          type: string
          description: 项目主检出根目录；上游缺省时省略（此类项目不可绑定）

    T3EnvironmentProjects:
      type: object
      description: 单个环境的 T3 项目发现结果；该环境失败时 status/error 承载原因、projects 为空
      required: [environment_id, name, status, access, projects]
      properties:
        environment_id:
          type: string
        name:
          type: string
          description: 环境显示名
        status:
          $ref: '#/components/schemas/T3EnvironmentStatus'
        access:
          $ref: '#/components/schemas/T3EnvironmentAccess'
        error:
          type: string
          description: 该环境发现失败的说明；成功时省略
        projects:
          type: array
          items:
            $ref: '#/components/schemas/T3DiscoveredProject'

    ProjectT3Binding:
      type: object
      description: |
        Fast Ship 项目在某 T3 环境绑定的 T3 项目（INT-89）。t3_project_title /
        workspace_root 是绑定成功那一刻的快照：环境不可达时仍可展示；
        快照与最新发现不一致即失效绑定，需重新绑定
      required: [environment_id, environment_name, environment_status, t3_project_id, t3_project_title, workspace_root, created_at, updated_at]
      properties:
        environment_id:
          type: string
        environment_name:
          type: string
          description: 环境显示名（当前记录值）
        environment_status:
          $ref: '#/components/schemas/T3EnvironmentStatus'
        t3_project_id:
          type: string
          description: 该环境中的 T3 项目 ID
        t3_project_title:
          type: string
          description: 绑定时快照
        workspace_root:
          type: string
          description: 绑定时快照；启动线程据此解析 cwd
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpsertT3BindingRequest:
      type: object
      required: [t3_project_id]
      properties:
        t3_project_id:
          type: string
          minLength: 1
          description: 该环境中的 T3 项目 ID（来自 GET /api/environments/t3-projects 的 projects[].id）

    T3ThreadSummary:
      type: object
      required: [id, environment_id, environment_name, project_id, project_name, title, status, settled, branch, provider, model, updated_at, pull_request_count]
      properties:
        id:
          type: string
          description: T3 threadId
        environment_id:
          type: string
        environment_name:
          type: string
        project_id:
          type: string
        project_name:
          type: string
          description: 来自 WS shell 快照项目表，列表和详情均使用该来源
        title:
          type: string
        status:
          type: string
          enum: [running, waiting, idle, archived]
          description: |
            由 T3 归一化（对齐 T3 Sidebar 的判定顺序）：
            archivedAt 非空 → archived；其次 pendingRuntimeRequest 非空（等用户审批/输入）→ waiting；
            再看 activityRunStatus（后台 run 未停时 shell.status 可能已是 completed/idle）：
            preparing/starting/running → running、waiting → waiting；
            最后 shell.status 兜底（preparing/queued/starting/running → running、
            waiting → waiting、其余 → idle）
        branch:
          type: string
          description: 工作分支；T3 侧为 null 时为空串
        provider:
          type: string
          description: T3 providerInstanceId
        model:
          type: string
        updated_at:
          type: string
          description: T3 原样返回的 ISO-8601 时间
        settled:
          type: boolean
          description: 上游 settledOverride=="settled" 原样透传：用户在 T3 把线程收进了历史区。归档判定看 status=archived，与 settled 互不蕴含
        run_started_at:
          type: string
          description: 最近 run 的 startedAt（上游 latestRunStartedAt）原样透传，供「运行中 N 分钟」计时；无线程运行记录时缺省
        pull_request_count:
          type: integer
          description: 关联 PR 数（pullRequests 数组长度；缺失时按 linkedPullRequest/branchPullRequest 计）
        parent_thread_id:
          type: string
          description: 仅详情且该线程为子代理线程时给出（lineage.relationshipToParent=subagent 的 parentThreadId）；列表与父线程缺省

    T3ThreadItem:
      type: object
      description: |
        归一化线程条目。映射规则：user_message（含 attachments 图片元数据）/
        assistant_message/reasoning 原样带快照文本；proposed_plan →
        assistant_message；command_execution（text=命令，summary=命令首行，
        输出经 items/{itemId} 补读）；dynamic_tool/file_search/web_search/todo_list →
        dynamic_tool；file_change（真实元数据：文件名/增删行数/子操作，summary=文件名 ±行数，
        上游 detail 无 diff，不调用 diff 读路径）；subagent（child_thread_id 带出，
        结果经 items/{itemId} 补读）；error（text=失败信息，summary=失败类别）。
        交互类条目：approval_request（审批，request_id 关联运行时请求）/
        user_input_request（提问）/ secret_request（密钥，绝不携带密钥值）。
        结构性事件（checkpoint、handoff、notification、system_notice 等）丢弃；
        未知类型前向兼容地跳过。正文不额外截断。
        继承行（fork 前缀，visibility=inherited）只展示历史：inherited=true，
        不能在本线程原地应答；source_thread_id 指向来源线程。
      required: [id, type, text, summary]
      properties:
        id:
          type: string
          description: Fast Ship 条目 ID（sourceThreadId + "::" + T3 原始条目 id；继承行与本地行的原始 id 可能重复，靠来源线程区分）
        inherited:
          type: boolean
          description: 是否为 fork 继承前缀行（visibility=inherited）；继承的审批/提问/密钥只展示，不能在本线程作答
        source_thread_id:
          type: string
          description: 该条目所在来源线程；继承行指向来源，本地行等于当前线程
        type:
          type: string
          enum: [user_message, assistant_message, reasoning, command_execution, dynamic_tool, file_change, subagent, error, approval_request, user_input_request, secret_request]
        text:
          type: string
          description: 正文，不额外截断（命令=命令文本；文件=元数据；审批=缺省时为空；展开后的完整正文经 items/{itemId} 获取）
        summary:
          type: string
          description: 单行概要（折叠态显示，rune 安全截断）；命令/子代理=首行、文件=文件名 ±行数、工具=工具名、审批/提问=提示或问题首行
        status:
          type: string
          description: T3 侧条目状态（idle/pending/running/waiting/completed/failed/cancelled/interrupted）；可能省略
        updated_at:
          type: string
          description: 上游条目自带的 updatedAt（RFC3339）原样透传，作为条目版本；上游省略时本字段缺省
        child_thread_id:
          type: string
          description: 仅 subagent；子线程 ID
        detail_available:
          type: boolean
          description: |
            条目在快照之外还有正文，可经 items/{itemId} 补读：
            快照里 command_execution/dynamic_tool/subagent 为 true（wire 投影裁掉
            输出/结果，file_change 上游 detail 也无 diff 故为 false）；补读响应恒为
            false。缺省即 false。
        attachments:
          type: array
          description: 仅 user_message；随消息发送的图片附件元数据
          items:
            $ref: '#/components/schemas/T3ChatAttachment'
        request_id:
          type: string
          description: 仅 approval_request/user_input_request；T3 运行时请求 ID（respond/dismiss 端点使用）
        request_kind:
          type: string
          description: 仅 approval_request；请求类型（command/file-read/file-change/mcp-elicitation/permission）
        prompt:
          type: string
          description: 仅 approval_request；审批提示（上游缺省时为空）
        app_name:
          type: string
          description: 仅 approval_request；发起审批的应用（mcp-elicitation 等）；上游缺省时缺省
        options:
          type: array
          description: 仅 approval_request；审批可选项（上游自带，按序展示）
          items:
            $ref: '#/components/schemas/T3ApprovalOption'
        decision:
          type: string
          description: 仅 approval_request；已做出的决定（accept/acceptForSession/acceptAlways/decline/cancel），来自运行时请求记录
        questions:
          type: array
          description: 仅 user_input_request；问题列表
          items:
            $ref: '#/components/schemas/T3UserInputQuestion'
        answers:
          type: object
          additionalProperties: true
          description: 仅 user_input_request；已提交的答案（questionId → 答案值，原样透传）
        response_mode:
          type: string
          description: 仅 user_input_request；应答通道（message=经消息应答）
        response_capability:
          type: string
          description: 仅 approval_request/user_input_request；该请求当前的应答通道（live/message/not_resumable，运行时请求记录）
        request_status:
          type: string
          description: 仅 approval_request/user_input_request；运行时请求状态（pending/resolved/expired/cancelled；pending 才可应答）
        label:
          type: string
          description: 仅 secret_request；请求的密钥名称
        reason:
          type: string
          description: 仅 secret_request；为什么需要该密钥
        placeholder:
          type: string
          description: 仅 secret_request；输入框占位文本；上游缺省时缺省
        secret_status:
          type: string
          description: 仅 secret_request；密钥请求状态（pending/saved/declined/cancelled；绝不携带密钥值本身）

    T3ApprovalOption:
      type: object
      description: 审批可选项（T3 请求自带，缺省请求才是 Approve/Decline/Always allow this session/Cancel）
      required: [decision, label]
      properties:
        decision:
          type: string
          description: T3 ProviderApprovalDecision（accept/acceptForSession/acceptAlways/decline/cancel）
        label:
          type: string
        warning:
          type: string
          description: 提供方给出的警示（如提示注入警告）；上游缺省时缺省

    T3UserInputQuestion:
      type: object
      description: 用户输入请求中的单个问题（T3 请求自带）
      required: [id, header, question, options]
      properties:
        id:
          type: string
        header:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            type: object
            required: [label, description]
            properties:
              label:
                type: string
              description:
                type: string
              value:
                type: string
                description: 上游缺省时缺省（提交 answers 时以 label 为值）
        multi_select:
          type: boolean
          description: 上游缺省时缺省（视为单选）
        allow_custom_answer:
          type: boolean
          description: 上游缺省时缺省
        initial_answer:
          type: string
          description: 可编辑的初始文本；上游缺省时缺省
        required:
          type: boolean
          description: 上游缺省时缺省

    T3ChatAttachment:
      type: object
      description: 随消息发送的图片附件元数据（T3 ChatImageAttachment 归一化；上传经 environments/{id}/attachments）
      required: [type, id, name, mime_type, size_bytes]
      properties:
        type:
          type: string
          enum: [image]
        id:
          type: string
          description: T3 附件 ID（createUploadUrl 产出的 attachmentId）
        name:
          type: string
          maxLength: 255
        mime_type:
          type: string
          description: 仅支持 image/png、image/jpeg、image/gif、image/webp
        size_bytes:
          type: integer
          description: 字节数；单图上限 10MiB

    T3ThreadQueueItem:
      type: object
      description: 排队中的一条消息（开始前没有 turn item；run_id 用于 steer/edit/cancel/reorder）
      required: [run_id, message_id, text]
      properties:
        run_id:
          type: string
        message_id:
          type: string
        text:
          type: string
          description: 消息正文；上游投影缺消息时为「Queued message」
        attachments:
          type: array
          description: 随消息的图片附件元数据；上游缺省时为空数组
          items:
            $ref: '#/components/schemas/T3ChatAttachment'

    T3ThreadQueue:
      type: object
      description: |
        线程排队消息工作流，口径对齐 T3 `deriveThreadQueueWorkflowState`：
        items 为用户消息产生的排队 run（自动完成/通知 run 不在内），按
        queuePosition（缺省 ordinal）升序。
      required: [held, can_reorder, can_steer, items]
      properties:
        held:
          type: boolean
          description: 队列被挂起（Stop 或重启恢复后等待用户手动恢复）
        can_reorder:
          type: boolean
          description: provider 会话能力支持排队消息（排序/编辑/取消可用）
        can_steer:
          type: boolean
          description: provider 会话能力支持把排队消息上浮为活动运行的转向输入
        items:
          type: array
          items:
            $ref: '#/components/schemas/T3ThreadQueueItem'

    T3ThreadActivity:
      type: object
      description: 线程当前活动摘要（活动 run 来自投影 runs，与 queue 同一来源）
      required: [stopping, has_pending_requests, pending_background_task_count]
      properties:
        active_run_id:
          type: string
          description: 活动 run（preparing/starting/running/waiting 的最近一个）；静止时缺省
        active_run_status:
          type: string
          description: 活动 run 状态；静止时缺省
        stopping:
          type: boolean
          description: |
            停止请求已下发且尚未落定：活动 run 的最近一条 run_interrupt_request
            条目晚于同 run 的最近一条 run_interrupt_result
        has_pending_requests:
          type: boolean
          description: 有等待用户处理的运行时请求（审批/提问/代答 secret）
        pending_background_task_count:
          type: integer
          description: 根 run 结束后仍在跑的后台工作条数（command 类不占完成位；上游缺省时为 0）

    T3ThreadDetail:
      type: object
      required: [thread, items, queue, activity, access]
      properties:
        thread:
          $ref: '#/components/schemas/T3ThreadSummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/T3ThreadItem'
        queue:
          $ref: '#/components/schemas/T3ThreadQueue'
        activity:
          $ref: '#/components/schemas/T3ThreadActivity'
        access:
          $ref: '#/components/schemas/T3EnvironmentAccess'

    T3ModelOption:
      type: object
      description: T3 模型选项（canonical `{id,value}`；value 为 string 或 boolean）
      required: [id, value]
      properties:
        id:
          type: string
        value:
          type: string
          description: |
            字符串或布尔（T3 ProviderOptionSelectionValue）。JSON 原样透传，
            布尔选项发 JSON boolean 而非字符串。
          x-go-type: interface{}

    T3ModelSelection:
      type: object
      description: T3 模型选择（instanceId 来自 composer-options 的 providers；缺省用项目默认）
      required: [instance_id, model]
      properties:
        instance_id:
          type: string
          description: T3 providerInstanceId
        model:
          type: string
        options:
          type: array
          description: |
            provider 实例声明的模型选项，canonical 数组 `[{id,value}]`
            （与 T3 ModelSelection.options 一致）；缺省省略
          items:
            $ref: '#/components/schemas/T3ModelOption'

    T3ThreadWorkspace:
      type: object
      description: |
        新线程工作区（对齐 T3 OrchestrationV2ThreadLaunchWorkspaceStrategy）。
        缺省为项目主检出（root 不带 branch）。`worktree` 的 `base_ref` 缺省为
        主检出当前分支；`start_from_origin` 缺省取 T3 设置
        `newWorktreesStartFromOrigin`。`existing_worktree` 的 worktree_path 必填。
      required: [type]
      properties:
        type:
          type: string
          enum: [root, worktree, existing_worktree]
        branch:
          type: string
          description: 新检出的分支名；缺省由 T3 决定（root 的 Current checkout 不传 branch）
        base_ref:
          type: string
          description: 仅 worktree；新建 worktree 的基线引用；缺省为主检出当前分支
        start_from_origin:
          type: boolean
          description: 仅 worktree；缺省取 T3 设置 newWorktreesStartFromOrigin
        worktree_path:
          type: string
          description: 仅 existing_worktree；T3 侧已注册的工作树路径（来自 workspace-options 或线程详情）

    CreateT3ThreadRequest:
      type: object
      required: [project_id, message]
      properties:
        command_id:
          type: string
          description: 稳定命令 ID；缺省由服务端生成。同一操作重试必须带同一 ID
        thread_id:
          type: string
          description: 稳定线程 ID；缺省由服务端生成。同一操作重试必须带同一 ID（T3 据此幂等）
        project_id:
          type: string
          description: T3 projectId（来自 composer-options 的 projects[].id）
        message:
          type: object
          description: |
            首条消息（必填；title 缺省时据此生成种子标题）。
            text 可为空，但 text 与 attachments 不能同时空。
          required: [text]
          properties:
            message_id:
              type: string
              description: 稳定消息 ID；缺省由服务端生成
            text:
              type: string
              description: 正文；仅图片消息时为空串
            attachments:
              type: array
              description: 图片附件元数据（来自附件上传端点）；缺省按 []
              items:
                $ref: '#/components/schemas/T3ChatAttachment'
        title:
          type: string
          description: 线程标题；缺省时从首条消息生成种子标题并让 T3 生成正式标题
        model_selection:
          $ref: '#/components/schemas/T3ModelSelection'
        runtime_mode:
          type: string
          enum: [approval-required, auto-accept-edits, auto, full-access]
          default: full-access
        workspace:
          $ref: '#/components/schemas/T3ThreadWorkspace'

    T3ThreadLaunchResult:
      type: object
      description: launchThread 结果归一化（thread 详情经 GET threads/{threadId} 读取）
      required: [thread_id, resumed]
      properties:
        thread_id:
          type: string
        resumed:
          type: boolean
          description: 复用了同 ID 的既有线程（幂等重试）时为 true

    SendT3ThreadMessageRequest:
      type: object
      required: [text]
      properties:
        command_id:
          type: string
          description: 稳定命令 ID；缺省由服务端生成。同一操作重试必须带同一 ID
        message_id:
          type: string
          description: 稳定消息 ID；缺省由服务端生成
        text:
          type: string
          description: 正文；仅图片消息时为空串。text 与 attachments 不能同时空
        attachments:
          type: array
          description: 图片附件元数据；缺省按 [] 发送（上游要求字段为数组）
          items:
            $ref: '#/components/schemas/T3ChatAttachment'

    T3DispatchResult:
      type: object
      description: dispatchCommand 受理结果（sequence 为 T3 投影事件序号）
      required: [sequence]
      properties:
        sequence:
          type: integer

    T3ThreadStopResult:
      type: object
      description: 停止结果；无可停止运行时按 T3 口径视为无操作（stopped=false）
      required: [stopped]
      properties:
        stopped:
          type: boolean
        run_id:
          type: string
          description: 被中断的 run；无可停止运行时缺省

    SteerT3QueuedRunRequest:
      type: object
      description: target_run_id 由服务端解析为当前活动 run，请求体保留字段以显式表达意图
      properties: {}

    EditT3QueuedRunRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
        attachments:
          type: array
          description: |
            三态：字段缺省=保留原附件（不得反序列化成空数组）；[]=清空；
            非空数组=整组替换
          items:
            $ref: '#/components/schemas/T3ChatAttachment'

    ReorderT3QueuedRunRequest:
      type: object
      description: before_run_id 为 null 或缺省表示移到队尾
      properties:
        before_run_id:
          type: string
          nullable: true
          description: 目标位置后一条排队消息的 run_id

    RespondT3ThreadRequest:
      type: object
      description: 应答联合：approval 携带 decision；user_input 携带 answers
      required: [type]
      properties:
        type:
          type: string
          enum: [approval, user_input]
        decision:
          type: string
          description: 仅 type=approval；T3 ProviderApprovalDecision（accept/acceptForSession/acceptAlways/decline/cancel），应为请求 options 中的 decision
        answers:
          type: object
          additionalProperties: true
          description: 仅 type=user_input；questionId → 答案值（原样透传给 T3）
        attachments_by_question_id:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/T3ChatAttachment'
          description: 仅 type=user_input；按问题追加图片附件；缺省不发

    AnswerT3SecretRequest:
      type: object
      description: 密钥应答联合；save 携带密钥值（仅此一次经过，不落库不回显）
      required: [type]
      properties:
        type:
          type: string
          description: save（携带 secret）或 decline
        secret:
          type: string
          minLength: 1
          description: 仅 type=save；密钥值

    T3ComposerOptions:
      type: object
      description: 线程启动器选项（projects 归一化；config/settings 为上游原样透传）
      required: [projects, config, settings]
      properties:
        projects:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id:
                type: string
              title:
                type: string
              workspace_root:
                type: string
                description: 项目主检出根目录（workspace-options 据此解析 cwd）；上游缺省时缺省
              default_model_selection:
                $ref: '#/components/schemas/T3ModelSelection'
        config:
          type: object
          additionalProperties: true
          description: T3 `server.getConfig` 响应原样透传（camelCase，含 providers 等启动器所需的全部配置）
        settings:
          type: object
          additionalProperties: true
          description: T3 `server.getSettings` 响应原样透传（camelCase，含 newWorktreesStartFromOrigin 等设置）

    T3WorkspaceRef:
      type: object
      description: vcs 引用（分支/标签等，按 T3 vcs.listRefs 原始形状归一化出名称与类别）
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          description: local / remote（T3 refKind）
        is_default:
          type: boolean
          description: 上游标注的默认分支；上游缺省时缺省
        worktree_path:
          type: string
          description: 该引用对应的既有工作树路径（若有）；上游缺省时缺省

    T3WorkspaceOptions:
      type: object
      description: 线程工作区选项（cwd 来自上游项目 workspaceRoot，不接受前端任意路径）
      required: [project_id, cwd, refs]
      properties:
        project_id:
          type: string
        cwd:
          type: string
          description: 项目主检出根目录
        is_repo:
          type: boolean
          description: vcs.refreshStatus 报告该目录是否为 git 仓库
        ref_name:
          type: string
          description: 主检出当前分支；新建 worktree 线程的 base_ref 缺省取此值
        has_working_tree_changes:
          type: boolean
          description: 工作区有未提交变更
        has_primary_remote:
          type: boolean
        refs:
          type: array
          items:
            $ref: '#/components/schemas/T3WorkspaceRef'
        next_cursor:
          type: integer
          nullable: true
          description: vcs.listRefs 分页游标；null 表示没有更多
        total_count:
          type: integer
          description: 过滤后的引用总数

    AutomationTriggerType:
      type: string
      enum: [cron, issue_created, issue_status_changed, issue_label_added, github_pr_opened, github_pr_synchronize]
      description: |
        触发类型。cron 按五字段标准表达式调度；issue_* 为内部 Issue 事件；
        github_pr_* 由 GitHub webhook（pull_request opened/synchronize）经防抖后触发。
        GitHub PR 触发要求显式 model_selections（至少 1 个模型，每个模型各开一个运行），
        不做 draft / fork，同一 head SHA 变化会取消该 PR 全部在途运行。

    AutomationPostAction:
      type: string
      enum: [none, settle, archive]
      description: 运行结束后的线程操作。settle 收进历史区（等线程安全收尾）；archive 归档（可终止活动线程）。

    AutomationEventFilter:
      type: object
      description: |
        Issue 事件可选过滤。issue_status_changed 用 field/from/to（field ∈ state|workflow_status）；
        issue_label_added 用 labels（数组，匹配任一名称）；不传或留空表示该类型全部真实事件。
      properties:
        field:
          type: string
          enum: [state, workflow_status]
        from:
          type: string
          description: 变化前值；空表示任意
        to:
          type: string
          description: 变化后值；空表示任意
        labels:
          type: array
          items:
            type: string
          description: 匹配任一新加标签名；空数组表示全部加标签事件

    AutomationModelSelection:
      type: object
      required: [instance_id, model]
      description: T3 模型选择（缺省回落 T3 项目默认）
      properties:
        instance_id:
          type: string
        model:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              value:
                type: string

    AutomationWorkspace:
      type: object
      required: [type]
      description: 新线程工作区（同 T3ThreadWorkspace，持久化为 JSON 快照）
      properties:
        type:
          type: string
          description: root / worktree / existing_worktree
        base_ref:
          type: string
        branch:
          type: string
        start_from_origin:
          type: boolean
        worktree_path:
          type: string

    Automation:
      type: object
      required: [id, name, enabled, trigger_type, environment_id, t3_project_id, prompt_template, runtime_mode, timeout_seconds, post_action, post_on_timeout, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        environment_id:
          type: string
          description: T3 环境 ID
        t3_project_id:
          type: string
          description: T3 项目 ID（线程开在这里）
        trigger_type:
          $ref: '#/components/schemas/AutomationTriggerType'
        cron_expression:
          type: string
          description: 仅 cron 触发；五字段标准表达式
        timezone:
          type: string
          description: IANA 时区名，仅 cron 触发；空表示 UTC
        next_run_at:
          type: string
          nullable: true
          description: 下次调度时间（UTC RFC3339）；仅 cron 触发
        issue_project_id:
          type: string
          nullable: true
          description: 事件过滤的项目；null 表示当前用户全部项目
        event_filter:
          $ref: '#/components/schemas/AutomationEventFilter'
        prompt_template:
          type: string
          description: 提示词模板（支持 {{issue_id}}/{{issue_title}}/{{issue_body}} 占位，事件触发时替换；服务端会追加回报说明）
        model_selection:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AutomationModelSelection'
        model_selections:
          type: array
          description: |
            GitHub PR 触发的多模型选择：一次触发每个模型各开一个运行（同一 head SHA 一轮，
            并行）。至少 1 个、最多 10 个，(instance_id, model) 不可重复；必须显式选择，
            不能「项目默认」。cron/issue 触发忽略此字段，继续用单个 model_selection。
          items:
            $ref: '#/components/schemas/AutomationModelSelection'
        debounce_seconds:
          type: integer
          description: |
            仅 GitHub PR 触发：防抖窗口秒数，窗口内新推送重置计时，到点只对最新 SHA 开一轮。
            0=立即；缺省 60；上限 86400。
        runtime_mode:
          type: string
          description: 缺省 full-access；可选 approval-required / auto-accept-edits / auto / full-access
        workspace:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AutomationWorkspace'
        timeout_seconds:
          type: integer
          description: 回报截止时长（秒）；1 分钟–24 小时，缺省 3600
        post_action:
          $ref: '#/components/schemas/AutomationPostAction'
        post_on_timeout:
          type: boolean
          description: 超时后是否仍执行后置操作；缺省 false
        created_at:
          type: string
        updated_at:
          type: string

    CreateAutomationRequest:
      type: object
      required: [name, trigger_type, environment_id, t3_project_id, prompt_template]
      properties:
        name:
          type: string
          maxLength: 200
        enabled:
          type: boolean
          description: 缺省 false；启用时完整校验触发配置与 public_url
        environment_id:
          type: string
        t3_project_id:
          type: string
        trigger_type:
          $ref: '#/components/schemas/AutomationTriggerType'
        cron_expression:
          type: string
        timezone:
          type: string
        issue_project_id:
          type: string
          nullable: true
        event_filter:
          $ref: '#/components/schemas/AutomationEventFilter'
        prompt_template:
          type: string
        model_selection:
          $ref: '#/components/schemas/AutomationModelSelection'
        model_selections:
          type: array
          description: GitHub PR 触发必填：1–10 个模型，(instance_id, model) 不可重复。
          items:
            $ref: '#/components/schemas/AutomationModelSelection'
        debounce_seconds:
          type: integer
          description: 仅 GitHub PR 触发；0=立即，缺省 60，上限 86400。
        runtime_mode:
          type: string
          description: 缺省 full-access；可选 approval-required / auto-accept-edits / auto / full-access
        workspace:
          $ref: '#/components/schemas/AutomationWorkspace'
        timeout_seconds:
          type: integer
        post_action:
          $ref: '#/components/schemas/AutomationPostAction'
        post_on_timeout:
          type: boolean

    UpdateAutomationRequest:
      type: object
      description: 全量更新语义；字段缺省视为清空/回落默认（id、created_at 不可改）。
      required: [name, trigger_type, environment_id, t3_project_id, prompt_template]
      properties:
        name:
          type: string
          maxLength: 200
        enabled:
          type: boolean
        environment_id:
          type: string
        t3_project_id:
          type: string
        trigger_type:
          $ref: '#/components/schemas/AutomationTriggerType'
        cron_expression:
          type: string
        timezone:
          type: string
        issue_project_id:
          type: string
          nullable: true
        event_filter:
          $ref: '#/components/schemas/AutomationEventFilter'
        prompt_template:
          type: string
        model_selection:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AutomationModelSelection'
        model_selections:
          type: array
          description: GitHub PR 触发必填：1–10 个模型，(instance_id, model) 不可重复。
          items:
            $ref: '#/components/schemas/AutomationModelSelection'
        debounce_seconds:
          type: integer
          description: 仅 GitHub PR 触发；0=立即，缺省 60，上限 86400。
        runtime_mode:
          type: string
          description: 缺省 full-access；可选 approval-required / auto-accept-edits / auto / full-access
        workspace:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AutomationWorkspace'
        timeout_seconds:
          type: integer
        post_action:
          $ref: '#/components/schemas/AutomationPostAction'
        post_on_timeout:
          type: boolean

    AutomationRunStatus:
      type: string
      enum: [queued, dispatched, running, completed, failed, timed_out, cancelled]
      description: |
        queued=PR 审查排队（用户并发上限内不占在途名额，等调度提升）；
        dispatched=已向 T3 发起（结果可能未确认）；running=agent 已回报开始；
        cancelled=被新 head SHA 取代或规则改动后废弃（终态）；
        completed/failed/timed_out 为终态。回报未开始时状态可能为空。

    AutomationPostState:
      type: string
      enum: [none, pending, succeeded, failed]

    AutomationRun:
      type: object
      required: [id, automation_id, trigger_type, trigger_key, triggered_at, environment_id, t3_project_id, thread_id, status, post_state, post_attempt]
      properties:
        id:
          type: string
        automation_id:
          type: string
        trigger_type:
          $ref: '#/components/schemas/AutomationTriggerType'
        trigger_key:
          type: string
          description: 同一自动化内唯一：cron 为 `cron:<原计划UTC>`，Issue 事件为 `event:<事件UUID>`，GitHub PR 为 `pr:<repo>:<number>:<sha>:<instance_id>:<model>`
        repo_full_name:
          type: string
          description: 仅 GitHub PR 触发；owner/repo
        pr_number:
          type: integer
          description: 仅 GitHub PR 触发
        head_sha:
          type: string
          description: 仅 GitHub PR 触发；本轮审查的 head commit SHA
        round_number:
          type: integer
          description: 仅 GitHub PR 触发；同一 PR 内递增的轮次（从 1 起，同一轮各模型共享）
        model_instance_id:
          type: string
          description: 仅 GitHub PR 触发；本运行绑定的模型 instance_id
        model_name:
          type: string
          description: 仅 GitHub PR 触发；本运行绑定的模型名
        trigger_context:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AutomationTriggerContext'
        triggered_at:
          type: string
        status:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AutomationRunStatus'
        dispatch_started_at:
          type: string
          nullable: true
          description: worker 认领并开始派发的时间
        environment_id:
          type: string
        t3_project_id:
          type: string
        thread_id:
          type: string
        dispatched_at:
          type: string
          nullable: true
          description: 启动 RPC 结果确认时间；为空表示线程是否建成未确认（此类运行不执行后置）
        started_at:
          type: string
          nullable: true
        finished_at:
          type: string
          nullable: true
        deadline_at:
          type: string
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        post_state:
          $ref: '#/components/schemas/AutomationPostState'
        post_attempt:
          type: integer
        post_next_attempt_at:
          type: string
          nullable: true
        post_deadline_at:
          type: string
          nullable: true
        post_error:
          type: string
          nullable: true

    AutomationTriggerContext:
      type: object
      description: 触发上下文（issue 事件时含项目/issue/变化内容；不落 issue 正文）。
      properties:
        project_id:
          type: string
        issue_id:
          type: string
        issue_sequence_number:
          type: integer
        issue_title:
          type: string
        field:
          type: string
          description: 状态变化字段（state | workflow_status）
        from:
          type: string
        to:
          type: string
        labels_added:
          type: array
          items:
            type: string

    Notification:
      type: object
      required: [id, kind, title, body, created_at, updated_at, last_seen_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [agent, automation_dispatch_failed, automation_run_timeout, automation_post_failed, automation_busy]
        title:
          type: string
        body:
          type: string
        environment_id:
          type: string
          nullable: true
        thread_id:
          type: string
          nullable: true
        run_id:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        last_seen_at:
          type: string
        read_at:
          type: string
          nullable: true

    AutomationRunReportRequest:
      type: object
      required: [phase]
      properties:
        phase:
          type: string
          enum: [started, finished]
        summary:
          type: string
          description: 仅 finished；一句话结果摘要
        error_code:
          type: string
          description: 仅 finished；非空表示运行失败（状态记 failed）
        error_message:
          type: string
          description: 仅 finished

    AutomationRunReportResult:
      type: object
      required: [run_id, status, replay]
      properties:
        run_id:
          type: string
        status:
          type: string
          description: 回报后的运行状态
        replay:
          type: boolean
          description: true 表示这是一次完全相同结束回报的重放

    AgentNotificationRequest:
      type: object
      required: [title, problem_key, state_key]
      properties:
        title:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 4000
        problem_key:
          type: string
          maxLength: 200
          description: 去重身份；同一线程同类问题用同一 key
        state_key:
          type: string
          maxLength: 500
          description: 状态指纹；同 problem_key 下状态变化才刷新通知
        environment_id:
          type: string
          description: 可选；缺省用运行的环境
        thread_id:
          type: string
          description: 可选；缺省用运行的线程
    SelfLogEntry:
      type: object
      description: Fast Ship 自身日志条目（入库前已脱敏：token/密钥/密码/Authorization 一律不落明文）
      required: [id, time, level, message]
      properties:
        id:
          type: integer
          format: int64
          description: 存储行 ID；与时间联合构成游标定位
        time:
          type: string
          format: date-time
        level:
          type: string
          enum: [DEBUG, INFO, WARN, ERROR]
        module:
          type: string
          description: 产生日志的模块（http / automation / t3 / github / auth / api_key 等）
        message:
          type: string
        request_id:
          type: string
        user_id:
          type: string
        project_id:
          type: string
        issue_id:
          type: string
        automation_id:
          type: string
        run_id:
          type: string
        thread_id:
          type: string
        extra:
          type: object
          additionalProperties: true
          description: 其余结构化字段（JSON 对象）；未选入 fields 时省略

    SelfLogPage:
      type: object
      description: 自身日志分页（键集游标；next_cursor 为 null 表示没有更多）
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SelfLogEntry'
        next_cursor:
          type: string
          nullable: true
          description: 下一页游标；没有更多时为 null
        has_more:
          type: boolean

    SelfLogAggregateResult:
      type: object
      description: 自身日志聚合结果
      required: [rows, truncated]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SelfLogAggregateRow'
        truncated:
          type: boolean
          description: 超过单次聚合上限（2000 行）被截断；按时间桶时保留的是最近的桶

    SelfLogAggregateRow:
      type: object
      description: 一行聚合计数；未选择的维度字段省略
      required: [count]
      properties:
        count:
          type: integer
        module:
          type: string
        level:
          type: string
        time_bucket:
          type: string
          format: date-time
          description: 时间桶起点（对齐分钟/小时），RFC3339

    SelfLogTraceResult:
      type: object
      description: 请求/运行链路日志（时间正序）
      required: [items, truncated]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SelfLogEntry'
        truncated:
          type: boolean
          description: 超过单次链路上限（1000 条）被截断；保留的是最新 1000 条


    AgentPullRequestDetail:
      type: object
      required: [repo_full_name, pr_number, head_sha, title, html_url]
      description: 本运行审查的 PR 元数据（从运行行与 GitHub 读取；不接受请求参数）
      properties:
        repo_full_name:
          type: string
        pr_number:
          type: integer
        head_sha:
          type: string
          description: 本运行绑定的 head commit SHA
        title:
          type: string
        body:
          type: string
          nullable: true
        html_url:
          type: string
        base_ref:
          type: string
        head_ref:
          type: string
        draft:
          type: boolean

    AgentPullRequestDiff:
      type: object
      required: [content, truncated]
      properties:
        content:
          type: string
          description: 统一 diff 文本
        truncated:
          type: boolean
          description: 超过 1MB 截断时为 true

    AgentPullRequestComment:
      type: object
      required: [id, user, body, created_at]
      properties:
        id:
          type: integer
        user:
          type: string
        body:
          type: string
        in_reply_to_id:
          type: integer
          nullable: true
        path:
          type: string
          nullable: true
        created_at:
          type: string

    AgentPullRequestReviewRequest:
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum: [COMMENT, APPROVE, REQUEST_CHANGES]
          description: 审查结论；commit_id 由服务端取本运行 head SHA
        body:
          type: string
          description: review 正文（APPROVE 时可空）

    AgentPullRequestReviewResult:
      type: object
      required: [submitted]
      properties:
        submitted:
          type: boolean

    AgentCheckUpdateRequest:
      type: object
      description: 只更新本运行 check run 的标题与说明；结论（conclusion）由运行终态决定，不接受传入。
      properties:
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 8000
        text:
          type: string
          maxLength: 40000
