    # ---- logs ----
    LogEntryInput:
      type: object
      required: [timestamp, level, message]
      properties:
        timestamp:
          type: string
          format: date-time
          description: 必填，不能为零值时间
        level:
          $ref: '#/components/schemas/LogLevel'
        source:
          type: string
          maxLength: 128
          description: ≤128 字节
        message:
          type: string
          description: 1-4000 字节
        metadata:
          type: object
          description: 可选 JSON 对象，序列化后 ≤4KB
    UploadLogsRequest:
      type: object
      required: [run_id, chunk_id, entries]
      properties:
        run_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,128}$'
          description: 客户端生成的运行 ID，项目内唯一
        chunk_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,128}$'
          description: 分片 ID；同 (run_id, chunk_id) 重试幂等，不要复用 chunk_id 传不同内容
        source:
          type: string
          maxLength: 128
          description: ≤128 字节；仅首次创建运行时写入
        description:
          type: string
          maxLength: 500
          description: ≤500 字节；仅首次创建运行时写入
        entries:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/LogEntryInput'
    UploadLogsResult:
      type: object
      required: [run_id, source, description, entry_count, first_entry_at, last_entry_at, accepted_count, duplicate]
      properties:
        run_id:
          type: string
        source:
          type: string
        description:
          type: string
        entry_count:
          type: integer
          description: 该运行累计条目数
        first_entry_at:
          type: string
          format: date-time
          nullable: true
        last_entry_at:
          type: string
          format: date-time
          nullable: true
        accepted_count:
          type: integer
          description: 本次实际写入条数；重复 chunk 为 0
        duplicate:
          type: boolean
          description: (run_id, chunk_id) 重复时为 true，本次不插入
    LogEntry:
      type: object
      required: [id, run_id, timestamp, level, source, message, created_at]
      properties:
        id:
          type: string
        run_id:
          type: string
        timestamp:
          type: string
          format: date-time
        level:
          $ref: '#/components/schemas/LogLevel'
        source:
          type: string
        message:
          type: string
        metadata:
          type: string
          description: omitempty；JSON 文本（非对象）
        created_at:
          type: string
          format: date-time
    LogRun:
      type: object
      required: [project_id, run_id, source, description, entry_count, first_entry_at, last_entry_at, created_at, updated_at]
      properties:
        project_id:
          type: string
        run_id:
          type: string
        source:
          type: string
        description:
          type: string
        entry_count:
          type: integer
        first_entry_at:
          type: string
          format: date-time
          nullable: true
        last_entry_at:
          type: string
          format: date-time
          nullable: true
        uploader_api_key_id:
          type: string
          description: omitempty
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

