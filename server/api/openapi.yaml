  /api/environments/{id}/threads/{threadId}/requests/{requestId}/respond:
    post:
      tags: [environments]
      operationId: respondT3ThreadRequest
      summary: 应答审批或用户输入请求
      description: |
        经 WS RPC 下发 `runtime-request.respond`。`type=approval` 携带 decision
        （approve 缺省时使用请求自带 options 的 decision，缺省选项才是
        Approve/Decline/Always allow this session/Cancel，服务端不自增
        acceptAlways）；`type=user_input` 携带 answers（questionId → 答案）与
        可选 attachments_by_question_id。请求已回答/已过期返回 40916。
        继承（fork 前缀）请求不能在本线程原位应答——requestId 必须属于
        本线程的 runtimeRequests。
      parameters:
        - $ref: '#/components/parameters/T3EnvironmentId'
        - $ref: '#/components/parameters/T3ThreadId'
        - $ref: '#/components/parameters/T3RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondT3ThreadRequest'
      responses:
        '200':
          description: 已应答
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/T3DispatchResult'
        '400':
          description: 参数无效（40001，如 decision/answers 非法）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 该环境为只读会话（40300）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 环境不存在（40417）、线程不存在（40418）或请求不属于本线程（40419）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
