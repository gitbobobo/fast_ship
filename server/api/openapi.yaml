          type: string
          format: date-time
          nullable: true
          description: state=merged 时有值
        closed_at:
          type: string
          format: date-time
          nullable: true
        link_origin:
          $ref: '#/components/schemas/IssuePullRequestLinkOrigin'
        synced_at:
          type: string
          format: date-time
          description: 最近一次从 GitHub 刷新成功的时间
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IssuePullRequestSummary:
      type: object
      required: [total, open, merged]
      properties:
        total:
          type: integer
        open:
          type: integer
          description: state=open 计数
        merged:
          type: integer
          description: state=merged 计数
      description: Issue 关联 PR 的聚合计数；closed 计数 = total - open - merged
    IssuePullRequestSyncFailure:
      type: object
      required: [id, error]
      properties:
        id:
          type: string
          description: 关联行 id（issue_pull_requests.id，detach 时用此 id）
        error:
          type: string
          description: 失败原因，前缀带 repo_full_name#number 便于定位
      description: PR 关联刷新失败明细；失败行保留旧数据
    IssuePullRequestSyncResult:
      type: object
      required: [items, failures]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IssuePullRequest'
          description: 本轮刷新成功的关联行（无关联或无成功时为空数组）
        failures:
          type: array
          items:
            $ref: '#/components/schemas/IssuePullRequestSyncFailure'
          description: 逐行失败明细
      description: syncIssuePullRequests 的响应形状，与批量 internal-meta 的 {items, failures} 约定一致
    Issue:
      type: object
      required: [id, project_id, source, sequence_number, reference, state, state_reason, title, body, body_html, author, created_at, updated_at, closed_at, unread_comments_count]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
        source:
          $ref: '#/components/schemas/IssueSource'
        sequence_number:
          type: integer
          description: 项目内自增序号（reference 的 INT-n 来源）
        reference:
          type: string
          description: 短编号；github 为 GH-<number>，internal 为 INT-<sequence_number>
        state:
          $ref: '#/components/schemas/IssueState'
        state_reason:
          type: string
          description: completed / not_planned / reopened 或空串
        title:
          type: string
        body:
          type: string
        body_html:
          type: string
          description: github 来源为远端渲染 HTML（媒体链接经代理改写）；internal 为空串
        author:
          $ref: '#/components/schemas/IssueActor'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        unread_comments_count:
          type: integer
          description: 未读评论数；仅列表响应填充（internal issue 恒为 0），详情响应恒为 0
        internal_meta:
          $ref: '#/components/schemas/IssueInternalMeta'
        ship_hook:
          $ref: '#/components/schemas/IssueShipHook'
        github:
          $ref: '#/components/schemas/IssueGitHubMeta'
        collab:
          $ref: '#/components/schemas/IssueCollabArea'
          description: omitempty；仅 Issue 详情响应携带，与 GET /collab 的 data 同形；列表项不出现
        pull_requests:
          type: array
          items:
            $ref: '#/components/schemas/IssuePullRequest'
          description: omitempty；仅 Issue 详情响应携带（读取失败或无关联时缺省）；列表项不出现
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/IssueAttachment'
          description: omitempty；仅 Issue 详情响应携带（无附件时缺省）；列表项不出现
        screenshot_annotations:
          type: array
          items:
            $ref: '#/components/schemas/ScreenshotAnnotation'
          description: omitempty；仅 Issue 详情响应携带（无关联标注时缺省）；列表项不出现
        pull_request_summary:
          $ref: '#/components/schemas/IssuePullRequestSummary'
          description: omitempty；仅 Issue 列表项携带的 PR 聚合计数；详情项不出现
    IssueComment:
