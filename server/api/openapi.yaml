        （holdQueue=true，T3 Stop 按钮口径：同时挂起队列）。目标 run 由
        服务端选择：活动 run（preparing/starting/running/waiting 的最近一个），
        否则仍有后台工作的最近 run（对齐 T3 客户端 stopThread 的选择逻辑）。
        没有可停止的 run 时按 T3 口径视为无操作，返回 stopped=false，
        不杜撰内部 thread.stop 命令。
