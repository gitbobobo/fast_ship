        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bots/{id}/runs/{runId}/stop:
    post:
      tags: [bots]
      operationId: stopBotRun
      summary: 停止主线 run
      description: |
        首次调用受理停止：追加一条「停止」用户消息（client_message_id=
        stop:<runId> 幂等）并唤醒机器人，由它结合上下文决定后续动作；宽限期
        内 run 未自然到安全点时按受理时的请求序号判断——之后已发起过新请求则
        不硬取消（避免丢掉停止之后的新输入），否则硬取消执行槽 context，run
        在安全点收尾为 stopped。已受理过停止再调用（重复点击 / 强制停止）跳过
        宽限与进展判断，立即硬取消。run 已结束返回 40928。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 停止已请求（run 状态以响应为准）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BotRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 运行状态已变化（40928）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bots/{id}/schedule-tasks:
    get:
      tags: [bots]
      operationId: listBotScheduleTasks
      summary: 定时任务列表
