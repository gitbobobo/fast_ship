  /api/bots/{id}/schedule-tasks/{taskId}/enabled:
    put:
      tags: [bots]
      operationId: setBotScheduleTaskEnabled
      summary: 开启/关闭定时任务
      description: |
        用户对任务唯一的写操作。body 只接受 {"enabled":bool}；出现其它字段返回
        40001。重新开启时 next_run_at 重算为当前时间之后的下一次，不补跑过期计划。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: 任务现状（含重算后的 next_run_at 与最近一次运行）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BotScheduleTask'
        '400':
          description: 请求体携带未知字段或缺 enabled（40001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bots/{id}/schedule-tasks/{taskId}/state:
    delete:
      tags: [bots]
      operationId: clearBotScheduleTaskState
      summary: 清空定时任务状态
