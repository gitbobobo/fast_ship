                      data:
                        $ref: '#/components/schemas/IssueRecommendation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: JWT 调用仅限 API Key 的端点（40303）
