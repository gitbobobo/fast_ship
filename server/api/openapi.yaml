  /api/github-tokens:
    get:
      tags: [github-tokens]
      operationId: listGithubTokens
      summary: 列出当前用户的 GitHub Token
      description: 不回显明文；附带每条的引用项目与检测摘要。列表不触发任何 GitHub 请求。
      security:
        - jwtAuth: []
      responses:
        '200':
          description: Token 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GitHubToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [github-tokens]
      operationId: createGithubToken
      summary: 添加 GitHub Token
      description: |
        同一用户下明文完全相同（SHA-256 指纹一致）的 Token 复用已有记录：返回已有记录，
        不修改其标题。新建成功后服务端立即做一次只读检测（GET /user）；检测失败
        （网络 / GitHub 5xx）或凭证无效（401）仍然保存，响应中 detection_status
        为 failed / invalid，HTTP 状态仍是 200。
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGitHubTokenRequest'
      responses:
        '200':
          description: 保存成功（明文重复时返回已有记录）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GitHubToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/github-tokens/{id}:
    put:
      tags: [github-tokens]
      operationId: updateGithubToken
      summary: 修改标题或替换密钥
      description: |
        改标题不重新检测。替换密钥即对所有引用该 Token 的项目一起生效；
        新明文与同用户另一条记录指纹重复时返回 40914（消息指向已有记录），
        不做隐式合并。替换按加载时的指纹条件写入，并发替换返回 40915。
        替换后服务端重新检测。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGitHubTokenRequest'
      responses:
        '200':
          description: 更新后的 Token 记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GitHubToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 新明文与同用户另一条记录重复（40914）；并发替换时密钥已变（40915）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [github-tokens]
      operationId: deleteGithubToken
      summary: 删除 GitHub Token
      description: 仍被任何项目（任一用途）引用时返回 40913，需先解除或更换引用；删除项目不影响 Token 库。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Token 仍被项目引用（40913）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/github-tokens/{id}/detect:
    post:
      tags: [github-tokens]
      operationId: detectGithubToken
      summary: 手动刷新检测
      description: 对该 Token 做一次只读检测（GET https://api.github.com/user），刷新检测状态与权限摘要；不创建任何 GitHub 资源。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
      responses:
        '200':
          description: 检测完成后的 Token 记录（检测失败时 detection_status=failed，仍是 200）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GitHubToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/members:
    get:
      tags: [members]
      operationId: listMembers
      summary: 列出全部成员
      description: |
        仅管理员（JWT + RequireAdmin，非管理员 40305；API Key 一律 40301）。
        返回全部用户，按 `created_at` 升序（首个用户=最早的 admin 排最前）。
        形状与 `User` 一致，含 `role`。
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 成员列表（created_at 升序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员（40305）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/members/{uid}/role:
    put:
      tags: [members]
      operationId: updateMemberRole
      summary: 修改成员角色
      description: |
        仅管理员。`role` 只接受 `admin` / `member`（其他值 40001）。
        把最后一个管理员降级为 member 返回 40931（判定在事务内：
        `count(role='admin')=1` 且目标当前是 admin）。目标不存在 40400。
      security:
        - jwtAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          description: 目标用户 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: 修改后的成员
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Member'
        '400':
          description: role 取值非法（40001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员（40305）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 用户不存在（40400）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 不能降级最后一个管理员（40931）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/invites:
    get:
      tags: [members]
      operationId: listInvites
      summary: 列出全部邀请
      description: |
        仅管理员。返回全部邀请，按 `created_at` 倒序；不返回 token 明文，
        只回状态（撤销/使用时间）。明文 token 只在创建响应里出现一次。
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 邀请列表（created_at 倒序，不含 token）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员（40305）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [members]
      operationId: createInvite
      summary: 创建注册邀请
      description: |
        仅管理员。签发一次性邀请：明文 token（`GenerateApiKeyRaw` 随机串）只在
        本次响应返回一次，库里只存 SHA-256；`url` 由前端用 public_url 或
        `window.location.origin` 自行拼接（`/register?invite=<token>`），服务端不回 url。
        `expires_in_hours` 省略时默认 72，允许 1..720，越界 40001。
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '200':
          description: 创建成功，返回邀请与一次性 token 明文
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreatedInvite'
        '400':
          description: expires_in_hours 越界（40001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员（40305）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/invites/{id}:
    delete:
      tags: [members]
      operationId: revokeInvite
      summary: 撤销邀请
      description: |
        仅管理员。置 `revoked_at`；幂等——已撤销的邀请再次撤销仍返回 200。
        邀请 ID 不存在返回 40432。
      security:
        - jwtAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 邀请 ID
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员（40305）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 邀请不存在（40432）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/deployment/settings:
    get:
      tags: [deployment]
      operationId: getDeploymentSettings
      summary: 读取部署设置（当前生效的 public_url 及来源）
      description: |
        仅 JWT（所有登录用户可读）。`public_url` 是当前生效值（trim 且去尾部 `/`）；
        `public_url_source` 说明它的来源：`database`=部署设置里保存的值（优先），
        `config`=config.yaml 的 `server.public_url` 兜底（数据库值为空串时），
        `none`=两处都没有。
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 部署设置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeploymentSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [deployment]
      operationId: updateDeploymentSettings
      summary: 保存部署设置（public_url）
      description: |
        仅管理员。校验规则：空串表示清空数据库值（回落 config）；
        其余必须是 http(s) 绝对 URL、host 非空、不能带 query 或 fragment，
        末尾 `/` 会被去掉；不合法返回 40001。写入数据库后回读返回。
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeploymentSettingsRequest'
      responses:
        '200':
          description: 保存后的部署设置（回读）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeploymentSettings'
        '400':
          description: public_url 不合法（40001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员（40305）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/deployment/github-app:
    get:
      tags: [deployment]
      operationId: getGitHubAppDeployment
      summary: 读取部署级 GitHub App 配置（所有登录用户）
      description: |
        INT-129 B 轮实现。返回本部署当前生效的 GitHub App 身份投影：
        是否已配置、来源（数据库 > config > 未配置）、webhook URL 与安装链接等；
        私钥与 webhook 密钥本体永不回显，只回「是否已设置」。
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 部署级 GitHub App 配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GitHubAppDeployment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [deployment]
      operationId: updateGitHubAppDeployment
      summary: 手动配置部署级 GitHub App
      description: |
        仅管理员（B 轮实现）：「手动配置（已有 App）」折叠区的保存入口。
        app_id 必填；private_key_pem / webhook_secret 省略表示保留已有值，
        首次配置必须提供私钥。凭证加密落库；保存后立即生效，无需重启。
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGitHubAppDeploymentRequest'
      responses:
        '200':
          description: 保存后的配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GitHubAppDeployment'
        '400':
          description: App ID 缺失或非数字（40001）、私钥不是有效 RSA PEM（40001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员（40305）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/deployment/github-app/test:
    post:
      tags: [deployment]
      operationId: testGitHubAppDeployment
      summary: 测试部署级 GitHub App 连接（仅管理员）
      description: |
        B 轮实现。对本部署生效的 App 身份做一次只读检测（用 App 私钥签 JWT 调
        `GET /app`）：`ok`=认证成功，`invalid`=GitHub 拒绝该身份（401），
        `failed`=网络/限流/GitHub 5xx。未配置时返回 40006。
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 检测后的配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GitHubAppDeployment'
        '400':
          description: 尚未配置 GitHub App（40006）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员（40305）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/deployment/github-app/manifest:
    post:
      tags: [deployment]
      operationId: createGitHubAppManifest
      summary: 生成 GitHub App Manifest（仅管理员）
      description: |
        B 轮实现。「在 GitHub 上创建 App」主按钮的第一步：服务端按本部署的
        public_url 组装 manifest（原样 POST 给 GitHub 的形状），返回 GitHub
        创建页地址、防 CSRF 的 state 与 manifest 本体；前端以表单 POST 跳转
        `action_url`。填了 `org` 时创建页指向该组织的 Apps 设置。
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubAppManifestRequest'
      responses:
        '200':
          description: Manifest 与跳转信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GitHubAppManifestResponse'
        '412':
          description: 尚未配置 public_url，无法组装 Manifest（41202）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员（40305）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/deployment/github-app/manifest/complete:
    post:
      tags: [deployment]
      operationId: completeGitHubAppManifest
      summary: 完成 Manifest 创建（GitHub 回跳后换取凭证，仅管理员）
      description: |
        B 轮实现。GitHub 创建 App 后回跳 `/settings/integrations/github/callback?code&state`，
        前端带 JWT 把 code/state 交给本端点：服务端用 code 向 GitHub 换 App 凭证，
        加密落库为部署级身份并返回配置投影。失败时前端显示明确文案与「重新创建」。
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteGitHubAppManifestRequest'
      responses:
        '200':
          description: 完成后的部署级 GitHub App 配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GitHubAppDeployment'
        '400':
          description: 创建流程已过期或已失效（40009，state 不存在/过期/重放/换管理员）；GitHub 授权码已过期或已被使用（40010）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员（40305）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: GitHub App Manifest 转换失败（50205）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/deployment/integrations:
    get:
      tags: [deployment]
      operationId: listForgeIntegrations
      summary: 列出部署级代码仓集成（仅管理员）
      description: |
        INT-166 实现。首条恒为内置 `github-default`（只读映射到部署级 GitHub App
        配置，builtin=true），后接 forgejo 集成行。token 与 webhook_secret 本体
        永不回显，只回「是否已设置」标记。
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 集成列表（首条 github-default）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ForgeIntegration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员（40305）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [deployment]
      operationId: createForgeIntegration
      summary: 新建 forgejo 集成（仅管理员）
      description: |
        仅管理员。本期只接受 forgejo 种类（内置 GitHub App 走 deployment/github-app
        端点，请求不设 kind 字段）。base_url 必填并做 SSRF 校验（含保存时 DNS
        解析校验）；api_base_url 省略时按 `{base_url}/api/v1` 推导；token 必填
        （仓库范围 PAT）；webhook_secret / ca_cert_pem 可选；token 与
        webhook_secret 加密落库、永不回显。allow_private_network=true 放行该
        集成配置主机解析到私网地址（http 基址同样只在开启时可用）。
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateForgeIntegrationRequest'
      responses:
        '200':
          description: 创建后的集成投影
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ForgeIntegration'
        '400':
          description: 参数缺失或非法（40001）：name/token 缺失、基址不是合法 https 绝对 URL、基址解析到内网地址、CA PEM 不可解析等
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非管理员（40305）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/deployment/integrations/{id}:
    get:
      tags: [deployment]
      operationId: getForgeIntegration
