  /api/projects/{id}/screenshots:
    post:
      tags: [screenshots]
      operationId: uploadScreenshot
      summary: 上传界面截图（multipart/form-data，字段名 file + screen_key）
      description: |
        multipart 字段：`file`（必填；内容嗅探须为 image/png、image/jpeg、image/webp、image/gif，大小受服务端 upload.max_file_size 限制）、
        `screen_key`（必填；服务端按 ToLower+TrimSpace 规范化，规范化后须 1~100 字符，否则 40001）、
        `title`/`platform`/`locale`/`theme`（可选）。
        (project_id, screen_key, platform, locale, theme) 定位一张截图（NULL 与 NULL 视为相等）：
        已存在即覆盖——替换文件、更新宽高/大小/上传时间/上传者，不新增行；不存在则新建。
        表单字段存在性语义：`platform`（trim+小写化，开放词表；空串=清除为未标注）、`locale`（BCP 47 规范化，非法值 40001；空串=清除）、
        `theme`（严格 light|dark，其他值 40001；空串=清除）字段出现才生效，不出现保持原值——按同 screen_key 既有截图继承缺席维度；
        已给出的维度能唯一命中才继承，命中多个变体（省略无法定位唯一目标）返回 40001，零个命中按缺席维度新建；`title` 非空才更新。
        覆盖后该截图上全部 open 标注置为 outdated（待确认）；「确认保留」清零。
        `uploaded_by` 由服务端按凭证自动记录（用户名，或 "API Key: <name>"）。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, screen_key]
              properties:
                file:
                  type: string
                  format: binary
                  description: 截图文件；内容须为 image/png、image/jpeg、image/webp、image/gif
                screen_key:
                  type: string
                  description: 界面标识；规范化后 1~100 字符
                title:
                  type: string
                  maxLength: 200
                  description: 界面标题（≤200 字符）；非空才更新
                platform:
                  type: string
                  maxLength: 100
                  description: 平台（开放词表，trim+小写，≤100 字符）；字段出现即生效（空串清除为未标注）
                locale:
                  type: string
                  description: 语言（BCP 47，服务端规范化大小写，非法值 40001）；字段出现即生效（空串清除）
                theme:
                  type: string
                  enum: [light, dark]
                  description: 亮度主题（严格 light|dark，其他值 40001）；字段出现即生效（空串清除）
      responses:
        '200':
          description: 上传结果（screen 为新建或覆盖后的截图）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScreenshotUploadResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/RequestEntityTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [screenshots]
      operationId: listScreenshotScreens
      summary: 列出项目全部截图（uploaded_at 倒序）
      description: |
        可选 query 过滤：`platform`/`locale`/`theme`（逗号分隔多值，OR 语义；值 `__none__` 表示「未标注」桶即 NULL，可与其他值混用，可组合）。
        每项为截图字段 + 文件信息 + content_url。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: platform
          in: query
          required: false
          schema:
            type: string
          description: 逗号分隔多值；`__none__` 表示未标注（NULL）
        - name: locale
          in: query
          required: false
          schema:
            type: string
          description: 逗号分隔多值；`__none__` 表示未标注（NULL）
        - name: theme
          in: query
          required: false
          schema:
            type: string
          description: 逗号分隔多值（light/dark）；`__none__` 表示未标注（NULL）
      responses:
        '200':
          description: 截图列表（data 为 {items}，非分页信封）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ScreenshotScreen'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/screenshot-screens/{sid}:
    patch:
      tags: [screenshots]
      operationId: updateScreenshotScreen
      summary: 更新截图标题/平台/语言/亮度（仅 JWT）
      description: |
        四字段均为可选指针字段：字段出现才更新（三个维度允许空串清除为未标注），都不传返回 40001。
        platform 非法长度、locale 非法 BCP 47、theme 非 light|dark 返回 40001；
        改出的 (screen_key, platform, locale, theme) 组合与项目内已有截图撞唯一约束返回 409（40921）。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotScreenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScreenshotScreenRequest'
      responses:
        '200':
          description: 更新后的截图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScreenshotScreen'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [screenshots]
      operationId: deleteScreenshotScreen
      summary: 删除截图及其文件与全部标注
      description: "支持 Authorization 头携带 JWT 或 API Key。删除为硬删除：级联删除该截图上的全部标注（FK CASCADE），并在事务提交后清理磁盘文件；截图不存在或属于其他用户时一律按不存在处理（40413）。"
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotScreenId'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/screenshot-screens/{sid}/content:
    get:
      tags: [screenshots]
      operationId: getScreenshotScreenContent
      summary: 获取截图图片内容
      description: "返回图片二进制内容（存储时嗅探的 mime type，`Content-Disposition: inline`，`Cache-Control: private, max-age=300`——缓存键是含 `?v=` 修订参数的完整 URL，覆盖上传推进 v 即自然失效）。支持 Authorization 头或 `?token=` query 凭证（供 `<img>` 直链）。同一路径另注册 HEAD 变体，语义同 GET 但不返回 body。"
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotScreenId'
        - $ref: '#/components/parameters/QueryToken'
      responses:
        '200':
          description: 图片二进制内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    head:
      tags: [screenshots]
      operationId: getScreenshotScreenContentHead
      summary: 获取截图图片头信息（HEAD）
      description: 与 GET 语义相同但不返回 body。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotScreenId'
        - $ref: '#/components/parameters/QueryToken'
      responses:
        '200':
          description: 仅响应头
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{id}/screenshot-annotations:
    get:
      tags: [screenshots]
      operationId: listScreenshotAnnotations
      summary: 列出项目全部截图标注（可按状态 / 过期 / 维度 / Issue / 截图过滤）
      description: |
        返回项目下截图标注，按创建先后升序。
        可选 query 过滤：`status`（open/resolved，缺省返回全部；非法值 40001）、`outdated`（true/false）、
        `issue_id`、`screen_id`（精确匹配）、`platform`/`locale`/`theme`（逗号分隔多值，OR 语义；
        值 `__none__` 表示「未标注」桶即截图维度为 NULL，可与其他值混用），全部可组合。
        每条标注返回：原图地址（image_url，即所在截图的 content_url）、比例坐标（x/y/width/height，0~1）、
        像素坐标（pixel_rect；原图尺寸未知时为 null）、文字、状态、是否过期（outdated，截图被覆盖更新后未确认）、
        所属截图（screen_key/screen_title/screen_platform/screen_locale/screen_theme）、
        关联 Issue（issue_id/issue_reference/issue_title，未关联均为 null）与裁剪图地址（crop_url）。
        删除截图会级联删除其上标注；删除 Issue 只解除关联不删标注。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ScreenshotAnnotationStatus'
          description: 按状态过滤；缺省返回全部状态
        - name: outdated
          in: query
          required: false
          schema:
            type: boolean
          description: 按过期标记过滤；true=仅过期（待确认），false=仅未过期
        - name: issue_id
          in: query
          required: false
          schema:
            type: string
          description: 只返回关联该 Issue 的标注（UUID）
        - name: screen_id
          in: query
          required: false
          schema:
            type: string
          description: 只返回该截图上的标注
        - name: platform
          in: query
          required: false
          schema:
            type: string
          description: 逗号分隔多值；`__none__` 表示未标注（NULL）
        - name: locale
          in: query
          required: false
          schema:
            type: string
          description: 逗号分隔多值；`__none__` 表示未标注（NULL）
        - name: theme
          in: query
          required: false
          schema:
            type: string
          description: 逗号分隔多值（light/dark）；`__none__` 表示未标注（NULL）
      responses:
        '200':
          description: 标注列表（data 为 {items}，非分页信封）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ScreenshotAnnotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{id}/screenshot-annotations/batch:
    post:
      tags: [screenshots]
      operationId: batchScreenshotAnnotations
      summary: 批量处理当前过滤范围内的标注（仅 JWT）
      description: |
        对 `filter` 圈定的标注集执行同一动作。`action=confirm`（确认保留：清除 outdated，
        仅作用于 open 标注）或 `action=resolve`（标记已解决：置 status=resolved 并记录 resolved_at，
        仅作用于 open 标注）。filter 字段均可选，缺省即不限制；返回实际更新的标注数。
        API Key 调用返回 403（40301）——API Key 只能逐条把标注置 resolved，没有批量能力。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreenshotAnnotationBatchRequest'
      responses:
        '200':
          description: 批量处理结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScreenshotAnnotationBatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/screenshot-screens/{sid}/annotations:
    post:
      tags: [screenshots]
      operationId: createScreenshotAnnotation
      summary: 在截图上新建矩形标注（仅 JWT）
      description: |
        在指定截图上创建「矩形框 + 文字」标注。坐标为图片宽高比例（0~1）：
        x/y 为左上角，width/height 为尺寸；须满足 0 ≤ x,y、0 < width,height、x+width ≤ 1、y+height ≤ 1，否则 40001。
        `issue_id` 可选：缺省或空串表示不关联；提供时须为同一项目内的 Issue（不存在或跨项目返回 40001）。
        API Key 调用返回 403（40301）。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotScreenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScreenshotAnnotationRequest'
      responses:
        '200':
          description: 新建成功的标注
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScreenshotAnnotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/screenshot-annotations/{aid}:
    put:
      tags: [screenshots]
      operationId: updateScreenshotAnnotation
      summary: 更新标注文字 / 状态 / 关联 Issue
      description: |
        指针语义：字段出现才更新，未出现保持原值；三个字段都不传返回 40001。
        `issue_id` 传空串表示解除关联，非空须为同一项目内的 Issue（否则 40001）；JSON null 与未传同义（保持）。
        权限分工：JWT 可更新全部字段；API Key 只允许传 `status: "resolved"`（把标注标为已解决），
        携带 body/issue_id 或传 `status:"open"` 重开均返回 403（40301）。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotAnnotationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScreenshotAnnotationRequest'
      responses:
        '200':
          description: 更新后的标注
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScreenshotAnnotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [screenshots]
      operationId: deleteScreenshotAnnotation
      summary: 删除标注（仅 JWT）
      description: 重复删除返回 404（40416），非幂等。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotAnnotationId'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/screenshot-annotations/{aid}/crop:
    get:
      tags: [screenshots]
      operationId: getScreenshotAnnotationCrop
      summary: 获取标注框选区域裁剪图（统一 PNG）
      description: |
        按标注比例坐标换算像素矩形，向外扩约矩形短边 15% 的外边距（最小 8px，不超出图片边界），统一输出 PNG。
        源图为 WebP 时服务端解码；GIF 取第一帧。典型用途：AI 拉取裁剪图比对修改，或前端缩略展示。
        支持 Authorization 头或 `?token=` query 凭证（供 `<img>` 直链）。同一路径另注册 HEAD 变体。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotAnnotationId'
        - $ref: '#/components/parameters/QueryToken'
      responses:
        '200':
          description: PNG 图片二进制内容
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    head:
      tags: [screenshots]
      operationId: getScreenshotAnnotationCropHead
      summary: 获取标注裁剪图头信息（HEAD）
      description: 与 GET 语义相同但不返回 body。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotAnnotationId'
        - $ref: '#/components/parameters/QueryToken'
      responses:
        '200':
          description: 仅响应头
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/reviews:
    get:
      tags: [reviews]
      operationId: listReviewProjects
      summary: 列出当前用户的审查总览
      description: |
        返回当前用户所有已关联 GitHub 仓库的项目。同仓库已被其他项目开启审查时，
        该行 `taken_by` 返回占用者登录名且 `can_manage=false`。
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 审查总览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ReviewProjectSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/reviews/pull-requests:
    get:
      tags: [reviews]
      operationId: listReviewPullRequests
      summary: 跨项目 PR 审查动态
      description: |
        以当前用户已开启审查的项目（`enabled=true`）的总账行为范围，服务端算好
        分组（进行中 / 需要处理 / 最近通过）、阶段进度、发现计数与待处理原因。
        `counts`/`total` 是过滤范围内全量 PR 的统计，`items` 按 `offset`/`limit`
        切片。动作未勾选导致新 head 没有任何运行的 PR 不返回；通过且最后一轮
        完成时间早于 7 天前的 PR 不返回。
      security:
        - jwtAuth: []
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: string
          description: 项目 ID（UUID，可选；必须属于当前用户，否则 40401）
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: 返回的 PR 数量上限
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: 分页偏移
      responses:
        '200':
          description: PR 审查动态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReviewPullRequestActivityPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/reviews/pull-requests/{prNumber}:
    get:
      tags: [reviews]
      operationId: getReviewPullRequestDetail
      summary: 单个 PR 的审查详情（轮次 → 各组合运行 → 发现列表）
      description: |
        与项目审查记录同结构，另带每轮 `trigger_action` 与每运行的完整
        `findings`/`unmeasurable`。项目必须属于当前用户（40401）；项目有设置行
        且按设置行仓库匹配的账本行存在，否则 40434。不要求项目已开启审查
        （停用项目仍可查看历史详情）。
      security:
        - jwtAuth: []
      parameters:
        - name: prNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: PR 编号
        - name: project_id
          in: query
          required: true
          schema:
            type: string
          description: 项目 ID（UUID，必填）
      responses:
        '200':
          description: PR 审查详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReviewPullRequestRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 项目不存在（40401）或审查 PR 记录不存在（40434）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{id}/review-settings:
    get:
      tags: [reviews]
      operationId: getProjectReviewSettings
      summary: 读取项目审查设置
      description: |
        `prerequisites` 逐条列出开启审查的前置条件，`missing=true` 的项不允许开启。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 审查设置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReviewSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [reviews]
      operationId: updateProjectReviewSettings
      summary: 保存项目审查设置（全量替换）
      description: |
        启用时必须满足全部前置条件、绑定 Token、所选环境属于当前用户且已绑定该项目，
        代码审查组合 1–5 个、视觉审查组合 0–3 个，同一组合不得重复。
        同一仓库已被其他项目开启时返回 40922。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewSettingsInput'
      responses:
        '200':
          description: 保存后的设置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReviewSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 同一仓库已被其他项目开启（40922）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '412':
          description: 前置条件缺失（41202），message 内含逐条缺项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{id}/review-records:
    get:
      tags: [reviews]
      operationId: listProjectReviewRecords
      summary: 列出项目审查记录
      description: |
        按最近更新时间倒序列出 PR，每个 PR 内嵌轮次与各组合运行（可跳 T3 线程）。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 返回的 PR 数量上限
      responses:
        '200':
          description: 审查记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ReviewPullRequestRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{id}/reviews/rerun:
    post:
      tags: [reviews]
      operationId: rerunProjectReview
      summary: 对 PR 的实时 HEAD 重跑代码审查
      description: |
        用 GitHub App 令牌实时取 PR 当前 head；旧 SHA 未终态运行一律取消。
        项目未开启审查时返回 40923。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pr_number]
              properties:
                pr_number:
                  type: integer
                  minimum: 1
                repo_full_name:
                  type: string
                  description: |
                    记录所属仓库（审查记录里回传）。项目仓库改过之后，历史记录会属于
                    旧仓库；带上它可避免把同号的无关 PR 当成本项目的 PR 重跑。
                    与项目当前仓库不一致时返回 400。
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [accepted, head_sha, round_number]
                        properties:
                          accepted:
                            type: boolean
                          head_sha:
                            type: string
                          round_number:
                            type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 项目未开启审查（40923）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'


