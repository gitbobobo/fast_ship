              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/T3DispatchResult'
        '400':
          description: 参数无效（40001，如 decision/answers 非法）
          content:
