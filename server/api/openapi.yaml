  /api/environments/{id}/attachments/{attachmentId}/content:
    get:
      tags: [environments]
      operationId: getT3AttachmentContent
      summary: 读取 T3 附件内容（Fast Ship 代理字节）
      description: |
        经 WS RPC `assets.createUrl`（resource=_tag:"attachment"）取得签名下载
        URL，再由 Fast Ship 拉取字节并原样代理给浏览器（带上游 Content-Type）。
        字节不落盘。附件不存在或上传已过期返回 40417 语义之外的 40418；
        上游未就绪返回 50202。
      parameters:
        - $ref: '#/components/parameters/T3EnvironmentId'
        - $ref: '#/components/parameters/T3AttachmentId'
      responses:
        '200':
          description: 附件字节（Content-Type 为图片 MIME）
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: 环境不存在（40417）或附件不存在/已过期（40418）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: T3 环境调用失败（50202）
          content:
            application/json:
