      summary: 预约发货后钩子（仅 JWT；整体覆盖）
      description: 配置该 Issue 所属项目下一次任意版本成功发货后执行的一次性动作；三类动作至少启用一个。comment_body 中 `{version}`、`{release_url}` 占位符在发货时替换。
