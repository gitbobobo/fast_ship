      operationId: revokeBotAuthorization
      summary: 撤销授权（实际撤销，不物理删除）
      description: |
        撤销只写 revoked_at，保留审计关联。撤销对尚未认领的授权调用生效
        （回到待确认）；已经开始的操作不回滚。重复撤销幂等。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
        - name: authorizationId
          in: path
          required: true
