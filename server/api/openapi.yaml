        - name: project_id
          in: query
          schema:
            type: string
            description: T3 项目 ID
        - name: status
          in: query
          schema:
            type: string
            description: 过滤线程状态（running / waiting / idle / archived）
        - name: settled
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: 线程列表与各环境诊断（口径同 GET /api/threads，仅追加过滤）
          content:
            application/json:
              schema:
                allOf:
