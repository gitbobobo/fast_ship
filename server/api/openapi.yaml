openapi: "3.0.3"
info:
  title: "Fast Ship API"
  version: "0.1.42"
  license:
    name: MIT
  description: |
    Fast Ship 项目管理工具的 HTTP API。覆盖 `server/internal/router/router.go` 注册的全部 /api 路由；
    SPA 静态资源与 NoRoute 回退（`web.go`）不在本文档范围。

    约定：
    - 所有 JSON 响应统一信封 `{code, message, data}`：`code=0` 成功；非 0 为业务错误码，`data` 为 null。
    - 认证方式为 `Authorization: Bearer <token>`；token 为 JWT（登录/注册签发）或 `fsk_` 开头的 API Key，服务端按前缀区分。
    - 部分二进制资源端点（头像、Issue 图片、安装包下载、GitHub 媒体代理）额外接受 `?token=<token>` query 凭证。
    - 除特别注明外，字段级权限写在各字段 description 中：「仅 JWT」表示 API Key 携带该字段会返回 403（40301）；「仅 API Key」表示 JWT 调用返回 403（40303）。
servers:
  - url: /
    description: 与后端服务同源
tags:
  - name: auth
    description: 注册、登录、Token 与当前用户
  - name: users
    description: 用户资源（头像等）
  - name: ai
    description: AI 设置、标题/清单生成与全局提示词
  - name: api-keys
    description: API Key 管理（仅 JWT）
  - name: github-tokens
    description: 用户级 GitHub Token 库（仅 JWT）
  - name: projects
    description: 项目 CRUD 与 GitHub 分支
  - name: versions
    description: 版本 CRUD、前置校验与发货
  - name: issues
    description: Issue CRUD、过滤、同步、清单、发货钩子与图片附件
  - name: collab
    description: Issue 人机协作区（consensus / summary）
  - name: recommendations
    description: Agent 推荐任务队列
  - name: artifacts
    description: 版本安装包上传、下载与删除
  - name: attachments
    description: Issue 文件附件（独立于正文图片 assets）上传、下载与删除
  - name: logs
    description: 日志分片上传与查询
  - name: documents
    description: 项目文档
  - name: dashboard
    description: 看板概览
  - name: media
    description: GitHub 媒体代理
  - name: screenshots
    description: 项目截图库（每变体一张图，覆盖上传即替换文件，只保留最新版）
  - name: environments
    description: T3 环境连接与 T3 客户端操作（配对、线程读取/发消息/停止/队列、审批与提问应答、图片附件；仅 JWT，INT-82/INT-85）。例外：t3-projects 发现与项目 t3-bindings 对 API Key 开放（INT-89）
  - name: reviews
    description: PR 审查（INT-135，仅 JWT）：项目级审查设置、审查总览与审查记录查询
  - name: notifications
    description: 站内通知（只用于审查系统故障：派发失败、超时、工作区回收失败；仅 JWT）
  - name: review-agent
    description: 审查运行令牌专用的 Agent 读取与结论提交端点（仅 runTokenAuth，INT-135）
  - name: self-logs
    description: Fast Ship 自身日志查询（只读，INT-94）：slog 结构化采集、独立 SQLite 日志库存储，JWT 与 fsk_ API Key 可查本人归属及显式系统行（无主行默认不可见）；供代理排查 Fast Ship 自身问题
  - name: bots
    description: 内置机器人（智能体，INT-101，仅 JWT）：用户自带 OpenAI 兼容 key，机器人经白名单工具操作项目/Issue/已连接环境与线程。管理、主线消息、运行、调用、确认授权与 SSE 全部仅 JWT；key 全链路脱敏只回末四位。INT-133 起地址与密钥改存到 AI 提供商，bot 只存引用
  - name: ai-providers
    description: AI 提供商（INT-133，仅 JWT）：按用户隔离的「地址 + 密钥」配置，可被多个机器人引用；内置 models.dev 目录（OpenAI 兼容 + 有 api 地址 + 模型支持 tool_call 的子集，随发版刷新）用于选择提供商与模型。key 全链路脱敏只回末四位
  - name: quota
    description: 订阅套餐额度（INT-109）：粘贴凭据后服务端定时抓取各 AI 编码服务订阅额度并只读展示。管理端点仅 JWT；GET /api/quota/accounts 对 JWT 与 API Key 均开放（只读，机器人取数通道）
  - name: members
    description: 成员与邀请管理（INT-129，仅管理员 = JWT + RequireAdmin，40305）：成员列表与改角色、邀请的创建/列表/撤销；公开侧的邀请校验在 auth 组
  - name: deployment
    description: 部署设置（INT-129）：public_url 网页配置（GET 仅 JWT，PUT 仅管理员）与部署级 GitHub App（B 轮实现：每套部署一个 App、Manifest 一键创建；GET 所有登录用户，其余仅管理员）

paths:
  /api/environments:
    get:
      tags: [environments]
      operationId: listT3Environments
      summary: 列出已配对的 T3 环境并探测状态
      description: |
        有界并行逐个环境探测（`GET {address}/api/auth/session`，单请求同时回答可达性与凭证有效性，
        单环境独立预算，坏环境不拖垮其它环境）：
        `ok`=Bearer 会话有效；`unreachable`=网络不可达/超时/5xx；`repair`=可达但凭证失效（需重新配对）；
        `degraded`=可达且凭证有效，但部分数据读取失败（如归档快照），其余数据仍返回。
        响应不包含任何凭证字段。
      responses:
        '200':
          description: 环境列表（含探测状态）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/T3Environment'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [environments]
      operationId: createT3Environment
      summary: 通过配对链接新增 T3 环境
      description: |
        解析配对链接（支持 `t3 pair` 直接链接 `https://host/#token=...` 与 hosted 包装链接
        `https://relay/?host=<backend>&token=...`），用一次性配对码向 T3 服务端
        `POST /oauth/token` 换取 Bearer 会话并加密落库。请求不携带 `scope`：
        T3 服务端按配对链接的授权授予完整 scope（标准客户端含 `orchestration:read`
        与 `orchestration:operate`），授予的 scope 原样落库并在响应 `scopes`/`access`
        中带回。配对码一次性，不落库。旧环境（只读会话）不自动升级，重新配对后
        `access` 变为 `operate`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateT3EnvironmentRequest'
      responses:
        '200':
          description: 创建成功，返回带探测状态的环境
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/T3Environment'
        '400':
          description: 配对链接无效或缺少配对码（40005）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 环境名称已存在（40912）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: 配对失败（上游拒绝/不可达/scope 超宽）（50202）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/environments/{id}:
    put:
      tags: [environments]
      operationId: updateT3Environment
      summary: 改名或重新配对
      description: |
        指针语义：字段出现才更新。`pairing_url` 出现时重新走配对流程，
        覆盖地址与 Bearer（用于修复 `repair` 状态，同时把只读旧会话升级为
        可操作会话）；两个都不传返回 40001。
        改名与重配按字段条件更新：并发改名/重配互不覆盖；环境被并发删除时
        返回 40417 且不复活记录；并发改名触发唯一索引冲突时返回 40912。
      parameters:
        - $ref: '#/components/parameters/T3EnvironmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateT3EnvironmentRequest'
      responses:
        '200':
          description: 更新成功，返回带探测状态的环境
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/T3Environment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 环境不存在（40417）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 环境名称已存在（40912）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: 重新配对失败（50202）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [environments]
      operationId: deleteT3Environment
      summary: 删除环境
      description: |
        删除本地记录。注意：T3 协议的会话自吊销端点（`/api/auth/clients/revoke`）
        需要 `access:write` scope，Fast Ship 的会话没有该 scope，协议上不存在
        自吊销路径；Bearer 由 T3 服务端按 `expires_in` 自行过期；如需立即吊销
        请在 T3 侧的访问设置中操作。
      parameters:
        - $ref: '#/components/parameters/T3EnvironmentId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: 环境不存在（40417）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/environments/t3-projects:
    get:
      tags:
        - environments
      operationId: listT3EnvironmentProjects
      summary: 列出各环境的 T3 项目（绑定用只读发现）
      description: |
        逐环境实时拉取 T3 项目表（WS shell 快照 projects，活跃 + 归档去重合并）：
        多环境有界并行、各自超时预算；单环境失败只标在该环境的
        `status`/`error` 上，不影响其他环境的结果。响应不含凭证字段。
        与项目的 `t3-bindings` 读写端点一起，是仅有的对 API Key 开放的
        T3 面（INT-89）；线程读写、配对、附件等其余 T3 端点仍仅 JWT。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: 各环境及其 T3 项目列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/T3EnvironmentProjects'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: 内部错误（50000）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/environments/{id}/threads/{threadId}:
    get:
      tags: [environments]
      operationId: getT3Thread
      summary: 读取单个线程的完整归一化时间线（含队列与活动状态）
      description: |
        通过 T3 的 `GET /api/orchestration/threads/{threadId}` HTTP 快照端点取完整投影
        （WS 侧同名为分页受限窗口，不满足「完整历史」要求），按投影的
        `visibleTurnItems`（含 fork 继承前缀、已排除回滚/被取代条目）归一化为
        ThreadItem 列表；条目 ID 由 `sourceThreadId + "::" + T3 原始条目 id` 合成。
        长消息不截断；命令输出/工具输出/subagent 结果在 wire 投影中被上游裁剪，
        `detail_available=true` 的条目经 items/{itemId} 端点补读。
        结构性事件（checkpoint 等）被丢弃。审批/提问/secret 请求条目经投影
        `runtimeRequests` 补齐状态与应答能力。响应另含 `queue`（排队消息工作流，
        口径对齐 T3 `deriveThreadQueueWorkflowState`）与 `activity`（活动 run、
        停止中、待处理请求）。排队消息开始前没有 turn item，出现在 `queue.items`。
      parameters:
        - $ref: '#/components/parameters/T3EnvironmentId'
        - $ref: '#/components/parameters/T3ThreadId'
      responses:
        '200':
          description: 线程详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/T3ThreadDetail'
        '404':
          description: 环境不存在（40417）或线程不存在（40418）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: T3 环境调用失败（50202，含凭证失效提示）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/environments/{id}/threads/{threadId}/items/{itemId}:
    get:
      tags: [environments]
      operationId: getT3ThreadItem
      summary: 读取单个线程条目的完整正文（按需补读）
      description: |
        先取指定线程的可见时间线验证 `itemId` 是其成员（40419 = 不是成员），
        再从可信行自身派生 T3 `orchestration.getTurnItem` 参数（threadId/itemId
        取行内条目的持久身份；不接受前端指定来源或 RPC 方法），返回完整归一化
        ThreadItem：text 含命令 input+output / subagent prompt+result+progress /
        工具全量 input+output，summary 为单行短摘要，`detail_available=false`
        （已无可再取的正文）。上游对单条正文有 256KB 限界，截断后缀原样保留。
        `detail_available=false` 的条目直接返回快照形态，不发起补读。
      parameters:
        - $ref: '#/components/parameters/T3EnvironmentId'
        - $ref: '#/components/parameters/T3ThreadId'
        - $ref: '#/components/parameters/T3ThreadItemId'
      responses:
        '200':
          description: 完整条目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/T3ThreadItem'
        '404':
          description: 环境不存在（40417）、线程不存在（40418）或条目不属于该线程（40419）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: T3 环境调用失败（50202，含凭证失效提示）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/threads:
    get:
      tags: [environments]
      operationId: listT3Threads
      summary: 聚合当前用户全部 T3 环境的线程（实时转发，不落库）
      description: |
        多环境有界并行读取（并行度 4），不落库。每环境在独立预算内：
        先 `GET /api/auth/session` 分类凭证状态，再经 WS RPC
        `orchestration.subscribeShell` 取活跃快照、一次性 RPC
        `orchestration.getArchivedShellSnapshot` 取归档线程，随后立即断开；
        整轮有总预算（小于前端超时）。单环境失败或超时不阻塞其它环境，
        错误保留在 `environments` 数组的 `status/error` 中，健康环境的
        已读结果照常返回。列表排除 `lineage.relationshipToParent=subagent` 的
        子代理线程（与 T3 自身列表一致）。第一版返回完整轻量列表，
        筛选与分页由前端处理。
      responses:
        '200':
          description: 线程聚合与环境状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, environments]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/T3ThreadSummary'
                          environments:
                            type: array
                            items:
                              $ref: '#/components/schemas/T3Environment'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/environments/{id}/composer-options:
    get:
      tags: [environments]
      operationId: getT3ComposerOptions
      summary: 读取线程启动器选项（项目表 + 服务器配置 + 设置）
      description: |
        一次 WS 会话内取 T3 `orchestration.subscribeShell` 首快照（项目表）+
        `server.getConfig` + `server.getSettings`。`projects` 为归一化项目表
        （snake_case，含 workspace_root 供 workspace-options 解析 cwd）；
        `config`/`settings` 为上游 `server.getConfig`/`server.getSettings`
        响应原样透传（camelCase，字段随 T3 版本演进，客户端按需读取）。
      parameters:
        - $ref: '#/components/parameters/T3EnvironmentId'
      responses:
        '200':
          description: 启动器选项
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/T3ComposerOptions'
        '404':
          description: 环境不存在（40417）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: T3 环境调用失败（50202，含凭证失效提示）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/environments/{id}/projects/{projectId}/workspace-options:
    get:
      tags: [environments]
      operationId: getT3WorkspaceOptions
      summary: 读取线程工作区选项（当前分支 + 分支/引用列表）
      description: |
        项目与 cwd 从上游解析：先经 shell 快照找到该项目的 `workspaceRoot`，
        再在 T3 上执行 `vcs.refreshStatus`（当前分支、工作区状态）与
        `vcs.listRefs`（分支/引用分页列表，`query` 过滤、`cursor` 翻页）。
        不接受前端任意 cwd。新建 worktree 线程的 `base_ref` 默认取这里的
        `ref_name`（主检出当前分支）。
      parameters:
        - $ref: '#/components/parameters/T3EnvironmentId'
        - $ref: '#/components/parameters/T3ProjectId'
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
          description: 引用名过滤前缀（原样传给 vcs.listRefs）
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: 分页游标（来自上一页响应的 next_cursor）
      responses:
        '200':
          description: 工作区选项
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/T3WorkspaceOptions'
        '400':
          description: 参数无效（40001，如 cursor 非法）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 环境不存在（40417）或项目不在该环境（40401）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: T3 环境调用失败（50202）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/environments/{id}/threads:
    post:
      tags: [environments]
      operationId: createT3Thread
      summary: 在 T3 环境上启动新线程
      description: |
        经 WS RPC `orchestration.launchThread` 启动线程。thread_id 由 Fast Ship
        生成（稳定 UUID，重试幂等）；title 必填，缺省时从首条消息生成种子标题，
        并让 T3 生成正式标题（generateTitle=true）。runtime_mode 缺省
        full-access；interaction_mode 固定 default。workspace 省略时为项目主检出
        （root 不带 branch）；`worktree` 的 `base_ref` 缺省为主检出当前分支
        （经 vcs.refreshStatus 解析），`start_from_origin` 缺省取 T3 设置
        `newWorktreesStartFromOrigin`；`existing_worktree` 需给出已在 T3 侧
        注册的 worktree_path。项目必须属于该环境（project_id 来自
        composer-options），不接受前端任意 cwd。
      parameters:
        - $ref: '#/components/parameters/T3EnvironmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateT3ThreadRequest'
      responses:
        '200':
          description: 线程已启动
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/T3ThreadLaunchResult'
        '400':
          description: 参数无效（40001，如消息为空、工作区组合非法、图片不合规）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 该环境为只读会话（40300，重新配对后可操作）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 环境不存在（40417）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: T3 环境调用失败（50202）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/environments/{id}/threads/{threadId}/messages:
    post:
      tags: [environments]
      operationId: sendT3ThreadMessage
      summary: 向线程发送消息（活动运行时排队）
      description: |
        经 WS RPC `orchestration.dispatchCommand` 下发 `message.dispatch`，
        dispatchMode 固定 `{type:"queue_after_active"}`：线程空闲立即开始，
        活动中进入队列（线程详情的 queue 可见、可编辑/取消/上浮）。
        attachments 缺省按 `[]` 发送（上游要求字段为数组）。
        不支持 queued messages 的 provider 会话返回 50202（明确报告，
        不自动改用 steer）。
      parameters:
        - $ref: '#/components/parameters/T3EnvironmentId'
        - $ref: '#/components/parameters/T3ThreadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
