        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadLogsRequest'
      responses:
        '200':
          description: 上传结果（含 accepted_count 与 duplicate）
          content:
