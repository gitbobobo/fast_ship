        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 有活动运行（40919）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

