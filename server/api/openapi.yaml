          $ref: '#/components/responses/InternalError'

  /api/projects/{id}/screenshot-annotations:
    get:
      tags: [screenshots]
      operationId: listScreenshotAnnotations
      summary: 列出项目全部截图标注（可按状态 / Issue / 界面过滤）
      description: |
        返回项目下全部截图标注（含挂在旧版本上的），按创建先后升序。
        可选 query 过滤：`status`（open/resolved，缺省返回全部；非法值 40001）、`issue_id`、`screen_id`（精确匹配，可组合）。
        每条标注返回：原图地址（image_url，即所在版本的 content_url）、比例坐标（x/y/width/height，0~1）、
        像素坐标（pixel_rect；原图尺寸未知的存量版本为 null）、文字、所属画面（screen_key/screen_title/screen_group）、
        关联 Issue（issue_id/issue_reference/issue_title，未关联均为 null）、是否挂在界面最新版本（is_latest_version）
        与裁剪图地址（crop_url）。删除界面/版本会级联删除其上标注；删除 Issue 只解除关联不删标注。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ScreenshotAnnotationStatus'
          description: 按状态过滤；缺省返回全部状态
        - name: issue_id
          in: query
          required: false
          schema:
            type: string
          description: 只返回关联该 Issue 的标注（UUID）
        - name: screen_id
          in: query
          required: false
          schema:
            type: string
          description: 只返回该界面（含全部历史版本）上的标注
      responses:
        '200':
          description: 标注列表（data 为 {items}，非分页信封）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ScreenshotAnnotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/screenshot-versions/{vid}/annotations:
    post:
      tags: [screenshots]
      operationId: createScreenshotAnnotation
      summary: 在截图版本上新建矩形标注（仅 JWT）
      description: |
        在指定版本图片上创建「矩形框 + 文字」标注。坐标为图片宽高比例（0~1）：
        x/y 为左上角，width/height 为尺寸；须满足 0 ≤ x,y、0 < width,height、x+width ≤ 1、y+height ≤ 1，否则 40001。
        `issue_id` 可选：缺省或空串表示不关联；提供时须为同一项目内的 Issue（不存在或跨项目返回 40001）。
        API Key 调用返回 403（40301）。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScreenshotAnnotationRequest'
      responses:
        '200':
          description: 新建成功的标注
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScreenshotAnnotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/screenshot-annotations/{aid}:
    put:
      tags: [screenshots]
      operationId: updateScreenshotAnnotation
      summary: 更新标注文字 / 状态 / 关联 Issue
      description: |
        指针语义：字段出现才更新，未出现保持原值；三个字段都不传返回 40001。
        `issue_id` 传空串表示解除关联，非空须为同一项目内的 Issue（否则 40001）；JSON null 与未传同义（保持）。
        权限分工：JWT 可更新全部字段；API Key 只允许传 `status: "resolved"`（把标注标为已解决），
        携带 body/issue_id 或传 `status:"open"` 重开均返回 403（40301）。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotAnnotationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScreenshotAnnotationRequest'
      responses:
        '200':
          description: 更新后的标注
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScreenshotAnnotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [screenshots]
      operationId: deleteScreenshotAnnotation
      summary: 删除标注（仅 JWT）
      description: 重复删除返回 404（40416），非幂等。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotAnnotationId'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/screenshot-annotations/{aid}/crop:
    get:
      tags: [screenshots]
      operationId: getScreenshotAnnotationCrop
      summary: 获取标注框选区域裁剪图（统一 PNG）
      description: |
        按标注比例坐标换算像素矩形，向外扩约矩形短边 15% 的外边距（最小 8px，不超出图片边界），统一输出 PNG。
        源图为 WebP 时服务端解码；GIF 取第一帧。典型用途：AI 拉取裁剪图比对修改，或前端缩略展示。
        支持 Authorization 头或 `?token=` query 凭证（供 `<img>` 直链）。同一路径另注册 HEAD 变体。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotAnnotationId'
        - $ref: '#/components/parameters/QueryToken'
      responses:
        '200':
          description: PNG 图片二进制内容
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    head:
      tags: [screenshots]
      operationId: getScreenshotAnnotationCropHead
      summary: 获取标注裁剪图头信息（HEAD）
      description: 与 GET 语义相同但不返回 body。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ScreenshotAnnotationId'
        - $ref: '#/components/parameters/QueryToken'
      responses:
        '200':
          description: 仅响应头
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

