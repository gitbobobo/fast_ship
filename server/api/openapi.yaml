        repo_full_name:
          type: string
          description: owner/repo；允许与项目配置的仓库不同（跨仓库 attach）
        number:
          type: integer
        html_url:
          type: string
        title:
          type: string
        state:
          $ref: '#/components/schemas/IssuePullRequestState'
        is_draft:
          type: boolean
        author_login:
          type: string
        head_ref:
          type: string
        base_ref:
          type: string
