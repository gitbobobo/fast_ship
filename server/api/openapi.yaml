  /api/review-agent/runs/{runId}/result:
    post:
      tags: [review-agent]
      operationId: reviewAgentSubmitResult
      summary: 提交结构化审查结论
      description: |
        请求体按运行类型二选一：代码审查 `ReviewCodeResult`、视觉审查 `ReviewVisualResult`（字段校验失败返回 400，
        提示修正重交；PR HEAD 与运行绑定 SHA 不一致返回 40920 并作废本轮）。
        路径中的 runId 必须与令牌所属运行一致（错配 40307，不写结果、不消费令牌、不推进状态）。
        代码审查 findings 的文件必须存在于本运行 head_sha 的仓库树中，不存在的路径返回 40004。
      security:
        - runTokenAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
          description: 审查运行 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ReviewCodeResult'
                - $ref: '#/components/schemas/ReviewVisualResult'
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [accepted]
                        properties:
                          accepted:
                            type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: PR HEAD 已变化（40920），本轮作废
