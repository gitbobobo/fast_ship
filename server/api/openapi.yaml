                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/T3ThreadSummary'
                          environments:
                            type: array
                            items:
                              $ref: '#/components/schemas/T3Environment'
        '401':
          description: 运行令牌无效/过期/已消费（40106）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 凭证类型不允许（40304）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/automation-agent/environments/{id}/threads/{threadId}:
    get:
      tags: [automation-agent]
      operationId: getAgentThread
      summary: 读取单个 T3 线程详情（items 分页，默认最后 50 条）
      description: |
        与 JWT 端点同一线程详情口径，另加 items 分页：页内按时间正序；
        `before_item_id` 取该条目之前的上一页；引用的边界条目已消失时返回 409（40918）。
      security:
        - runTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/T3EnvironmentId'
        - name: threadId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before_item_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 线程详情（items 为分页后的窗口）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/T3ThreadDetail'
        '401':
          description: 运行令牌无效/过期/已消费（40106）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 凭证类型不允许（40304）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 环境/线程不存在（40417 / 40418）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 分页边界失效（40918）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/automation-agent/environments/{id}/threads/{threadId}/items/{itemId}:
    get:
      tags: [automation-agent]
      operationId: getAgentThreadItem
      summary: 读取单个线程条目完整正文
      security:
        - runTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/T3EnvironmentId'
        - name: threadId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 线程条目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/T3ThreadItem'
        '401':
          description: 运行令牌无效/过期/已消费（40106）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 凭证类型不允许（40304）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 环境/线程/条目不存在（40417 / 40418 / 40419）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/automation-agent/notifications:
    post:
      tags: [automation-agent]
      operationId: publishAgentNotification
      summary: 以运行身份发布站内通知
      description: kind 固定为 `agent`，不能冒充系统派发失败等系统 kind；同一问题键相同状态只刷新 last_seen_at。
      security:
        - runTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentNotificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 运行令牌无效/过期/已消费（40106）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 凭证类型不允许（40304）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/self-logs:
    get:
      tags: [self-logs]
      operationId: listSelfLogs
      summary: 分页查询 Fast Ship 自身日志（slog 采集，独立日志库）
      description: |
        只读查询 Fast Ship 服务端自身的结构化日志（INT-94，与 /projects/:id/logs 的业务日志无关）。
        可见范围：当前用户归属的日志（user_id 等于调用者），以及显式标记的系统行（无业务关联列的进程级启动日志）。
        无归属且未标系统的行（解析失败、键冲突、漏标）对任何认证用户均不可见。请求路径日志均带 user_id。
        传入他人 user_id 过滤只会得到空结果。游标为键集分页（时间+ID），插入不影响翻页稳定性；
        next_cursor 为 null 表示没有更多。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/SelfLogStartTime'
        - $ref: '#/components/parameters/SelfLogEndTime'
        - $ref: '#/components/parameters/SelfLogLevel'
        - $ref: '#/components/parameters/SelfLogMinLevel'
        - $ref: '#/components/parameters/SelfLogModules'
        - $ref: '#/components/parameters/SelfLogRequestID'
        - $ref: '#/components/parameters/SelfLogUserID'
        - $ref: '#/components/parameters/SelfLogProjectID'
        - $ref: '#/components/parameters/SelfLogIssueID'
        - $ref: '#/components/parameters/SelfLogAutomationID'
        - $ref: '#/components/parameters/SelfLogRunID'
        - $ref: '#/components/parameters/SelfLogThreadID'
        - $ref: '#/components/parameters/SelfLogExtraEq'
        - $ref: '#/components/parameters/SelfLogKeyword'
        - $ref: '#/components/parameters/SelfLogExcludeKeyword'
        - $ref: '#/components/parameters/SelfLogCursor'
        - $ref: '#/components/parameters/SelfLogLimit'
        - $ref: '#/components/parameters/SelfLogOrder'
        - $ref: '#/components/parameters/SelfLogFields'
      responses:
        '200':
          description: 日志分页列表（含下一页游标提示）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SelfLogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 凭证类型不允许（40301：fsr_ 运行令牌/刷新令牌无权查询自身日志）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/self-logs/aggregate:
    get:
      tags: [self-logs]
      operationId: aggregateSelfLogs
      summary: 按模块/级别/时间桶聚合统计自身日志条数
      description: |
        过滤条件与 GET /api/self-logs 完全一致，对命中条数按 `by` 维度组合分组计数；
        `by` 可多选（逗号分隔）；含 time 时 bucket 缺省为 minute（minute/hour）。
        可见范围与列表端点相同（本人归属 + 显式系统行；无主行不可见）。按时间桶聚合时保留最近 2000 个桶（超出 truncated=true）。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: by
          in: query
          required: true
          schema:
            type: string
          description: 聚合维度，逗号分隔组合，取值 module / level / time（如 `by=module,level`）
        - name: bucket
          in: query
          required: false
          schema:
            type: string
            enum: [minute, hour]
            default: minute
          description: 时间桶粒度；仅 by 含 time 时生效
        - $ref: '#/components/parameters/SelfLogStartTime'
        - $ref: '#/components/parameters/SelfLogEndTime'
        - $ref: '#/components/parameters/SelfLogLevel'
        - $ref: '#/components/parameters/SelfLogMinLevel'
        - $ref: '#/components/parameters/SelfLogModules'
        - $ref: '#/components/parameters/SelfLogRequestID'
        - $ref: '#/components/parameters/SelfLogUserID'
        - $ref: '#/components/parameters/SelfLogProjectID'
        - $ref: '#/components/parameters/SelfLogIssueID'
        - $ref: '#/components/parameters/SelfLogAutomationID'
        - $ref: '#/components/parameters/SelfLogRunID'
        - $ref: '#/components/parameters/SelfLogThreadID'
        - $ref: '#/components/parameters/SelfLogExtraEq'
        - $ref: '#/components/parameters/SelfLogKeyword'
        - $ref: '#/components/parameters/SelfLogExcludeKeyword'
      responses:
        '200':
          description: 聚合行（行数上限 2000；按桶时间倒序截断，truncated=true 表示还有更早的桶）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SelfLogAggregateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 凭证类型不允许（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/self-logs/trace:
    get:
      tags: [self-logs]
      operationId: traceSelfLogs
      summary: 按请求 ID 或 run ID 查询整条链路日志
      description: |
        返回该请求/运行从开始到结束的全部日志（时间正序）。可见范围与列表端点相同（本人归属 + 显式系统行；无主行不可见）。
        request_id 与 run_id 必须二选一；同请求的响应头 X-Request-Id 即查询键，
        失败请求（panic/5xx）的条目携带堆栈。上限 1000 条；超出时保留最新 1000 条（时间正序），truncated=true。
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/SelfLogRequestID'
        - $ref: '#/components/parameters/SelfLogRunID'
        - $ref: '#/components/parameters/SelfLogFields'
      responses:
        '200':
          description: 链路日志（时间正序；截断时 truncated=true）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SelfLogTraceResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 凭证类型不允许（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/github/webhooks:
    post:
      tags: [automation-agent]
      operationId: receiveGitHubWebhook
      summary: 接收 GitHub App webhook（pull_request opened/synchronize）
      description: |
        公开端点（无 JWT），以 `X-Hub-Signature-256`（HMAC-SHA256，webhook secret）验签。
        secret 未配置时返回 503，不接受未签名请求。只处理 pull_request 的 opened/synchronize；
        draft 与 fork 一律 202 忽略。仓库必须已和 Fast Ship 项目关联才会进入防抖/开轮。
        同一 `X-GitHub-Delivery` 幂等（重复投递返回 202 且不再开轮）。
      security: []
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitHub 官方 pull_request 事件 payload（原样验签，服务端只取 owner/repo、PR 号、head SHA、draft/fork 标记与 installation id）
      responses:
        '202':
          description: 已受理（含幂等重复、draft/fork、未关联仓库等忽略场景）
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: webhook secret 未配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/automation-agent/pull-request:
