                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Automation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [automations]
      operationId: updateAutomation
      summary: 更新自动化（只影响后续触发）
      description: 进行中的运行按创建时的配置快照执行，更新不中断已有运行。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/AutomationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAutomationRequest'
      responses:
        '200':
          description: 更新后的自动化
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Automation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: 未配置 server.public_url（41202）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [automations]
      operationId: deleteAutomation
      summary: 删除自动化
      description: 有活动运行（运行中或后置操作待执行）时返回 409（40919）；删除会级联清理历史运行记录。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/AutomationId'
      responses:
