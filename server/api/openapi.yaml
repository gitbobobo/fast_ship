        状态的写入只经机器人 fs_schedule 的 state_set，这是用户对该状态唯一的
        操作；随任务删除一并清除。
      security:
        - jwtAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectOrKeyId'
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 清空后的任务详情（state 与 state_updated_at 为 null）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BotScheduleTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bots/{id}/calls:
