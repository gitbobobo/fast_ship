        且 ok=false 表示可达性/兼容性问题。目录提供商的地址由目录决定；
        custom 必须给 base_url 与 model；目录提供商缺省用目录里第一个模型。
        models 为 /models 列表尽力拉取的模型 id（拉取失败不填充，不影响 ok）。
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestAIProviderRequest'
      responses:
        '200':
          description: 检查结果（ok=false 时检查项中带失败详情）
