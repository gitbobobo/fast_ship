            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: run 列表（新→旧）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/BotRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bots/{id}/runs/{runId}:
    get:
      tags: [bots]
      operationId: getBotRun
      summary: 读取运行记录
      security:
        - jwtAuth: []
