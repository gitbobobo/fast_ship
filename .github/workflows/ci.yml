name: CI

# 代码托管在 Forgejo（见 AGENTS.md「代码托管与 PR」）：PR 检查由本地代替
# （web/ 下 pnpm api-types --check + pnpm check），不接远端 CI；GitHub 仅是
# 只读推送镜像，这里的 push main 检查对镜像同步的提交做事后复核。
on:
  push:
    branches:
      - main

jobs:
  web-check:
    name: Web Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API types are up to date
        # --check 逐字节比对已提交的 api.gen.ts；文件缺失或与 yaml 不一致都退出非零，
        # 且不改动工作树（比重新生成 + git diff 严格——后者漏检未提交的生成文件）。
        run: pnpm api-types --check

      - name: Run web checks
        run: pnpm check
